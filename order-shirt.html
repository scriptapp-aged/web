<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เสื้อปฏิบัติการ 2569</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            background-color: #ffffff; /* ขาวล้วนบริสุทธิ์ */
            color: #000000; /* ดำสนิท */
            font-family: 'Prompt', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* จัดกึ่งกลางหน้าจอแบบนิ่งๆ */
        .wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }

        /* ลูกเล่น: เนื้อหาทั้งหมดจะค่อยๆ เฟดขึ้นมาอย่างนุ่มนวลและช้าลง (Ease-out) */
        .main-content {
            text-align: center;
            max-width: 500px;
            animation: superSmoothFade 1.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes superSmoothFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.95rem;
            font-weight: 300;
            color: #888888; /* สีเทาอ่อนเพื่อให้หัวข้อเด่นขึ้น */
            margin-bottom: 48px;
        }

        /* ลูกเล่น: เส้นแบ่งสไตล์มินิมอลที่ขยายตัวจากตรงกลางตอนโหลดหน้า */
        .line-separator {
            width: 15px;
            height: 1px;
            background-color: #000000;
            margin: 0 auto 48px auto;
            animation: lineExpand 1.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes lineExpand {
            from { width: 0px; }
            to { width: 15px; }
        }

        .contact-section {
            font-size: 0.9rem;
            font-weight: 300;
            line-height: 1.8;
            color: #111111;
        }

        /* ลูกเล่น: ลิงก์ LINE ที่มีเส้นใต้บางๆ และจะขยายระยะห่างตัวอักษรเมื่อ Hover */
        .line-contact {
            color: #000000;
            text-decoration: none;
            font-weight: 400;
            border-bottom: 1px solid #000000;
            padding-bottom: 2px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .line-contact:hover {
            letter-spacing: 1.5px;
            background-color: #000000;
            color: #ffffff;
            padding-left: 6px;
            padding-right: 4px;
        }

        /* ส่วนท้ายสุด: วางตำแหน่งไว้ล่างสุดของหน้าจออย่างถาวร */
        footer {
            position: absolute;
            bottom: 40px;
            font-size: 0.75rem;
            font-weight: 200;
            letter-spacing: 1.5px;
            color: #999999;
            text-align: center;
            width: 100%;
        }

        /* ปรับสัดส่วนบนมือถือขนาดเล็ก */
        @media (max-width: 480px) {
            h1 { font-size: 1.2rem; }
            .subtitle { font-size: 0.9rem; }
            footer { font-size: 0.7rem; bottom: 30px; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <div class="main-content">
            <h1>ปิดระบบคำสั่งซื้อเสื้อปฏิบัติการ 2569</h1>
            <p class="subtitle">วันรับเสื้อจะแจ้งให้ทราบภายหลัง</p>
            
            <div class="line-separator"></div>
            
            <div class="contact-section">
                หากพบข้อสงสัยติดต่อ นายเมธี ใจสุขดี (นิสิตชั้นปีที่ 3)<br>
                <a href="#" class="line-contact">Line : _maytee</a>
            </div>
        </div>

        <footer>
            คณะกรรมการชุมนุมฟาร์มนิสิต ปีการศึกษา 2569
        </footer>

    </div>

</body>
</html>
