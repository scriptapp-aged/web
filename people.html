<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คณะกรรมการฟาร์ม 2569</title>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ku-green: #006633;
      --ku-gold: #b2a05d;
      --text-dark: #1e293b;
      --text-gray: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Mitr', sans-serif; }
    body { background: #f8fafc; color: var(--text-dark); padding: 40px 15px; }

    .container { max-width: 1200px; margin: auto; }
    .header { text-align: center; margin-bottom: 50px; }
    .header h1 { font-size: 2.2rem; color: var(--ku-green); margin-bottom: 10px; }

    /* Layout Sections */
    .section-group { margin-bottom: 60px; }
    .section-title { text-align: center; margin-bottom: 30px; font-size: 1.4rem; color: var(--ku-green); position: relative; }
    .section-title::after { content: ''; display: block; width: 50px; height: 3px; background: var(--ku-gold); margin: 8px auto; }
    
    .grid-center { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; }

    /* Card Design */
    .card {
      width: 260px; background: white; border-radius: 12px; overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; cursor: pointer;
      border: 1px solid #e2e8f0; text-align: center; padding-bottom: 20px;
    }
    .card:hover { transform: translateY(-10px); box-shadow: 0 12px 25px rgba(0,0,0,0.1); border-color: var(--ku-green); }

    /* Cartoon Profile (In Card) */
    .avatar-box {
      background: #f1f5f9; padding: 30px 0; margin-bottom: 15px;
      border-bottom: 4px solid var(--ku-green);
    }
    .avatar-box img { width: 100px; height: 100px; border-radius: 50%; background: white; }

    .card .name { font-weight: 600; font-size: 1.1rem; padding: 0 10px; }
    .card .pos { color: var(--text-gray); font-size: 0.9rem; margin-top: 5px; }

    /* Modal Pop-up */
    .modal {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8);
      display: none; justify-content: center; align-items: center; z-index: 1000;
      backdrop-filter: blur(8px); padding: 20px;
    }
    .modal-content {
      background: white; width: 100%; max-width: 500px; border-radius: 20px;
      position: relative; animation: slideUp 0.4s ease-out; overflow: hidden;
    }
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .modal-header { height: 120px; background: var(--ku-green); }
    .close-btn { position: absolute; top: 15px; right: 20px; color: white; font-size: 1.5rem; cursor: pointer; z-index: 10; }

    .real-photo-wrap {
      width: 180px; height: 180px; margin: -90px auto 20px;
      border: 6px solid white; border-radius: 50%; overflow: hidden; background: #eee;
    }
    .real-photo-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .info-body { padding: 0 40px 40px; text-align: center; }
    .info-body h2 { font-size: 1.5rem; margin-bottom: 5px; }
    .info-body .tag { display: inline-block; padding: 4px 15px; background: #f0fdf4; color: var(--ku-green); border-radius: 20px; font-size: 0.85rem; margin-bottom: 20px; }
    
    .detail-grid { text-align: left; display: grid; grid-template-columns: 1fr; gap: 12px; }
    .detail-item { font-size: 0.95rem; border-bottom: 1px dashed #e2e8f0; padding-bottom: 8px; }
    .label { font-weight: 600; color: var(--text-gray); width: 80px; display: inline-block; }

  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>คณะกรรมการชุมนุมฟาร์มนิสิต</h1>
      <p style="letter-spacing: 2px; color: var(--text-gray);">ACADEMIC YEAR 2026</p>
    </div>

    <!-- 1. อาจารย์ที่ปรึกษา -->
    <div class="section-group">
      <h2 class="section-title">อาจารย์ที่ปรึกษา</h2>
      <div id="advisor-grid" class="grid-center"></div>
    </div>

    <!-- 2. ประธาน (อยู่บนสุดของนิสิต) -->
    <div class="section-group">
      <h2 class="section-title">ประธานชุมนุม</h2>
      <div id="president-grid" class="grid-center"></div>
    </div>

    <!-- 3. คณะกรรมการอื่นๆ -->
    <div class="section-group">
      <h2 class="section-title">คณะกรรมการฝ่ายบริหาร</h2>
      <div id="committee-grid" class="grid-center"></div>
    </div>
  </div>

  <!-- Modal -->
  <div id="infoModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div class="modal-header"></div>
      <div class="real-photo-wrap" id="m-photo"></div>
      
      <div class="info-body">
        <h2 id="m-name">ชื่อ นามสกุล</h2>
        <div id="m-pos" class="tag">ตำแหน่ง</div>
        
        <div class="detail-grid">
          <div class="detail-item"><span class="label">สาขา:</span> <span id="m-major">-</span></div>
          <div class="detail-item"><span class="label">ชั้นปี:</span> <span id="m-year">-</span></div>
          <div class="detail-item"><span class="label">ติดต่อ:</span> <span id="m-contact">-</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- ข้อมูลแยกรายบุคคล ---
    const data = [
      {
        id: 1, type: 'advisor', pos: 'อาจารย์ที่ปรึกษา', name: 'ผศ.ดร.นิรันดร์ ยิ่งยวด',
        major: 'ภาควิชาสัตวบาล', year: '-', contact: 'niran.y@ku.th',
        gender: 'male', realImg: '12.jpg' 
      },
      {
        id: 2, type: 'advisor', pos: 'อาจารย์ที่ปรึกษา', name: 'อ.ดร.อรวรรณ บุญทัน',
        major: 'ภาควิชาสัตวบาล', year: '-', contact: 'orawan.b@ku.th',
        gender: 'female', realImg: 'web.jpg'
      },
      {
        id: 3, type: 'president', pos: 'ประธานชุมนุม', name: 'นายศุภเสกย์ นิลเทพา',
        major: 'สัตวบาล', year: 'ชั้นปีที่ 3', contact: '08x-xxx-xxxx / FB: Supasek',
        gender: 'male', realImg: 'pres.jpg' // เปลี่ยนชื่อไฟล์รูปจริงตรงนี้
      },
      {
        id: 4, type: 'committee', pos: 'รองประธานคนที่ 1', name: 'นายกนกพล แซ่แต้',
        major: 'สัตวบาล', year: 'ชั้นปีที่ 2', contact: 'Line: kanok_lp',
        gender: 'male', realImg: 'kanok.jpg'
      },
      {
        id: 5, type: 'committee', pos: 'รองประธานคนที่ 2', name: 'นายธีระพล สมพงษ์',
        major: 'สัตวบาล', year: 'ชั้นปีที่ 2', contact: 'FB: Teerapol S.',
        gender: 'male', realImg: 'teera.jpg'
      },
      {
        id: 6, type: 'committee', pos: 'เลขานุการ', name: 'นางสาวทรายขวัญ วาปีโท',
        major: 'สัตวบาล', year: 'ชั้นปีที่ 2', contact: 'IG: saikwan_wp',
        gender: 'female', realImg: 'sai.jpg'
      }
    ];

    function createCard(person) {
      // สร้าง Avatar การ์ตูนสำหรับหน้า Card
      const avatarSeed = person.gender === 'female' ? `&gender=female&seed=${person.id}` : `&seed=${person.id}`;
      const cartoonUrl = `https://api.dicebear.com/7.x/avataaars/svg?mouth=smile${avatarSeed}`;

      return `
        <div class="card" onclick="openModal(${person.id})">
          <div class="avatar-box">
            <img src="${cartoonUrl}" alt="avatar">
          </div>
          <div class="name">${person.name}</div>
          <div class="pos">${person.pos}</div>
        </div>
      `;
    }

    function renderAll() {
      data.forEach(p => {
        const html = createCard(p);
        if(p.type === 'advisor') document.getElementById('advisor-grid').innerHTML += html;
        else if(p.type === 'president') document.getElementById('president-grid').innerHTML += html;
        else document.getElementById('committee-grid').innerHTML += html;
      });
    }

    function openModal(id) {
      const person = data.find(p => p.id === id);
      document.getElementById('m-name').innerText = person.name;
      document.getElementById('m-pos').innerText = person.pos;
      document.getElementById('m-major').innerText = person.major;
      document.getElementById('m-year').innerText = person.year;
      document.getElementById('m-contact').innerText = person.contact;
      
      // แสดงรูปจริงใน Pop-up
      document.getElementById('m-photo').innerHTML = `<img src="${person.realImg}" onerror="this.src='https://via.placeholder.com/150?text=No+Photo'">`;
      
      document.getElementById('infoModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('infoModal').style.display = 'none';
    }

    window.onload = renderAll;
  </script>
</body>
</html>
