<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คณะกรรมการฟาร์ม 2569</title>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ku-green: #006633;
      --text-dark: #0f172a;
      --text-gray: #64748b;
      --bg: #f4f6f9;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Mitr', sans-serif; }
    body { background: var(--bg); padding: 50px 20px; }

    .container {
      max-width: 1200px;
      margin: auto;
      background: white;
      padding: 40px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .header { text-align: center; margin-bottom: 50px; }
    .header h1 { color: var(--ku-green); font-size: 2.2rem; }

    /* Layout */
    .section-title { text-align: center; margin: 30px 0; font-weight: 600; color: var(--ku-green); }
    .grid-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; }

    /* Card */
    .card {
      width: 250px; background: #fff; border: 1px solid #eee;
      border-top: 5px solid var(--ku-green); padding: 25px 15px;
      text-align: center; cursor: pointer; transition: 0.3s;
    }
    .card:hover { transform: translateY(-8px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

    .photo-circle {
      width: 120px; height: 120px; margin: 0 auto 15px;
      border-radius: 50%; overflow: hidden; background: #f0f0f0;
      border: 2px solid #eee;
    }
    .photo-circle img { width: 100%; height: 100%; object-fit: cover; }

    .name { font-size: 1.1rem; font-weight: 500; }
    .pos { color: var(--text-gray); font-size: 0.9rem; }

    /* Modal */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: none; justify-content: center; align-items: center; z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal-content {
      background: white; padding: 40px; width: 90%; max-width: 400px;
      text-align: center; position: relative;
    }
    .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 1.5rem; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>คณะกรรมการชุมนุมฟาร์มนิสิต 2569</h1>
    </div>

    <div id="advisor-list" class="grid-container"></div>
    <hr style="margin: 40px 0; opacity: 0.2;">
    <div id="committee-list" class="grid-container"></div>
  </div>

  <!-- Pop-up -->
  <div id="infoModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="modal-img" class="photo-circle" style="width:150px; height:150px;"></div>
      <h2 id="modal-name"></h2>
      <p id="modal-pos" style="color:var(--ku-green)"></p>
      <p style="margin-top:15px; font-size: 0.85rem; color: #999;">ข้อมูลสมาชิกชุมนุมฟาร์มนิสิต ปี 2569</p>
    </div>
  </div>

  <script>
    // --- 1. ส่วนของข้อมูล (Data) ---
    // คุณสามารถเพิ่ม/ลบ ข้อมูลตรงนี้ได้เลย
    const members = [
      { id: 1, name: "ผศ.ดร.นิรันดร์ ยิ่งยวด", pos: "อาจารย์ที่ปรึกษา", gender: "male", type: "advisor" },
      { id: 2, name: "อ.ดร.อรวรรณ บุญทัน", pos: "อาจารย์ที่ปรึกษา", gender: "female", type: "advisor" },
      { id: 3, name: "นายศุภเสกย์ นิลเทพา", pos: "ประธานชุมนุม", gender: "male", type: "committee" },
      { id: 4, name: "นายกนกพล แซ่แต้", pos: "รองประธานชุมนุมคนที่ 1", gender: "male", type: "committee" },
      { id: 5, name: "นายธีระพล สมพงษ์", pos: "รองประธานชุมนุมคนที่ 2", gender: "male", type: "committee" },
      { id: 6, name: "นางสาวทรายขวัญ วาปีโท", pos: "เลขานุการ", gender: "female", type: "committee" },
      { id: 7, name: "นายเมธี ใจสุขดี", pos: "เหรัญญิก", gender: "male", type: "committee" }
    ];

    // --- 2. ฟังก์ชันแสดงผลการ์ด ---
    function renderCards() {
      const advisorContainer = document.getElementById('advisor-list');
      const committeeContainer = document.getElementById('committee-list');

      members.forEach(m => {
        // เลือกรูปการ์ตูนตามเพศ
        const avatarStyle = m.gender === 'male' ? 'avataaars' : 'avataaars';
        const imgUrl = `https://api.dicebear.com/7.x/${avatarStyle}/svg?seed=${m.id}${m.gender==='female'?'&gender=female':''}`;

        const cardHtml = `
          <div class="card" onclick="openModal('${m.name}', '${m.pos}', '${imgUrl}')">
            <div class="photo-circle">
              <img src="${imgUrl}" alt="profile">
            </div>
            <div class="name">${m.name}</div>
            <div class="pos">${m.pos}</div>
          </div>
        `;

        if(m.type === 'advisor') advisorContainer.innerHTML += cardHtml;
        else committeeContainer.innerHTML += cardHtml;
      });
    }

    // --- 3. ฟังก์ชัน Pop-up ---
    function openModal(name, pos, img) {
      document.getElementById('modal-name').innerText = name;
      document.getElementById('modal-pos').innerText = pos;
      document.getElementById('modal-img').innerHTML = `<img src="${img}">`;
      document.getElementById('infoModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('infoModal').style.display = 'none';
    }

    // รันโปรแกรม
    renderCards();
  </script>
</body>
</html>
