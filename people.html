<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>คณะกรรมการฟาร์ม ปีการศึกษา 2569</title>

  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: 'Mali', cursive;
    }

    body{
      background: linear-gradient(135deg,#dff6e4,#f5fff7);
      min-height:100vh;
      overflow-x:hidden;
      padding:40px 20px;
    }

    .container{
      max-width:1200px;
      margin:auto;
      text-align:center;
    }

    .title{
      margin-bottom:50px;
    }

    .title h1{
      font-size:3rem;
      color:#14532d;
      font-weight:700;
    }

    .title p{
      margin-top:10px;
      color:#4b5563;
      font-size:1.1rem;
    }

    /* เส้นเชื่อม */
    .line{
      width:4px;
      height:40px;
      background:#22c55e;
      margin:20px auto;
      border-radius:10px;
    }

    .line-horizontal{
      height:4px;
      background:#22c55e;
      border-radius:10px;
      margin:auto;
    }

    /* กล่องบุคคล */
    .card{
      background:white;
      width:230px;
      padding:20px;
      border-radius:25px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
      transition:.3s;
      position:relative;
    }

    .card:hover{
      transform:translateY(-8px);
    }

    .avatar{
      width:95px;
      height:95px;
      border-radius:50%;
      background:linear-gradient(135deg,#22c55e,#86efac);
      margin:auto;
      margin-bottom:15px;
      border:5px solid #dcfce7;
    }

    .name{
      font-size:1.15rem;
      font-weight:700;
      color:#14532d;
    }

    .position{
      margin-top:8px;
      color:#4b5563;
      font-size:.95rem;
    }

    /* แถว */
    .row{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:40px;
      flex-wrap:wrap;
    }

    /* รอง 4 คน */
    .committee{
      margin-top:40px;
    }

    .committee .card{
      width:210px;
    }

    /* ตกแต่งพื้นหลัง */
    .blur{
      position:fixed;
      width:350px;
      height:350px;
      background:#bbf7d0;
      filter:blur(120px);
      z-index:-1;
      opacity:.5;
    }

    .blur1{
      top:-100px;
      left:-100px;
    }

    .blur2{
      bottom:-100px;
      right:-100px;
    }

    @media(max-width:768px){

      .title h1{
        font-size:2rem;
      }

      .card{
        width:100%;
        max-width:300px;
      }

      .committee{
        gap:20px;
      }
    }

  </style>
</head>
<body>

  <div class="blur blur1"></div>
  <div class="blur blur2"></div>

  <div class="container">

    <div class="title">
      <h1>คณะกรรมการฟาร์ม</h1>
      <p>ปีการศึกษา 2569</p>
    </div>

    <!-- อาจารย์ -->
    <div class="row">

      <div class="card">
        <div class="avatar"></div>
        <div class="name">อาจารย์ท่านที่ 1</div>
        <div class="position">อาจารย์ที่ปรึกษา</div>
      </div>

      <div class="card">
        <div class="avatar"></div>
        <div class="name">อาจารย์ท่านที่ 2</div>
        <div class="position">อาจารย์ที่ปรึกษา</div>
      </div>

    </div>

    <div class="line"></div>

    <!-- ประธาน -->
    <div class="row">

      <div class="card" style="width:270px;">
        <div class="avatar"></div>
        <div class="name">ชื่อประธานฟาร์ม</div>
        <div class="position">ประธานฟาร์ม</div>
      </div>

    </div>

    <div class="line"></div>

    <!-- กรรมการ -->
    <div class="row committee">

      <div class="card">
        <div class="avatar"></div>
        <div class="name">กรรมการ 1</div>
        <div class="position">รองประธานฝ่ายบริหาร</div>
      </div>

      <div class="card">
        <div class="avatar"></div>
        <div class="name">กรรมการ 2</div>
        <div class="position">รองประธานฝ่ายกิจกรรม</div>
      </div>

      <div class="card">
        <div class="avatar"></div>
        <div class="name">กรรมการ 3</div>
        <div class="position">รองประธานฝ่ายวิชาการ</div>
      </div>

      <div class="card">
        <div class="avatar"></div>
        <div class="name">กรรมการ 4</div>
        <div class="position">รองประธานฝ่ายประชาสัมพันธ์</div>
      </div>

    </div>

  </div>

</body>
</html>
