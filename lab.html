<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสั่งจองเสื้อปฏิบัติการ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #FAFAFA; /* ขาว/เทาอ่อนมาก */
            color: #171717; /* ดำ */
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* แอนิเมชันความสมูทแบบเรียบง่าย */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* ซ่อน Scrollbar แบบเรียบง่าย */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4d4d8; }
        ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }

        /* ปรับแต่ง input number ไม่ให้มีลูกศร */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const CheckCircle = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;
        const Package = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>;
        const Copy = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>;
        const AlertCircle = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;

        function App() {
            const [currentPath, setCurrentPath] = useState(window.location.hash);

            useEffect(() => {
                const onLocationChange = () => setCurrentPath(window.location.hash);
                window.addEventListener('hashchange', onLocationChange);
                return () => window.removeEventListener('hashchange', onLocationChange);
            }, []);
            
            const [orders, setOrders] = useState([
                { id: 'ORD-1698745', date: '2026-06-14 09:30', name: 'สมชาย ใจดี', studentId: '67010001', year: '1', phone: '0812345678', shirtType: 'tshirt', size: 'L', qty: 1, amount: 200, status: 'รอตรวจสอบ' },
                { id: 'ORD-1698746', date: '2026-06-15 10:15', name: 'สมหญิง รักเรียน', studentId: '66010025', year: '2', phone: '0898765432', shirtType: 'jeans', size: 'พิเศษ (3XL อก 46")', qty: 2, amount: 740, status: 'ยืนยันแล้ว' },
            ]);

            const getTshirtPrice = (isCustom) => isCustom ? 220 : 200;
            const getJeansPrice = (isCustom) => isCustom ? 370 : 350;

            const TSHIRT_SIZES = [
                { value: 'S', label: 'อก 36"' }, { value: 'M', label: 'อก 38"' },
                { value: 'L', label: 'อก 40"' }, { value: 'XL', label: 'อก 42"' },
                { value: '2XL', label: 'อก 44"' }, { value: '3XL', label: 'อก 46"' }
            ];

            const JEANS_SIZES = [
                { value: 'S', label: 'อก 36"' }, { value: 'M', label: 'อก 38"' },
                { value: 'L', label: 'อก 40"' }, { value: 'XL', label: 'อก 42"' },
                { value: '2XL', label: 'อก 44"' }
            ];

            const UserView = () => {
                const [formData, setFormData] = useState({ 
                    name: '', studentId: '', year: '1', phone: '',
                    tshirt: { isCustom: false, size: '', customSize: '', customChest: '', qty: 0 }, 
                    jeans: { isCustom: false, size: '', customSize: '', customChest: '', qty: 0 }, 
                    slip: null 
                });
                
                const [submitted, setSubmitted] = useState(false);
                const [copied, setCopied] = useState(false);
                const [errorMsg, setErrorMsg] = useState('');

                const targetDate = useMemo(() => new Date('2026-06-21T23:59:59').getTime(), []);
                const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });

                useEffect(() => {
                    const interval = setInterval(() => {
                        const now = new Date().getTime();
                        const distance = targetDate - now;
                        if (distance < 0) {
                            clearInterval(interval);
                            setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0 });
                        } else {
                            setTimeLeft({
                                days: Math.floor(distance / (1000 * 60 * 60 * 24)),
                                hours: Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                                minutes: Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)),
                                seconds: Math.floor((distance % (1000 * 60)) / 1000)
                            });
                        }
                    }, 1000);
                    return () => clearInterval(interval);
                }, [targetDate]);

                const handleCopy = () => {
                    const tempInput = document.createElement("input");
                    tempInput.value = "012-3-45678-9";
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand("copy");
                    document.body.removeChild(tempInput);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                };

                const totalAmount = (formData.tshirt.qty * getTshirtPrice(formData.tshirt.isCustom)) +
                                    (formData.jeans.qty * getJeansPrice(formData.jeans.isCustom));

                const getFinalSize = (item) => {
                    if (item.isCustom) return `พิเศษ (${item.customSize} อก ${item.customChest}")`;
                    return item.size;
                };

                const handleSubmit = (e) => {
                    e.preventDefault();
                    setErrorMsg('');
                    
                    if (formData.tshirt.qty === 0 && formData.jeans.qty === 0) {
                        setErrorMsg("กรุณาระบุจำนวนเสื้อที่ต้องการสั่งจองอย่างน้อย 1 ตัว");
                        return;
                    }

                    if (formData.tshirt.qty > 0 && formData.tshirt.isCustom && (!formData.tshirt.customSize || !formData.tshirt.customChest)) {
                        setErrorMsg("กรุณาระบุชื่อไซส์และรอบอก สำหรับเสื้อยืดไซส์พิเศษ");
                        return;
                    }
                    if (formData.jeans.qty > 0 && formData.jeans.isCustom && (!formData.jeans.customSize || !formData.jeans.customChest)) {
                        setErrorMsg("กรุณาระบุชื่อไซส์และรอบอก สำหรับเสื้อยีนส์ไซส์พิเศษ");
                        return;
                    }
                    if (formData.tshirt.qty > 0 && !formData.tshirt.isCustom && !formData.tshirt.size) {
                        setErrorMsg("กรุณาเลือกไซส์สำหรับเสื้อยืด");
                        return;
                    }
                    if (formData.jeans.qty > 0 && !formData.jeans.isCustom && !formData.jeans.size) {
                        setErrorMsg("กรุณาเลือกไซส์สำหรับเสื้อยีนส์");
                        return;
                    }

                    const baseId = `ORD-${Math.floor(Math.random() * 1000000)}`;
                    const dateStr = new Date().toLocaleString('th-TH').slice(0, 16);
                    const newOrders = [];

                    if (formData.tshirt.qty > 0) {
                        newOrders.push({
                            id: baseId, date: dateStr, name: formData.name, studentId: formData.studentId, year: formData.year, phone: formData.phone,
                            shirtType: 'tshirt', size: getFinalSize(formData.tshirt), qty: parseInt(formData.tshirt.qty),
                            amount: parseInt(formData.tshirt.qty) * getTshirtPrice(formData.tshirt.isCustom), status: 'รอตรวจสอบ'
                        });
                    }

                    if (formData.jeans.qty > 0) {
                        newOrders.push({
                            id: baseId, date: dateStr, name: formData.name, studentId: formData.studentId, year: formData.year, phone: formData.phone,
                            shirtType: 'jeans', size: getFinalSize(formData.jeans), qty: parseInt(formData.jeans.qty),
                            amount: parseInt(formData.jeans.qty) * getJeansPrice(formData.jeans.isCustom), status: 'รอตรวจสอบ'
                        });
                    }

                    setOrders([...orders, ...newOrders]);
                    setSubmitted(true);
                };

                if (submitted) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-4">
                            <div className="max-w-md w-full bg-white p-10 border border-zinc-200 text-center animate-fade">
                                <CheckCircle className="w-12 h-12 text-black mx-auto mb-6" />
                                <h2 className="text-2xl font-medium text-black mb-3">สั่งจองสำเร็จ</h2>
                                <p className="text-zinc-500 mb-8 text-sm font-light leading-relaxed">ข้อมูลการสั่งจองและหลักฐานการโอนเงิน<br/>ถูกส่งเข้าระบบเรียบร้อยแล้ว</p>
                                <button onClick={() => {
                                    setSubmitted(false); 
                                    setFormData({ name: '', studentId: '', year: '1', phone: '', tshirt: { isCustom: false, size: '', customSize: '', customChest: '', qty: 0 }, jeans: { isCustom: false, size: '', customSize: '', customChest: '', qty: 0 }, slip: null });
                                }} className="px-8 py-3 bg-black text-white text-sm rounded-none hover:bg-zinc-800 transition-colors w-full">
                                    ทำรายการสั่งจองใหม่
                                </button>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="min-h-screen flex flex-col selection:bg-zinc-200">
                        
                        {/* Navbar แบบ Minimal */}
                        <nav className="bg-white border-b border-zinc-200 sticky top-0 z-50">
                            <div className="max-w-3xl mx-auto px-4 sm:px-6">
                                <div className="flex h-14 items-center gap-2">
                                    <span className="font-semibold text-lg tracking-widest uppercase text-black">SCI-LAB <span className="text-zinc-400 font-light">SHOP</span></span>
                                </div>
                            </div>
                        </nav>

                        <div className="flex-grow p-4 sm:p-6 lg:py-10">
                            <div className="max-w-3xl mx-auto bg-white p-6 md:p-10 border border-zinc-200 shadow-sm animate-fade">
                                
                                {/* ส่วนหัวเรื่อง และ นาฬิกานับถอยหลัง */}
                                <div className="mb-12 text-center">
                                    <div className="w-20 h-20 mx-auto mb-6 bg-white border border-zinc-200 flex items-center justify-center overflow-hidden">
                                        <img src="./images/logo.png" alt="ตราสาขา" className="w-full h-full object-cover" onError={(e)=>{e.target.style.opacity='0'}} />
                                        <span className="text-xs text-zinc-400 font-light absolute">ตราสาขา</span>
                                    </div>

                                    <h2 className="text-2xl sm:text-3xl font-medium text-black tracking-tight mb-2">
                                        แบบสั่งจองเสื้อปฏิบัติการ
                                    </h2>
                                    <p className="text-lg text-zinc-500 font-light mb-6">"เกษตรและสิ่งแวดล้อมศึกษา"</p>
                                    
                                    <div className="inline-block border border-zinc-200 px-6 py-2 mb-10 text-sm text-zinc-500 font-light">
                                        เปิดระบบ 14 มิ.ย. 69 <span className="mx-3 text-zinc-300">|</span> ปิดระบบ 21 มิ.ย. 69
                                    </div>

                                    {/* นาฬิกานับถอยหลัง Minimal */}
                                    <div className="flex flex-col items-center justify-center">
                                        <p className="text-xs text-zinc-400 uppercase tracking-[0.2em] mb-4">เหลือเวลาสั่งเสื้ออีก</p>
                                        <div className="flex gap-4 sm:gap-8 items-end justify-center text-center">
                                            <div className="flex flex-col min-w-[3rem]">
                                                <span className="text-4xl font-light text-black">{timeLeft.days}</span>
                                                <span className="text-[10px] text-zinc-400 uppercase mt-2 tracking-widest">วัน</span>
                                            </div>
                                            <span className="text-2xl font-light text-zinc-300 mb-6">:</span>
                                            <div className="flex flex-col min-w-[3rem]">
                                                <span className="text-4xl font-light text-black">{timeLeft.hours.toString().padStart(2, '0')}</span>
                                                <span className="text-[10px] text-zinc-400 uppercase mt-2 tracking-widest">ชั่วโมง</span>
                                            </div>
                                            <span className="text-2xl font-light text-zinc-300 mb-6">:</span>
                                            <div className="flex flex-col min-w-[3rem]">
                                                <span className="text-4xl font-light text-black">{timeLeft.minutes.toString().padStart(2, '0')}</span>
                                                <span className="text-[10px] text-zinc-400 uppercase mt-2 tracking-widest">นาที</span>
                                            </div>
                                            <span className="text-2xl font-light text-zinc-300 mb-6">:</span>
                                            <div className="flex flex-col min-w-[3rem]">
                                                <span className="text-4xl font-light text-black">{timeLeft.seconds.toString().padStart(2, '0')}</span>
                                                <span className="text-[10px] text-zinc-400 uppercase mt-2 tracking-widest">วินาที</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <hr className="border-zinc-100 mb-10" />

                                <form onSubmit={handleSubmit} className="space-y-12">
                                    
                                    {/* ข้อมูลส่วนตัว */}
                                    <div>
                                        <h3 className="text-sm font-medium text-black uppercase tracking-widest mb-6">1. ข้อมูลผู้สั่งจอง</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                            <div>
                                                <label className="block text-xs text-zinc-500 mb-2">ชื่อ-นามสกุล</label>
                                                <input required type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-4 py-2.5 bg-transparent border border-zinc-300 focus:border-black focus:ring-1 focus:ring-black outline-none transition-colors text-sm" placeholder="นายสมชาย ใจดี" />
                                            </div>
                                            <div>
                                                <label className="block text-xs text-zinc-500 mb-2">รหัสนิสิต</label>
                                                <input required type="text" value={formData.studentId} onChange={e => setFormData({...formData, studentId: e.target.value})} className="w-full px-4 py-2.5 bg-transparent border border-zinc-300 focus:border-black focus:ring-1 focus:ring-black outline-none transition-colors text-sm" placeholder="670xxxxxx" />
                                            </div>
                                            <div>
                                                <label className="block text-xs text-zinc-500 mb-2">ชั้นปี</label>
                                                <select value={formData.year} onChange={e => setFormData({...formData, year: e.target.value})} className="w-full px-4 py-2.5 bg-transparent border border-zinc-300 focus:border-black focus:ring-1 focus:ring-black outline-none transition-colors text-sm">
                                                    <option value="1">ชั้นปีที่ 1</option>
                                                    <option value="2">ชั้นปีที่ 2</option>
                                                    <option value="3">ชั้นปีที่ 3</option>
                                                    <option value="4">ชั้นปีที่ 4</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs text-zinc-500 mb-2">เบอร์โทรศัพท์ติดต่อ</label>
                                                <input required type="tel" pattern="[0-9]{9,10}" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full px-4 py-2.5 bg-transparent border border-zinc-300 focus:border-black focus:ring-1 focus:ring-black outline-none transition-colors text-sm" placeholder="08xxxxxxxx" />
                                            </div>
                                        </div>
                                    </div>

                                    <hr className="border-zinc-100" />

                                    {/* เสื้อยืด */}
                                    <div>
                                        <h3 className="text-sm font-medium text-black uppercase tracking-widest mb-6">2. เสื้อยืดปฏิบัติการ</h3>
                                        
                                        <div className="grid grid-cols-2 gap-4 mb-8">
                                            <div className="aspect-[4/3] bg-zinc-50 border border-zinc-200 flex items-center justify-center overflow-hidden relative">
                                                <img src="./หน้า.png" alt="ด้านหน้า" className="w-full h-full object-cover relative z-10" onError={(e)=>{e.target.style.opacity='0'}} />
                                                <div className="absolute inset-0 flex flex-col items-center justify-center text-zinc-300">
                                                    <Package className="w-6 h-6 mb-2" />
                                                    <span className="text-[10px] uppercase tracking-wider">ด้านหน้า</span>
                                                </div>
                                            </div>
                                            <div className="aspect-[4/3] bg-zinc-50 border border-zinc-200 flex items-center justify-center overflow-hidden relative">
                                                <img src="หลัง.png" alt="ด้านหลัง" className="w-full h-full object-cover relative z-10" onError={(e)=>{e.target.style.opacity='0'}} />
                                                <div className="absolute inset-0 flex flex-col items-center justify-center text-zinc-300">
                                                    <Package className="w-6 h-6 mb-2" />
                                                    <span className="text-[10px] uppercase tracking-wider">ด้านหลัง</span>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="mb-6">
                                            <label className="block text-xs text-zinc-500 mb-3">เลือกไซส์เสื้อยืด</label>
                                            <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
                                                {TSHIRT_SIZES.map(s => (
                                                    <button key={`ts-${s.value}`} type="button" onClick={() => setFormData({...formData, tshirt: {...formData.tshirt, isCustom: false, size: s.value, qty: formData.tshirt.qty === 0 ? 1 : formData.tshirt.qty}})}
                                                        className={`p-2 border text-center transition-colors ${(!formData.tshirt.isCustom && formData.tshirt.size === s.value) ? 'bg-black text-white border-black' : 'bg-transparent text-zinc-600 border-zinc-300 hover:border-black'}`}>
                                                        <div className="font-medium">{s.value}</div>
                                                        <div className="text-[10px] opacity-70 border-b border-current pb-1 mb-1 mx-2">{s.label}</div>
                                                        <div className="text-[10px]">฿200</div>
                                                    </button>
                                                ))}
                                                <button type="button" onClick={() => setFormData({...formData, tshirt: {...formData.tshirt, isCustom: true, size: '', qty: formData.tshirt.qty === 0 ? 1 : formData.tshirt.qty}})}
                                                    className={`p-2 border text-center transition-colors ${formData.tshirt.isCustom ? 'bg-black text-white border-black' : 'bg-transparent text-zinc-600 border-zinc-300 hover:border-black'}`}>
                                                    <div className="font-medium">พิเศษ</div>
                                                    <div className="text-[10px] opacity-70 border-b border-current pb-1 mb-1 mx-2">ระบุเอง</div>
                                                    <div className="text-[10px]">฿220</div>
                                                </button>
                                            </div>
                                        </div>

                                        {formData.tshirt.isCustom && (
                                            <div className="grid grid-cols-2 gap-4 mb-6 p-4 border border-zinc-200 bg-zinc-50 animate-fade">
                                                <div>
                                                    <label className="block text-xs text-zinc-500 mb-2">ชื่อไซส์ (เช่น 4XL)</label>
                                                    <input type="text" value={formData.tshirt.customSize} onChange={e => setFormData({...formData, tshirt: {...formData.tshirt, customSize: e.target.value}})} className="w-full px-3 py-2 bg-white border border-zinc-300 focus:border-black outline-none text-sm" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-zinc-500 mb-2">รอบอก (นิ้ว)</label>
                                                    <input type="number" value={formData.tshirt.customChest} onChange={e => setFormData({...formData, tshirt: {...formData.tshirt, customChest: e.target.value}})} className="w-full px-3 py-2 bg-white border border-zinc-300 focus:border-black outline-none text-sm" />
                                                </div>
                                            </div>
                                        )}

                                        <div>
                                            <label className="block text-xs text-zinc-500 mb-2">จำนวน (ปล่อยเป็น 0 หากไม่สั่ง)</label>
                                            <div className="flex items-center w-32 border border-zinc-300">
                                                <button type="button" onClick={() => setFormData({...formData, tshirt: {...formData.tshirt, qty: Math.max(0, formData.tshirt.qty - 1)}})} className="w-10 h-10 flex items-center justify-center hover:bg-zinc-100 transition-colors">-</button>
                                                <input type="number" min="0" value={formData.tshirt.qty} onChange={e => setFormData({...formData, tshirt: {...formData.tshirt, qty: parseInt(e.target.value) || 0}})} className="w-12 h-10 border-x border-zinc-300 bg-transparent text-center outline-none text-sm" />
                                                <button type="button" onClick={() => setFormData({...formData, tshirt: {...formData.tshirt, qty: formData.tshirt.qty + 1}})} className="w-10 h-10 flex items-center justify-center hover:bg-zinc-100 transition-colors">+</button>
                                            </div>
                                        </div>
                                    </div>

                                    <hr className="border-zinc-100" />

                                    {/* เสื้อยีนส์ */}
                                    <div>
                                        <h3 className="text-sm font-medium text-black uppercase tracking-widest mb-6">3. เสื้อยีนส์ (ช็อป)</h3>
                                        
                                        <div className="w-2/3 sm:w-1/2 mx-auto aspect-[4/5] bg-zinc-50 border border-zinc-200 flex items-center justify-center overflow-hidden relative mb-8">
                                            <img src="ยีนส์.png" alt="เสื้อยีนส์" className="w-full h-full object-cover relative z-10" onError={(e)=>{e.target.style.opacity='0'}} />
                                            <div className="absolute inset-0 flex flex-col items-center justify-center text-zinc-300">
                                                <Package className="w-6 h-6 mb-2" />
                                                <span className="text-[10px] uppercase tracking-wider">ตัวอย่าง</span>
                                            </div>
                                        </div>

                                        <div className="mb-6">
                                            <label className="block text-xs text-zinc-500 mb-3">เลือกไซส์เสื้อยีนส์</label>
                                            <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
                                                {JEANS_SIZES.map(s => (
                                                    <button key={`jn-${s.value}`} type="button" onClick={() => setFormData({...formData, jeans: {...formData.jeans, isCustom: false, size: s.value, qty: formData.jeans.qty === 0 ? 1 : formData.jeans.qty}})}
                                                        className={`p-2 border text-center transition-colors ${(!formData.jeans.isCustom && formData.jeans.size === s.value) ? 'bg-black text-white border-black' : 'bg-transparent text-zinc-600 border-zinc-300 hover:border-black'}`}>
                                                        <div className="font-medium">{s.value}</div>
                                                        <div className="text-[10px] opacity-70 border-b border-current pb-1 mb-1 mx-2">{s.label}</div>
                                                        <div className="text-[10px]">฿350</div>
                                                    </button>
                                                ))}
                                                <button type="button" onClick={() => setFormData({...formData, jeans: {...formData.jeans, isCustom: true, size: '', qty: formData.jeans.qty === 0 ? 1 : formData.jeans.qty}})}
                                                    className={`p-2 border text-center transition-colors ${formData.jeans.isCustom ? 'bg-black text-white border-black' : 'bg-transparent text-zinc-600 border-zinc-300 hover:border-black'}`}>
                                                    <div className="font-medium">พิเศษ</div>
                                                    <div className="text-[10px] opacity-70 border-b border-current pb-1 mb-1 mx-2">ระบุเอง</div>
                                                    <div className="text-[10px]">฿370</div>
                                                </button>
                                            </div>
                                        </div>

                                        {formData.jeans.isCustom && (
                                            <div className="grid grid-cols-2 gap-4 mb-6 p-4 border border-zinc-200 bg-zinc-50 animate-fade">
                                                <div>
                                                    <label className="block text-xs text-zinc-500 mb-2">ชื่อไซส์ (เช่น 3XL)</label>
                                                    <input type="text" value={formData.jeans.customSize} onChange={e => setFormData({...formData, jeans: {...formData.jeans, customSize: e.target.value}})} className="w-full px-3 py-2 bg-white border border-zinc-300 focus:border-black outline-none text-sm" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-zinc-500 mb-2">รอบอก (นิ้ว)</label>
                                                    <input type="number" value={formData.jeans.customChest} onChange={e => setFormData({...formData, jeans: {...formData.jeans, customChest: e.target.value}})} className="w-full px-3 py-2 bg-white border border-zinc-300 focus:border-black outline-none text-sm" />
                                                </div>
                                            </div>
                                        )}

                                        <div>
                                            <label className="block text-xs text-zinc-500 mb-2">จำนวน (ปล่อยเป็น 0 หากไม่สั่ง)</label>
                                            <div className="flex items-center w-32 border border-zinc-300">
                                                <button type="button" onClick={() => setFormData({...formData, jeans: {...formData.jeans, qty: Math.max(0, formData.jeans.qty - 1)}})} className="w-10 h-10 flex items-center justify-center hover:bg-zinc-100 transition-colors">-</button>
                                                <input type="number" min="0" value={formData.jeans.qty} onChange={e => setFormData({...formData, jeans: {...formData.jeans, qty: parseInt(e.target.value) || 0}})} className="w-12 h-10 border-x border-zinc-300 bg-transparent text-center outline-none text-sm" />
                                                <button type="button" onClick={() => setFormData({...formData, jeans: {...formData.jeans, qty: formData.jeans.qty + 1}})} className="w-10 h-10 flex items-center justify-center hover:bg-zinc-100 transition-colors">+</button>
                                            </div>
                                        </div>
                                    </div>

                                    <hr className="border-black" />

                                    <div className="flex justify-between items-center py-2">
                                        <span className="text-sm uppercase tracking-widest text-zinc-500">ยอดชำระทั้งหมด</span>
                                        <span className="text-3xl font-medium text-black">฿{totalAmount.toLocaleString()}</span>
                                    </div>

                                    <div className="border border-zinc-300 p-6">
                                        <h3 className="text-sm font-medium text-black uppercase tracking-widest mb-6">4. การชำระเงิน</h3>
                                        
                                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-8">
                                            <div className="flex items-center gap-4">
                                                <div className="w-12 h-12 bg-white border border-zinc-200 flex items-center justify-center p-1">
                                                    <img src="https://upload.wikimedia.org/wikipedia/th/thumb/f/f6/Kasikornbank_Logo.svg/120px-Kasikornbank_Logo.svg.png" alt="KBank" className="object-contain" onError={(e)=>{e.target.style.display='none'}} />
                                                </div>
                                                <div>
                                                    <p className="font-medium text-black">ธนาคารกสิกรไทย</p>
                                                    <p className="text-sm text-zinc-500">สาขาวิชาวิทยาศาสตร์</p>
                                                </div>
                                            </div>
                                            
                                            <div className="flex items-center bg-zinc-50 border border-zinc-200">
                                                <span className="font-mono text-lg font-medium px-4 text-black">012-3-45678-9</span>
                                                <button type="button" onClick={handleCopy} className={`px-4 py-3 text-xs font-medium uppercase tracking-widest transition-colors border-l border-zinc-200 ${copied ? 'bg-black text-white' : 'hover:bg-zinc-100 text-black'}`}>
                                                    {copied ? 'Copied' : 'Copy'}
                                                </button>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs text-zinc-500 mb-3">แนบหลักฐานการโอน (สลิป)</label>
                                            <div className="border border-dashed border-zinc-400 p-8 bg-zinc-50 hover:bg-zinc-100 transition-colors text-center cursor-pointer relative">
                                                <input required type="file" accept="image/*" onChange={e => setFormData({...formData, slip: e.target.files[0]})} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                                <div className="text-sm text-zinc-600">
                                                    {formData.slip ? (
                                                        <span className="text-black font-medium">{formData.slip.name}</span>
                                                    ) : (
                                                        "คลิก หรือ ลากไฟล์รูปภาพมาวางที่นี่"
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {errorMsg && (
                                        <div className="p-4 bg-red-50 border border-red-100 text-red-600 text-sm flex items-start gap-2">
                                            <AlertCircle className="w-5 h-5 flex-shrink-0" />
                                            <span>{errorMsg}</span>
                                        </div>
                                    )}

                                    <button type="submit" className="w-full py-4 bg-black text-white text-sm font-medium uppercase tracking-widest hover:bg-zinc-800 transition-colors">
                                        ยืนยันการสั่งจอง
                                    </button>
                                </form>
                            </div>
                        </div>

                        <footer className="text-center py-10 text-zinc-400 text-xs mt-auto">
                            <p className="tracking-widest uppercase">&copy; 2026 ScienceLab.</p>
                            <a href="#admin" className="hover:text-black transition-colors mt-2 inline-block uppercase">Admin</a>
                        </footer>
                    </div>
                );
            };

            const AdminView = () => {
                const stats = useMemo(() => {
                    let totalShirts = 0; let totalRevenue = 0; let pendingCount = 0;
                    const sizeCountTshirt = { S: 0, M: 0, L: 0, XL: 0, '2XL': 0, '3XL': 0 };
                    const sizeCountJeans = { S: 0, M: 0, L: 0, XL: 0, '2XL': 0 };
                    const specialTshirt = []; const specialJeans = [];

                    orders.forEach(order => {
                        totalShirts += order.qty;
                        totalRevenue += order.amount;
                        if (order.status === 'รอตรวจสอบ') pendingCount++;

                        if (order.shirtType === 'tshirt') {
                            if (sizeCountTshirt[order.size] !== undefined) sizeCountTshirt[order.size] += order.qty;
                            else if (order.size.includes('พิเศษ')) specialTshirt.push({ size: order.size, qty: order.qty });
                        }
                        if (order.shirtType === 'jeans') {
                            if (sizeCountJeans[order.size] !== undefined) sizeCountJeans[order.size] += order.qty;
                            else if (order.size.includes('พิเศษ')) specialJeans.push({ size: order.size, qty: order.qty });
                        }
                    });
                    return { totalShirts, totalRevenue, pendingCount, sizeCountTshirt, sizeCountJeans, specialTshirt, specialJeans };
                }, [orders]);

                return (
                    <div className="min-h-screen flex flex-col selection:bg-zinc-200">
                        <nav className="bg-black text-white sticky top-0 z-50">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                                <div className="flex h-14 items-center">
                                    <span className="font-medium text-sm tracking-widest uppercase">Admin Panel</span>
                                </div>
                            </div>
                        </nav>

                        <div className="flex-grow p-4 sm:p-6 lg:p-8">
                            <div className="max-w-7xl mx-auto mt-2">
                                <div className="mb-8 border-b border-zinc-200 pb-4">
                                    <h2 className="text-xl font-medium text-black uppercase tracking-widest">Dashboard</h2>
                                </div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                                    <div className="bg-white p-6 border border-zinc-200">
                                        <p className="text-xs text-zinc-500 uppercase tracking-widest mb-2">ยอดสั่งจอง</p>
                                        <p className="text-3xl font-light text-black">{stats.totalShirts}</p>
                                    </div>
                                    <div className="bg-white p-6 border border-zinc-200">
                                        <p className="text-xs text-zinc-500 uppercase tracking-widest mb-2">ยอดเงินรวม</p>
                                        <p className="text-3xl font-light text-black">฿{stats.totalRevenue.toLocaleString()}</p>
                                    </div>
                                    <div className="bg-white p-6 border border-zinc-200">
                                        <p className="text-xs text-zinc-500 uppercase tracking-widest mb-2">รอตรวจสอบ</p>
                                        <p className="text-3xl font-light text-black">{stats.pendingCount}</p>
                                    </div>
                                    <div className="bg-white p-6 border border-zinc-200">
                                        <p className="text-xs text-zinc-500 uppercase tracking-widest mb-2">ผู้สั่งจอง</p>
                                        <p className="text-3xl font-light text-black">{new Set(orders.map(o => o.studentId)).size}</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    <div className="lg:col-span-2 bg-white border border-zinc-200">
                                        <div className="px-6 py-4 border-b border-zinc-200">
                                            <h3 className="text-xs font-medium text-black uppercase tracking-widest">รายการสั่งจอง</h3>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-sm text-left">
                                                <thead className="text-[10px] text-zinc-500 uppercase tracking-widest border-b border-zinc-200">
                                                    <tr>
                                                        <th className="px-6 py-3 font-normal">ออเดอร์</th>
                                                        <th className="px-6 py-3 font-normal">ลูกค้า</th>
                                                        <th className="px-6 py-3 font-normal">สินค้า</th>
                                                        <th className="px-6 py-3 font-normal">สถานะ</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-zinc-100">
                                                    {orders.map((order, idx) => (
                                                        <tr key={idx} className="hover:bg-zinc-50 transition-colors">
                                                            <td className="px-6 py-4">
                                                                <div className="font-mono text-black">{order.id}</div>
                                                                <div className="text-[10px] text-zinc-400 mt-1">{order.date}</div>
                                                            </td>
                                                            <td className="px-6 py-4">
                                                                <div className="text-black">{order.name} <span className="text-zinc-400 text-[10px] ml-1">ปี {order.year}</span></div>
                                                                <div className="text-zinc-500 text-[10px] mt-1">{order.studentId} | {order.phone}</div>
                                                            </td>
                                                            <td className="px-6 py-4">
                                                                <span className="text-black">{order.shirtType === 'tshirt' ? 'เสื้อยืด' : 'ยีนส์'}</span>
                                                                <div className="text-xs text-zinc-500 mt-1">{order.size} &times; {order.qty}</div>
                                                            </td>
                                                            <td className="px-6 py-4">
                                                                <span className={`text-[10px] uppercase tracking-widest ${order.status === 'ยืนยันแล้ว' ? 'text-black font-medium' : 'text-zinc-500'}`}>
                                                                    {order.status}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    <div className="bg-white border border-zinc-200 flex flex-col">
                                        <div className="px-6 py-4 border-b border-zinc-200">
                                            <h3 className="text-xs font-medium text-black uppercase tracking-widest">สรุปการผลิต</h3>
                                        </div>
                                        <div className="p-6 flex-grow overflow-y-auto">
                                            
                                            <h4 className="text-[10px] text-zinc-500 uppercase tracking-widest mb-4">เสื้อยืด</h4>
                                            <div className="space-y-1 mb-8 text-sm">
                                                {Object.entries(stats.sizeCountTshirt).map(([size, count]) => (
                                                    <div key={'ts-'+size} className="flex items-center justify-between py-1 border-b border-zinc-100">
                                                        <span className="text-black w-8">{size}</span>
                                                        <span className="text-zinc-600">{count} ตัว</span>
                                                    </div>
                                                ))}
                                                {stats.specialTshirt.map((sp, i) => (
                                                    <div key={'sp-t-'+i} className="flex items-center justify-between py-1 border-b border-zinc-100 bg-zinc-50 px-2 -mx-2">
                                                        <span className="text-black text-xs">{sp.size}</span>
                                                        <span className="text-zinc-600">{sp.qty} ตัว</span>
                                                    </div>
                                                ))}
                                            </div>

                                            <h4 className="text-[10px] text-zinc-500 uppercase tracking-widest mb-4">เสื้อยีนส์</h4>
                                            <div className="space-y-1 text-sm">
                                                {Object.entries(stats.sizeCountJeans).map(([size, count]) => (
                                                    <div key={'j-'+size} className="flex items-center justify-between py-1 border-b border-zinc-100">
                                                        <span className="text-black w-8">{size}</span>
                                                        <span className="text-zinc-600">{count} ตัว</span>
                                                    </div>
                                                ))}
                                                {stats.specialJeans.map((sp, i) => (
                                                    <div key={'sp-j-'+i} className="flex items-center justify-between py-1 border-b border-zinc-100 bg-zinc-50 px-2 -mx-2">
                                                        <span className="text-black text-xs">{sp.size}</span>
                                                        <span className="text-zinc-600">{sp.qty} ตัว</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <footer className="text-center py-6 text-zinc-400 text-xs border-t border-zinc-200">
                            <a href="#" className="hover:text-black transition-colors uppercase tracking-widest">Return to Shop</a>
                        </footer>
                    </div>
                );
            };

            return currentPath === '#admin' ? <AdminView /> : <UserView />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
