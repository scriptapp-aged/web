<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ชุมนุมฟาร์มนิสิต | EDS KPS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');

        :root {
            --bg: #ffffff;
            --text: #050505;
            --accent: #2d5a27;
            --soft: #f4f4f4;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px;
        }

        /* Hero Section */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            padding: 80px 0;
            align-items: center;
        }

        .hero h1 {
            font-size: clamp(3rem, 7vw, 6rem);
            line-height: 0.9;
            letter-spacing: -3px;
            text-transform: uppercase;
        }

        .hero p { font-size: 1.2rem; color: #666; max-width: 400px; }

        /* Modern Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .box {
            background: var(--soft);
            padding: 40px;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-radius: 40px;
            transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .box:hover { background: var(--accent); color: white; transform: translateY(-10px); }
        .box h3 { font-size: 1.5rem; }
        .arrow { font-size: 2rem; }

        /* Utility Footer */
        .footer {
            margin-top: 80px;
            border-top: 1px solid #ddd;
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 768px) {
            .hero { grid-template-columns: 1fr; }
            .grid-container { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1>ชุมนุม<br>ฟาร์มนิสิต</h1>
        <div>
            <p>EDS KPS Farm Collective — ศูนย์รวมกิจกรรมและระบบจัดการทรัพยากรนิสิตเพื่อการพัฒนาที่ยั่งยืน</p>
            <br>
            <a href="ku86.html" style="text-decoration:none; color:black; border-bottom:2px solid black; font-weight:bold;">อ่านเกี่ยวกับนิสิตใหม่ KU86 →</a>
        </div>
    </section>

    <div class="grid-container">
        <a href="people.html" class="box" style="text-decoration:none; color:inherit;">
            <h3>ทีมงาน<br>ผู้ขับเคลื่อน</h3>
            <div class="arrow">↗</div>
        </a>
        <a href="room.html" class="box" style="text-decoration:none; color:inherit;">
            <h3>จองพื้นที่<br>ส่วนกลาง</h3>
            <div class="arrow">↗</div>
        </a>
        <a href="project.html" class="box" style="text-decoration:none; color:inherit;">
            <h3>โครงการ<br>แห่งปี</h3>
            <div class="arrow">↗</div>
        </a>
        <a href="time.html" class="box" style="text-decoration:none; color:inherit;">
            <h3>สั่งซื้อเสื้อ<br>ปฏิบัติการ</h3>
            <div class="arrow">↗</div>
        </a>
    </div>

    <div class="footer">
        <div>© 2026 Farm Collective</div>
        <div style="display:flex; gap:20px;">
            <a href="academic-calendar.html" style="color:black;">ปฏิทิน</a>
            <a href="admin-approve.html" style="color:black;">Admin Panel</a>
        </div>
    </div>

</body>
</html>
