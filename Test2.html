<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Section</title>
  
  <!-- Importing Prompt Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --font-family: 'Prompt', sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
    }

    .hero-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 100px 20px 60px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .hero-title {
      font-size: 4rem;
      font-weight: 700;
      line-height: 1.1;
      margin: 0 0 24px 0;
      letter-spacing: -0.02em;
    }

    .hero-subtitle {
      font-size: 1.25rem;
      font-weight: 300;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 0 48px 0;
      line-height: 1.6;
    }

    .cta-group {
      display: flex;
      gap: 16px;
      margin-bottom: 72px;
      justify-content: center;
    }

    .btn {
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 500;
      font-family: var(--font-family);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      /* Strict sharp edges */
      border-radius: 0; 
      border: 2px solid transparent;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-main);
      border-color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: var(--text-main);
      color: #ffffff;
    }

    /* Glassmorphism Visual Container */
    .visual-container {
      width: 100%;
      max-width: 1000px;
      position: relative;
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
      padding: 16px;
      /* Strict sharp edges */
      border-radius: 0; 
    }

    .visual-placeholder {
      width: 100%;
      height: 500px;
      background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 1.25rem;
      font-weight: 500;
      /* Strict sharp edges */
      border-radius: 0; 
    }

    /* Abstract shapes behind the glass to make the blur effect pop */
    .bg-shape {
      position: absolute;
      z-index: 0;
      filter: blur(80px);
      opacity: 0.6;
    }
    
    .shape-1 {
      top: -10%;
      left: 15%;
      width: 400px;
      height: 400px;
      background: #93c5fd; /* Soft Blue */
    }
    
    .shape-2 {
      top: 40%;
      right: 15%;
      width: 500px;
      height: 500px;
      background: #c4b5fd; /* Soft Purple */
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .hero-title {
        font-size: 2.5rem;
      }
      .visual-placeholder {
        height: 300px;
      }
      .cta-group {
        flex-direction: column;
        width: 100%;
        max-width: 300px;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Background decorations for glassmorphism -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <!-- Hero Section -->
  <section class="hero-container">
    <h1 class="hero-title">Next Generation Platform</h1>
    <p class="hero-subtitle">Optimize your workflow with a precise, modern system engineered for maximum performance and clarity.</p>
    
    <div class="cta-group">
      <a href="#" class="btn btn-primary">Get Started</a>
      <a href="#" class="btn btn-secondary">Learn More</a>
    </div>

    <div class="visual-container">
      <div class="visual-placeholder">
        [ Insert Product Screenshot / Image Here ]
      </div>
    </div>
  </section>

</body>
</html>
