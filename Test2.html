<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Website</title>
  
  <!-- นำเข้าฟอนต์ Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --banner-bg: #111827; /* สีพื้นหลังแบนเนอร์ */
      --banner-text: #ffffff;
      --badge-bg: #4f46e5;
      --badge-text: #ffffff;
      --link-color: #818cf8;
      --font-family: 'Prompt', sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--font-family);
    }

    .announcement-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background-color: var(--banner-bg);
      color: var(--banner-text);
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    .banner-content {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      justify-content: center;
    }

    .badge-new {
      background-color: var(--badge-bg);
      color: var(--badge-text);
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      /* ดีไซน์ขอบเหลี่ยมคมกริบ */
      border-radius: 0; 
    }

    .banner-message {
      font-weight: 400;
    }

    .banner-link {
      color: var(--link-color);
      text-decoration: underline;
      text-underline-offset: 2px;
      margin-left: 4px;
    }

    .banner-link:hover {
      text-decoration: none;
    }

    .dismiss-btn {
      background: transparent;
      border: none;
      color: var(--banner-text);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .dismiss-btn:hover {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- แบนเนอร์ประกาศ -->
  <div class="announcement-banner" id="promo-banner">
    <div class="banner-content">
      <span class="badge-new">New</span>
      <span class="banner-message">
        เรามีอัปเดตระบบใหม่ล่าสุด! 
        <a href="#" class="banner-link">ดูรายละเอียด</a>
      </span>
    </div>
    <button class="dismiss-btn" aria-label="Dismiss" onclick="document.getElementById('promo-banner').style.display='none'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- ส่วนเนื้อหาเว็บไซต์หลักของคุณเริ่มต้นที่นี่ -->
  <div style="padding: 20px; text-align: center;">
    <h1>เนื้อหาเว็บไซต์</h1>
    <p>นี่คือพื้นที่สำหรับแสดงผลเนื้อหาอื่นๆ ของคุณ</p>
  </div>

</body>
</html>
