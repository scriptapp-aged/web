<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KU KPS | Farm Collective</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(255, 255, 255, 0.1); }
        
        body {
            margin: 0;
            background: #0a0a0a;
            color: white;
            font-family: 'Inter', sans-serif;
            background-image: radial-gradient(circle at 50% 50%, #1a3a2a 0%, #0a0a0a 80%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .main-card {
            width: 100%;
            max-width: 900px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 60px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 { font-size: 5rem; letter-spacing: -4px; margin: 0 0 40px 0; line-height: 1; }
        
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .item {
            background: rgba(255,255,255,0.05);
            padding: 30px;
            border-radius: 24px;
            transition: 0.4s;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }

        .item:hover { background: #2d5a27; transform: scale(1.02); }
        .item span { opacity: 0.6; font-size: 0.8rem; text-transform: uppercase; }
        .item h2 { margin: 10px 0 0 0; }

        .status { margin-bottom: 20px; font-weight: 300; letter-spacing: 2px; color: #888; }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="status">EDS KPS — FARM COLLECTIVE 2026</div>
        <h1>ชุมนุม<br>ฟาร์มนิสิต</h1>
        
        <div class="nav-grid">
            <a href="ku86.html" class="item">
                <span>NEW STUDENT</span>
                <h2>นิสิตใหม่ KU86</h2>
            </a>
            <a href="people.html" class="item">
                <span>OUR TEAM</span>
                <h2>คณะกรรมการ</h2>
            </a>
            <a href="room.html" class="item">
                <span>RESERVATION</span>
                <h2>จองห้องประชุม</h2>
            </a>
            <a href="time.html" class="item">
                <span>ORDERS</span>
                <h2>สั่งซื้อเสื้อ</h2>
            </a>
        </div>
    </div>

</body>
</html>
