<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปิดระบบชั่วคราว</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@200;400;600&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Mitr',sans-serif;
            background:#ffffff;
            width:100%;
            height:100vh;
            overflow:hidden;
            display:flex;
            justify-content:center;
            align-items:center;
            position:relative;
        }

        /* Background Text */
        .bg-text{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            font-size:20vw;
            font-weight:600;
            color:#f5f5f5;
            letter-spacing:-0.8vw;
            white-space:nowrap;
            user-select:none;
            z-index:0;
        }

        /* Main Content */
        .content{
            position:relative;
            z-index:1;
            text-align:center;
            padding:20px;
            max-width:700px;
        }

        .icon-wrapper{
            margin-bottom:1.5rem;
        }

        .main-icon{
            width:85px;
            height:85px;
            color:#111827;
            animation:rotate 8s linear infinite;
        }

        @keyframes rotate{
            from{
                transform:rotate(0deg);
            }
            to{
                transform:rotate(360deg);
            }
        }

        h1{
            font-size:2.8rem;
            font-weight:600;
            color:#111827;
            margin-bottom:1rem;
            letter-spacing:-1px;
        }

        p{
            font-size:1.1rem;
            font-weight:300;
            color:#4b5563;
            line-height:1.8;
            margin-bottom:2rem;
        }

        .highlight{
            font-weight:600;
            color:#111827;
        }

        /* Loader */
        .loader-bar{
            width:240px;
            height:4px;
            background:#e5e7eb;
            border-radius:999px;
            overflow:hidden;
            margin:0 auto;
        }

        .progress{
            width:100%;
            height:100%;
            background:#111827;
            transform:translateX(-100%);
            animation:loading 2s infinite cubic-bezier(0.4,0,0.2,1);
        }

        @keyframes loading{
            0%{
                transform:translateX(-100%);
            }
            50%{
                transform:translateX(0%);
            }
            100%{
                transform:translateX(100%);
            }
        }

        /* Mobile */
        @media (max-width:768px){

            .bg-text{
                font-size:28vw;
            }

            h1{
                font-size:2rem;
            }

            p{
                font-size:1rem;
            }

            .main-icon{
                width:70px;
                height:70px;
            }
        }
    </style>
</head>

<body>

    <div class="bg-text">CLOSED</div>

    <div class="content">

        <div class="icon-wrapper">
            <svg class="main-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">

                <path stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.5"
                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                </path>

                <path stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.5"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z">
                </path>

            </svg>
        </div>

        <h1>ปิดระบบชั่วคราว</h1>

        <p>
            เนื่องจากปิดภาคการศึกษา<br>
            ระบบจะเปิดให้ใช้งานอีกครั้งในวันที่<br>
            <span class="highlight">
                22 มิถุนายน 2569
            </span><br>
            ตั้งแต่เวลา
            <span class="highlight">
                01:00 น.
            </span>
            เป็นต้นไป
        </p>

        <div class="loader-bar">
            <div class="progress"></div>
        </div>

    </div>

</body>
</html>
