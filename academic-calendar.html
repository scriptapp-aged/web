<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบอยู่ระหว่างการปรับปรุง</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@200;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Mitr', sans-serif;
            background-color: #ffffff; /* พื้นหลังสีขาวตามโจทย์ */
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* คำว่า UPDATE ขนาดใหญ่ที่อยู่ตรงกลางพื้นหลัง */
        .bg-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* ทำให้กึ่งกลางเป๊ะ */
            font-size: 22vw; /* ขนาดตามความกว้างหน้าจอ */
            font-weight: 600;
            color: #f8f9fa; /* สีเทาอ่อนมากเกือบขาว */
            letter-spacing: -1vw;
            z-index: 0;
            user-select: none;
            white-space: nowrap;
        }

        /* กล่องเนื้อหาหลัก */
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
        }

        .icon-wrapper {
            margin-bottom: 1.5rem;
        }

        .main-icon {
            width: 80px;
            height: 80px;
            color: #1a202c;
            animation: rotate 8s infinite linear;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h1 {
            font-weight: 600;
            font-size: 2.5rem;
            color: #1a202c;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        p {
            font-weight: 200;
            font-size: 1.2rem;
            color: #4a5568;
            max-width: 450px;
            margin: 0 auto 2rem auto;
            line-height: 1.6;
        }

        /* แถบ Loading แบบเรียบหรู */
        .loader-bar {
            width: 200px;
            height: 4px;
            background: #edf2f7;
            border-radius: 10px;
            margin: 0 auto;
            overflow: hidden;
        }

        .progress {
            width: 100%;
            height: 100%;
            background: #1a202c;
            transform: translateX(-100%);
            animation: loading 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes loading {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(0); }
            100% { transform: translateX(100%); }
        }

        /* Responsive สำหรับมือถือ */
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            p { font-size: 1rem; }
            .bg-text { font-size: 30vw; }
        }
    </style>
</head>
<body>

    <div class="bg-text">UPDATE</div>

    <div class="content">
        <div class="icon-wrapper">
            <svg class="main-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </div>

        <h1>กำลังปรับปรุงระบบ</h1>
        <p>เรากำลังอัพเดตข้อมูลเพื่อให้คุณใช้งานได้ดียิ่งขึ้น <br>ขออภัยในความไม่สะดวกครับ</p>
        
        <div class="loader-bar">
            <div class="progress"></div>
        </div>
    </div>

</body>
</html>
