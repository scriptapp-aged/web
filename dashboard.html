<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Dashboard - เช็คอินการ์ตูน</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- ใช้ Kanit และเพิ่ม Mali ให้ดูมีความเป็นการ์ตูน/ลายมือมากขึ้น -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800;900&family=Mali:wght@500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Kanit', 'sans-serif'],
                        comic: ['Mali', 'cursive']
                    },
                    colors: {
                        comic: {
                            yellow: '#ffd803',
                            blue: '#bae8e8',
                            dark: '#272343',
                            pink: '#ffa8ba',
                            green: '#4ade80'
                        }
                    },
                    animation: {
                        'float-slow': 'float 8s ease-in-out infinite',
                        'float-med': 'float 6s ease-in-out infinite reverse',
                        'bounce-in': 'bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.26, 1.55) forwards',
                        'spin-slow': 'spin 8s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px) translateX(0px)' },
                            '50%': { transform: 'translateY(-20px) translateX(10px)' },
                        },
                        bounceIn: {
                            '0%': { transform: 'scale(0.3) translateY(100px)', opacity: '0' },
                            '50%': { transform: 'scale(1.05) translateY(-10px)', opacity: '1' },
                            '100%': { transform: 'scale(1) translateY(0)', opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #bae8e8;
            background-image: radial-gradient(#ffffff 20%, transparent 20%), radial-gradient(#ffffff 20%, transparent 20%);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            margin: 0;
            overflow-x: hidden;
        }
        
        /* สไตล์ขอบหนาและเงาทึบแบบการ์ตูน (Neo-Brutalism) */
        .cartoon-border {
            border: 4px solid #272343;
            box-shadow: 6px 6px 0px #272343;
            transition: all 0.2s ease;
        }
        
        .cartoon-border:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px #272343;
        }

        .cartoon-border-sm {
            border: 3px solid #272343;
            box-shadow: 4px 4px 0px #272343;
        }

        /* ตกแต่ง Scrollbar ให้ดูเป็นการ์ตูน */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #bae8e8; border-left: 4px solid #272343; }
        ::-webkit-scrollbar-thumb { background: #ffd803; border: 3px solid #272343; border-radius: 10px; }

        /* อนิเมชันไฮไลต์ตอนชื่อใหม่เด้งเข้ามา */
        .new-character-glow {
            animation: highlightGlow 2s ease-out forwards;
        }
        @keyframes highlightGlow {
            0% { background-color: #ffd803; transform: scale(1.02); }
            100% { background-color: #ffffff; transform: scale(1); }
        }

        /* เมฆประดับพื้นหลัง */
        .cloud {
            position: fixed;
            background: white;
            border: 4px solid #272343;
            border-radius: 50px;
            box-shadow: 4px 4px 0px #272343;
            z-index: -1;
        }
        .cloud::before, .cloud::after {
            content: ''; position: absolute; background: white; border: 4px solid #272343; border-radius: 50%; z-index: -1;
        }
        .cloud::before { width: 50px; height: 50px; top: -25px; left: 15px; border-bottom: none; }
        .cloud::after { width: 70px; height: 70px; top: -35px; right: 15px; border-bottom: none; }
    </style>
</head>
<body class="text-comic-dark min-h-screen flex flex-col font-sans relative">

    <!-- เมฆตกแต่งฉากหลัง -->
    <div class="cloud w-32 h-12 top-10 left-10 animate-float-slow" style="animation-delay: 0s;"></div>
    <div class="cloud w-40 h-16 top-32 right-20 animate-float-med" style="transform: scale(0.8); animation-delay: 1s;"></div>
    <div class="cloud w-28 h-10 bottom-40 left-32 animate-float-slow" style="transform: scale(1.2); animation-delay: 2s;"></div>

    <header class="bg-white cartoon-border m-4 md:m-6 p-4 rounded-2xl flex flex-col md:flex-row md:items-center justify-between gap-4 z-10 relative">
        <div class="flex items-center gap-4">
            <!-- โลโก้งาน (รูปดาวการ์ตูน) -->
            <div class="w-16 h-16 rounded-full bg-comic-yellow cartoon-border-sm flex items-center justify-center text-comic-dark animate-spin-slow">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-10 h-10">
                    <path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006z" clip-rule="evenodd" />
                </svg>
            </div>
            <div>
                <h1 class="text-3xl font-black tracking-wide text-comic-dark uppercase" style="text-shadow: 2px 2px 0px #ffd803;">
                    Live Character Check-in!
                </h1>
                <p class="text-lg font-comic font-bold text-slate-600 mt-1">โครงการปฐมนิเทศ 2569 "เกษตรและสิ่งแวดล้อมศึกษา"</p>
            </div>
        </div>
        
        <!-- แถบสถานะ -->
        <div class="flex items-center gap-3 bg-comic-blue cartoon-border-sm px-5 py-2.5 rounded-full text-sm font-bold">
            <div id="status-indicator" class="w-4 h-4 bg-comic-green border-2 border-comic-dark rounded-full animate-pulse"></div>
            <span id="update-status" class="uppercase tracking-widest">กำลังเชื่อมต่อ...</span>
        </div>
    </header>

    <main class="flex-grow px-4 md:px-6 pb-6 max-w-7xl mx-auto w-full flex flex-col gap-6 z-10">
        
        <!-- การ์ดตัวเลขสถิติ -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Total Card (ผู้ลงทะเบียนทั้งหมด) -->
            <div class="bg-white cartoon-border rounded-3xl p-6 flex items-center justify-between relative overflow-hidden">
                <div class="z-10">
                    <p class="font-comic font-bold text-xl mb-1 text-slate-500">🌟 ผู้ลงทะเบียนทั้งหมด</p>
                    <div class="flex items-baseline gap-2">
                        <h2 class="text-7xl font-black text-comic-dark" id="total-count" style="text-shadow: 4px 4px 0px #bae8e8;">0</h2>
                        <span class="text-2xl font-black text-slate-500">คน</span>
                    </div>
                </div>
                <div class="text-6xl z-10 animate-float-slow">📜</div>
            </div>

            <!-- Checked In Card (เช็คอินแล้ว) -->
            <div class="bg-comic-yellow cartoon-border rounded-3xl p-6 flex items-center justify-between relative overflow-hidden">
                <div class="z-10">
                    <p class="font-comic font-bold text-xl mb-1 text-comic-dark">🔥 ผู้กล้าที่เช็คอินแล้ว</p>
                    <div class="flex items-baseline gap-2">
                        <h2 class="text-7xl font-black text-white" id="checked-in-count" style="text-shadow: 4px 4px 0px #272343, -1px -1px 0 #272343, 1px -1px 0 #272343, -1px 1px 0 #272343, 1px 1px 0 #272343;">0</h2>
                        <span class="text-2xl font-black text-comic-dark">คน</span>
                    </div>
                </div>
                <div class="text-6xl z-10 animate-float-slow" style="animation-delay: 1s;">🦸‍♂️</div>
            </div>
        </div>

        <!-- คอนเทนเนอร์แสดงโปรไฟล์ตัวละคร -->
        <div class="bg-white cartoon-border rounded-3xl flex flex-col h-[500px] overflow-hidden relative">
            <div class="px-6 py-4 border-b-4 border-comic-dark bg-comic-pink flex justify-between items-center z-10">
                <h3 class="text-xl font-black tracking-wider uppercase flex items-center gap-2">
                    <span class="text-2xl">✨</span> ขบวนตัวละครผู้เข้าร่วมงาน
                </h3>
                <span class="font-bold bg-white cartoon-border-sm py-1 px-4 rounded-full text-sm">
                    Real-time
                </span>
            </div>
            
            <div class="p-6 overflow-y-auto flex-grow relative bg-[#f8f9fa]" id="list-container">
                <!-- สถานะโหลด -->
                <div id="loading-state" class="absolute inset-0 flex flex-col items-center justify-center bg-white/80 backdrop-blur-sm z-20">
                    <div class="text-6xl animate-bounce mb-4">🏃‍♂️</div>
                    <p class="font-comic font-bold text-xl">กำลังซิงค์รายชื่อฮีโร่...</p>
                </div>
                <!-- รายชื่อตัวละครจะถูกแทรกที่นี่ -->
                <div id="list-content" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>

    </main>

    <script>
        // =======================================================
        // ⚠️ นำ URL ของ Web App จาก Google Apps Script มาใส่ตรงนี้
        // =======================================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8eTkS7dM96oQ-yqKKk1zRCDioQkw5w8N7UpoCBZ8AI0QVecuMItd3AaCIBX-lPwyX/exec";
        
        let currentTotal = 0;
        let currentCheckedIn = 0;
        let renderedRecords = new Set();
        let isFirstLoad = true;

        const listContent = document.getElementById('list-content');
        const loadingState = document.getElementById('loading-state');
        const totalCountEl = document.getElementById('total-count');
        const checkedInCountEl = document.getElementById('checked-in-count');
        const statusIndicator = document.getElementById('status-indicator');
        const updateStatusEl = document.getElementById('update-status');

        // ฟังก์ชันนับเลข Animation
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // Spring effect
                const easeOutBack = 1 + 2.70158 * Math.pow(progress - 1, 3) + 1.70158 * Math.pow(progress - 1, 2);
                let current = Math.floor(start + (end - start) * (progress < 1 ? easeOutBack : 1));
                
                // ไม่ให้เลขติดลบจังหวะเด้ง
                if (current < start && start === 0) current = 0;
                
                obj.innerHTML = current;
                if (progress < 1) window.requestAnimationFrame(step);
                else obj.innerHTML = end;
            };
            window.requestAnimationFrame(step);
        }

        // แปลงเวลาให้เรียงลำดับได้
        function parseCustomDate(timeStr) {
            try {
                const parts = timeStr.split(' ');
                const dateParts = parts[0].split('/');
                const timeParts = parts[1].split(':');
                return new Date(dateParts[2], dateParts[1] - 1, dateParts[0], timeParts[0], timeParts[1], timeParts[2]).getTime();
            } catch(e) {
                return 0;
            }
        }

        // ฟังก์ชันสร้างการ์ดโปรไฟล์ตัวละคร
        function createCharacterCard(person, isNew) {
            const card = document.createElement('div');
            
            // กำหนด Class เบื้องต้นให้เป็นการ์ดการ์ตูน
            card.className = `bg-white cartoon-border-sm p-3 rounded-2xl flex items-center gap-4 relative overflow-hidden`;
            
            // แอนิเมชันเปิดตัว
            if (isNew && !isFirstLoad) {
                card.classList.add('animate-bounce-in', 'new-character-glow');
            } else if (isFirstLoad) {
                card.classList.add('animate-bounce-in');
                card.style.animationDelay = `${Math.random() * 0.5}s`;
            }

            // 🌟 พระเอกของงาน: ใช้ DiceBear API สร้างตัวการ์ตูนจากชื่อ!
            // ใช้สไตล์ 'adventurer' (นักผจญภัย) สีพื้นหลังสุ่ม
            const seed = encodeURIComponent(person.name);
            const bgColors = ['b6e3f4', 'c0aede', 'd1d4f9', 'ffdfbf', 'ffd5dc', 'a0e8af'];
            const randomBg = bgColors[person.name.length % bgColors.length];
            const avatarUrl = `https://api.dicebear.com/7.x/adventurer/svg?seed=${seed}&backgroundColor=${randomBg}`;

            // สุ่มไอคอนฉายาตามความยาวชื่อ
            const badges = ['🌱 มือใหม่', '⚔️ นักรบ', '🧙‍♂️ จอมเวท', '🏹 นักธนู', '🛡️ แทงค์'];
            const badge = badges[person.name.length % badges.length];

            card.innerHTML = `
                <!-- รูปโปรไฟล์ -->
                <div class="w-20 h-20 rounded-full cartoon-border-sm overflow-hidden bg-[#${randomBg}] flex-shrink-0">
                    <img src="${avatarUrl}" alt="${person.name}" class="w-full h-full object-cover" />
                </div>
                
                <!-- ข้อมูลตัวละคร -->
                <div class="flex-grow">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-[0.65rem] font-black bg-comic-dark text-white px-2 py-0.5 rounded-md uppercase">${badge}</span>
                        ${isNew && !isFirstLoad ? '<span class="text-[0.65rem] font-black bg-red-500 text-white px-2 py-0.5 rounded-md uppercase animate-pulse">NEW!</span>' : ''}
                    </div>
                    <h4 class="font-black text-xl leading-tight truncate w-full pr-2">${person.name}</h4>
                    <p class="text-sm font-bold text-slate-500 mt-1 flex items-center gap-1">
                        <span>🕒</span> เข้าสู่เซิร์ฟเวอร์: ${person.timeStr.split(' ')[1]}
                    </p>
                </div>
            `;
            return card;
        }

        async function fetchAttendanceData() {
            if(GOOGLE_SCRIPT_URL.includes("ใส่_ID_ของคุณตรงนี้")) {
                updateStatusEl.innerText = "ยังไม่ได้เชื่อมต่อ API";
                statusIndicator.className = "w-4 h-4 bg-red-500 border-2 border-comic-dark rounded-full";
                return;
            }

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL + "?action=getAttendance");
                const result = await response.json();

                if (result.status === "success") {
                    updateDashboard(result);
                    updateStatusEl.innerText = "ออนไลน์";
                    statusIndicator.className = "w-4 h-4 bg-comic-green border-2 border-comic-dark rounded-full animate-pulse";
                }
            } catch (error) {
                console.error("Fetch error:", error);
                updateStatusEl.innerText = "กำลังรีคอนเน็ค...";
                statusIndicator.className = "w-4 h-4 bg-comic-yellow border-2 border-comic-dark rounded-full animate-spin";
            }
        }

        function updateDashboard(data) {
            if (loadingState) loadingState.style.display = 'none';

            // อัปเดตตัวเลข
            if (data.total !== currentTotal) {
                totalCountEl.parentElement.parentElement.classList.remove('new-character-glow');
                void totalCountEl.offsetWidth; 
                totalCountEl.parentElement.parentElement.classList.add('new-character-glow');
                animateValue(totalCountEl, currentTotal, data.total, 800);
                currentTotal = data.total;
            }
            if (data.checkedIn !== currentCheckedIn) {
                checkedInCountEl.parentElement.parentElement.classList.remove('new-character-glow');
                void checkedInCountEl.offsetWidth;
                checkedInCountEl.parentElement.parentElement.classList.add('new-character-glow');
                animateValue(checkedInCountEl, currentCheckedIn, data.checkedIn, 800);
                currentCheckedIn = data.checkedIn;
            }

            // จัดการรายชื่อตัวละคร
            let checkInList = data.data;
            checkInList.sort((a, b) => parseCustomDate(b.timeStr) - parseCustomDate(a.timeStr));

            if (checkInList.length === 0) {
                listContent.innerHTML = `
                    <div class="col-span-1 md:col-span-2 flex flex-col items-center justify-center h-full text-slate-400 py-12">
                        <div class="text-7xl mb-4 grayscale opacity-50">🏕️</div>
                        <p class="text-2xl font-comic font-bold">แคมป์ยังว่างเปล่า รอผู้กล้ามาเยือน...</p>
                    </div>`;
                return;
            }

            // แทรกการ์ดตัวละครใหม่ไว้บนสุด
            for (let i = checkInList.length - 1; i >= 0; i--) {
                const person = checkInList[i];
                const uid = person.name + person.timeStr;
                
                if (!renderedRecords.has(uid)) {
                    renderedRecords.add(uid);
                    // ถ้ายังไม่มีในการแสดงผล ให้ลบข้อความ "แคมป์ว่างเปล่า" ออกก่อน
                    if(listContent.innerHTML.includes("แคมป์ยังว่างเปล่า")) listContent.innerHTML = '';
                    
                    const cardElement = createCharacterCard(person, true);
                    listContent.prepend(cardElement);
                }
            }

            isFirstLoad = false;
        }

        // เริ่มต้นการทำงาน (ดึงข้อมูลทุกๆ 4 วินาที)
        window.onload = () => {
            fetchAttendanceData();
            setInterval(fetchAttendanceData, 4000);
        };
    </script>
</body>
</html>
