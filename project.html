<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบอยู่ระหว่างการปรับปรุง</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@200;300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Mitr', sans-serif;
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2D3748;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }

        /* ตกแต่งไอคอน */
        .icon-box {
            margin-bottom: 2rem;
            display: inline-block;
            position: relative;
        }

        .main-icon {
            width: 100px;
            height: 100px;
            color: #4A90E2; /* สีฟ้าโมเดิร์น */
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-weight: 500;
            font-size: 2rem;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
            color: #1A202C;
        }

        p {
            font-weight: 300;
            font-size: 1.1rem;
            color: #718096;
            line-height: 1.8;
            margin-bottom: 2.5rem;
        }

        /* แถบสถานะจำลอง */
        .status-bar {
            width: 250px;
            height: 6px;
            background-color: #EDF2F7;
            border-radius: 10px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .status-progress {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 10px;
            position: absolute;
            animation: loading 2.5s infinite linear;
        }

        @keyframes loading {
            0% { left: -40%; }
            100% { left: 100%; }
        }

        /* ลายตกแต่งพื้นหลังแบบจางๆ */
        .bg-decoration {
            position: absolute;
            z-index: -1;
            font-size: 20rem;
            font-weight: 900;
            color: #F7FAFC;
            user-select: none;
            bottom: -50px;
            right: -50px;
        }

    </style>
</head>
<body>

    <div class="bg-decoration">UPDATE</div>

    <div class="container">
        <div class="icon-box">
            <svg class="main-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
        </div>

        <h1>กำลังอัพเดตข้อมูลระบบ</h1>
        <p>เรากำลังปรับปรุงหน้าเว็บไซต์เพื่อให้คุณได้รับประสบการณ์ที่ดียิ่งขึ้น <br>ระบบจะกลับมาใช้งานได้ตามปกติในเร็วๆ นี้</p>
        
        <div class="status-bar">
            <div class="status-progress"></div>
        </div>
    </div>

</body>
</html>
