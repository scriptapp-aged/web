<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แสดงเวลาปัจจุบัน</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .clock-card {
            background: white;
            padding: 2rem 4rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        #time {
            font-size: 4rem;
            font-weight: bold;
            color: #333;
            margin: 0;
        }
        #date {
            font-size: 1.2rem;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="clock-card">
        <div id="time">00:00:00</div>
        <div id="date">กำลังโหลดวันที่...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            // จัดรูปแบบเวลา
            const timeString = now.toLocaleTimeString('th-TH', { hour12: false });
            // จัดรูปแบบวันที่
            const dateString = now.toLocaleDateString('th-TH', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });

            document.getElementById('time').textContent = timeString;
            document.getElementById('date').textContent = dateString;
        }

        // เรียกฟังก์ชันทุกๆ 1 วินาที
        setInterval(updateClock, 1000);
        
        // เรียกทันทีเมื่อโหลดหน้าเว็บ
        updateClock();
    </script>
</body>
</html>
