<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โครงการเกษตรน้องใหม่หัวใจ EDS</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff; /* พื้นหลังขาว */
            color: #000000; /* ตัวหนังสือดำ */
            font-family: 'Kanit', sans-serif;
            text-align: center;
        }
        .container {
            padding: 20px;
            border: 2px solid #000; /* กรอบดำบางๆ */
            border-radius: 10px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .date {
            font-size: 1rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        #time {
            font-size: 5rem;
            font-weight: 700;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            border-top: 1px solid #000;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>โครงการเกษตรน้องใหม่หัวใจ EDS</h1>
        <div class="date">วันอาทิตย์ที่ 28 มิถุนายน 2569</div>
        
        <div id="time">00:00:00</div>
        
        <div class="footer">
            คณะกรรมการชุมนุมฟาร์มนิสิต ปีการศึกษา 2569
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('th-TH', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: false 
            });
            document.getElementById('time').textContent = timeString;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
