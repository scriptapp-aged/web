<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปิดระบบคำสั่งซื้อเสื้อปฏิบัติการ 2569</title>
    
    <!-- ใช้ฟอนต์ Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #ffffff; /* พื้นหลังสีขาวล้วน */
            color: #000000;
            font-family: 'Prompt', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .content {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 500;
            margin: 0 0 5px 0;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 1rem;
            font-weight: 400;
            margin: 0 0 40px 0;
        }

        .note {
            font-size: 0.95rem;
            color: #666666; /* ใช้สีเทาเพื่อลดความเข้ม */
            font-weight: 300;
            margin: 0 0 60px 0;
        }

        .contact {
            font-size: 0.85rem;
            color: #999999;
            font-weight: 300;
            line-height: 1.8;
        }

        .contact span {
            color: #000000; /* เน้นเฉพาะข้อมูลสำคัญด้วยสีดำ */
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>ปิดระบบคำสั่งซื้อ</h1>
        <p class="subtitle">เสื้อปฏิบัติการ 2569</p>
        
        <p class="note">กำหนดการวันรับเสื้อ จะแจ้งให้ทราบในภายหลัง</p>
        
        <div class="contact">
            หากมีข้อสงสัยติดต่อ นายเมธี ใจสุขดี (ปี 3) <br>
            LINE: <span>_maytee</span>
        </div>
    </div>

</body>
</html>
