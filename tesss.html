<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปิดระบบคำสั่งซื้อเสื้อปฏิบัติการ 2569</title>
    
    <!-- นำเข้าฟอนต์ Prompt จาก Google Fonts เพื่อความสวยงามและอ่านง่าย -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* CSS สำหรับการจัดรูปแบบ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            padding: 50px 40px;
            max-width: 550px;
            width: 100%;
            border: 1px solid #e0e0e0; /* กรอบบางๆ เพิ่มความมินิมอล */
            background-color: #ffffff;
        }

        .status-badge {
            display: inline-block;
            background-color: #000000;
            color: #ffffff;
            padding: 6px 16px;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .announcement {
            font-size: 1.1rem;
            font-weight: 300;
            color: #555555;
            margin-bottom: 35px;
        }

        .divider {
            height: 1px;
            background-color: #000000;
            width: 40px;
            margin: 0 auto 35px auto;
        }

        .contact-info {
            font-size: 0.95rem;
            color: #333333;
            font-weight: 300;
        }

        .contact-info p {
            margin: 8px 0;
        }

        .contact-name {
            font-weight: 600;
            color: #000000;
            font-size: 1.05rem;
            margin-top: 15px !important;
        }

        .line-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
            padding: 10px 24px;
            border: 1px solid #000000;
            text-decoration: none;
            color: #000000;
            font-weight: 400;
            transition: all 0.3s ease;
        }

        .line-box:hover {
            background-color: #000000;
            color: #ffffff;
        }

        /* รองรับหน้าจอมือถือ */
        @media (max-width: 480px) {
            .container {
                padding: 40px 20px;
                border: none; /* เอาขอบออกเมื่ออยู่บนมือถือให้ดูโล่งขึ้น */
            }
            h1 {
                font-size: 1.5rem;
            }
            .announcement {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ป้ายสถานะ -->
        <div class="status-badge">SYSTEM CLOSED</div>
        
        <!-- หัวข้อหลัก -->
        <h1>ปิดระบบคำสั่งซื้อ<br>เสื้อปฏิบัติการ 2569</h1>
        
        <!-- ข้อความแจ้งเตือน -->
        <p class="announcement">กำหนดการวันรับเสื้อ จะแจ้งให้ทราบอีกครั้งในภายหลัง</p>
        
        <!-- เส้นคั่น -->
        <div class="divider"></div>
        
        <!-- ข้อมูลการติดต่อ -->
        <div class="contact-info">
            <p>หากพบข้อสงสัยหรือต้องการสอบถามเพิ่มเติม ติดต่อ:</p>
            <p class="contact-name">นายเมธี ใจสุขดี (นิสิตชั้นปีที่ 3)</p>
            
            <!-- ปุ่ม LINE ID -->
            <div class="line-box">
                <strong>LINE :</strong> &nbsp; _maytee
            </div>
        </div>
    </div>

</body>
</html>
