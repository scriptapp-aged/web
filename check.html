<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ระบบเช็คอิน - Scanner</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    },
                    boxShadow: {
                        'glass': '0 4px 20px -2px rgba(31, 38, 135, 0.1)',
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <style>
        body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        .scan-line {
            position: absolute;
            width: 100%; height: 3px;
            background: linear-gradient(to right, transparent, #60a5fa, #3b82f6, #60a5fa, transparent);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.7);
            animation: scan 2.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            display: none; z-index: 20;
        }
        @keyframes scan {
            0% { top: 5%; opacity: 0; } 15% { opacity: 1; }
            85% { opacity: 1; } 100% { top: 95%; opacity: 0; }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .header-bg {
            position: absolute;
            top: -50px; right: -50px;
            width: 200px; height: 200px;
            background: linear-gradient(to bottom right, #93c5fd, #c7d2fe);
            filter: blur(60px); opacity: 0.5;
            z-index: -1; pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col safe-area-inset overflow-hidden">
    <div class="header-bg"></div>

    <main class="flex-grow flex flex-col w-full max-w-md mx-auto p-5 relative h-screen items-stretch md:justify-center">
        
        <header class="flex flex-col animate-fade-in z-10 mb-6 mt-2">
            <!-- แถบบนสุด: ชื่อระบบ -->
            <div class="flex items-center gap-2 mb-4">
                <div class="p-1.5 bg-blue-100 text-blue-600 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                        <path fill-rule="evenodd" d="M7.5 3.75A1.5 1.5 0 006 5.25v13.5a1.5 1.5 0 001.5 1.5h9a1.5 1.5 0 001.5-1.5V5.25a1.5 1.5 0 00-1.5-1.5h-9zM15 5.25a.75.75 0 00-1.5 0v5.25a.75.75 0 001.5 0V5.25zm-6 0a.75.75 0 00-1.5 0v5.25a.75.75 0 001.5 0V5.25z" clip-rule="evenodd" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-slate-700">ระบบสแกนเช็คอิน</h1>
            </div>

            <!-- การ์ดข้อมูลโครงการ -->
            <div class="glass-card rounded-2xl p-5 shadow-sm mb-4 relative overflow-hidden">
                <h2 class="text-sm text-blue-800 font-medium tracking-wide uppercase opacity-70 mb-1">โครงการปฐมนิเทศ 2569</h2>
                <h3 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-br from-blue-700 to-indigo-700 mb-3 leading-tight">
                    "เกษตรและสิ่งแวดล้อมศึกษา"
                </h3>
                <div class="flex items-center gap-2 text-sm font-medium text-slate-600">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 text-blue-500">
                        <path d="M12.75 12.75a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM7.5 15.75a.75.75 0 100 1.5.75.75 0 000-1.5zM8.25 17.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM9.75 15.75a.75.75 0 100 1.5.75.75 0 000-1.5zM10.5 17.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM12 15.75a.75.75 0 100 1.5.75.75 0 000-1.5zM12.75 17.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM14.25 15.75a.75.75 0 100 1.5.75.75 0 000-1.5zM15 17.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM16.5 15.75a.75.75 0 100 1.5.75.75 0 000-1.5zM15 12.75a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM16.5 13.5a.75.75 0 100-1.5.75.75 0 000 1.5z" />
                        <path fill-rule="evenodd" d="M6.75 2.25A.75.75 0 017.5 3v1.5h9V3A.75.75 0 0117.25 3v1.5h1.375c.76 0 1.46.172 2.092.483l-.254-.096c-1.28-.487-2.71-.735-4.163-.735h-4.6c-1.453 0-2.883.248-4.163.735l-.254.096c.632-.311 1.333-.483 2.092-.483H6.75V3a.75.75 0 01.75-.75zM2.25 9.75v9a3 3 0 003 3h13.5a3 3 0 003-3v-9a3 3 0 00-3-3H5.25a3 3 0 00-3 3zm4.5-1.5a.75.75 0 00-.75.75v.75a.75.75 0 00.75.75h.75a.75.75 0 00.75-.75v-.75a.75.75 0 00-.75-.75h-.75zM5.25 12A.75.75 0 004.5 12.75v.75a.75.75 0 00.75.75h.75a.75.75 0 00.75-.75v-.75a.75.75 0 00-.75-.75h-.75zM7.5 14.25a.75.75 0 00-.75.75v.75a.75.75 0 00.75.75h.75a.75.75 0 00.75-.75v-.75a.75.75 0 00-.75-.75h-.75zM10.5 8.25a.75.75 0 00-.75.75v.75a.75.75 0 00.75.75h.75a.75.75 0 00.75-.75v-.75a.75.75 0 00-.75-.75h-.75zM9.75 12a.75.75 0 00-.75.75v.75a.75.75 0 00.75.75h.75a.75.75 0 00.75.75h-.75zM12 14.25a.75.75 0 00-.75.75v.75a.75.75 0 00.75.75h.75a.75.75 0 00.75-.75v-.75a.75.75 0 00-.75-.75h-.75zM13.5 8.25a.75.75 0 00-.75.75v.75a.75.75 0 00.75.75h.75a.75.75 0 00.75-.75v-.75a.75.75 0 00-.75-.75h-.75zM12.75 12a.75.75 0 00-.75.75v.75a.75.75 0 00.75.75h.75a.75.75 0 00.75-.75v-.75a.75.75 0 00-.75-.75h-.75zM14.25 14.25a.75.75 0 00-.75.75v.75a.75.75 0 00.75.75h.75a.75.75 0 00.75-.75v-.75a.75.75 0 00-.75-.75h-.75zM16.5 8.25a.75.75 0 00-.75.75v.75a.75.75 0 00.75.75h.75a.75.75 0 00.75-.75v-.75a.75.75 0 00-.75-.75h-.75zM15.75 12a.75.75 0 00-.75.75v.75a.75.75 0 00.75.75h.75a.75.75 0 00.75-.75v-.75a.75.75 0 00-.75-.75h-.75zM18.75 8.25a.75.75 0 00-.75.75v.75a.75.75 0 00.75.75h.75a.75.75 0 00.75-.75v-.75a.75.75 0 00-.75-.75h-.75z" clip-rule="evenodd" />
                    </svg>
                    วันอาทิตย์ที่ 14 มิถุนายน 2569
                </div>
            </div>

            <!-- ข้อมูลเพิ่มเติม -->
            <div class="flex flex-wrap items-center gap-3 px-2">
                <span class="inline-flex items-center gap-1.5 py-1 px-2.5 rounded-md bg-rose-50 text-rose-700 text-xs font-semibold border border-rose-100 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3">
                        <path fill-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clip-rule="evenodd" />
                    </svg>
                    สำหรับ Admin / Staff เท่านั้น
                </span>
                <span class="text-xs text-slate-500 font-medium flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3 text-slate-400">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-5.5-2.5a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0zM10 12a5.99 5.99 0 00-4.793 2.39A9.948 9.948 0 0110 18a9.948 9.948 0 01-4.793-2.39A9.948 9.948 0 0010 12z" clip-rule="evenodd" />
                    </svg>
                    พบปัญหาติดต่อ <span class="font-bold text-blue-600">เมธี</span>
                </span>
            </div>
        </header>

        <!-- พื้นที่กล้องสแกน -->
        <section id="camera-section" class="flex-grow flex flex-col justify-center items-center relative w-full my-2 z-0 animate-slide-up" style="animation-delay: 0.2s;">
            <div id="result-wrapper" class="absolute top-4 inset-x-4 z-50 transition-all duration-300 transform scale-90 opacity-0 pointer-events-none">
                <div id="result-box" class="glass-card p-4 rounded-2xl text-center shadow-xl flex flex-col items-center gap-2 border-0">
                    <div id="result-icon" class="w-12 h-12 rounded-full flex items-center justify-center shadow-sm"></div>
                    <h3 id="result-title" class="text-lg font-bold"></h3>
                    <p id="result-message" class="text-sm font-medium opacity-90 leading-tight"></p>
                </div>
            </div>

            <div id="video-container" class="relative w-full max-w-sm aspect-[3/4] rounded-[2rem] overflow-hidden shadow-2xl shadow-blue-900/10 border-4 border-white bg-slate-900 z-10">
                <video id="video" playsinline autoplay muted class="w-full h-full object-cover transform scale-[1.02]"></video>
                <div id="scan-line" class="scan-line"></div>
                <canvas id="canvas" hidden></canvas>
                
                <div id="viewfinder" class="absolute inset-0 pointer-events-none hidden">
                    <div class="absolute inset-0 border-[1.5rem] border-slate-900/40 rounded-[1.75rem]"></div>
                    <div class="absolute inset-[1.5rem] border-2 border-white/30 rounded-xl">
                        <div class="absolute top-0 left-0 w-5 h-5 border-t-4 border-l-4 border-blue-400 rounded-tl-md"></div>
                        <div class="absolute top-0 right-0 w-5 h-5 border-t-4 border-r-4 border-blue-400 rounded-tr-md"></div>
                        <div class="absolute bottom-0 left-0 w-5 h-5 border-b-4 border-l-4 border-blue-400 rounded-bl-md"></div>
                        <div class="absolute bottom-0 right-0 w-5 h-5 border-b-4 border-r-4 border-blue-400 rounded-br-md"></div>
                    </div>
                </div>
                
                <div id="camera-placeholder" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-slate-800/90 backdrop-blur-sm">
                    <div class="w-16 h-16 bg-slate-700/80 rounded-full flex items-center justify-center mb-3 shadow-inner animate-pulse-slow">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </div>
                    <p class="font-medium text-slate-300">พร้อมสแกน</p>
                </div>
            </div>
        </section>

        <!-- ส่วนควบคุม -->
        <footer class="flex flex-col items-center mt-auto pt-4 pb-2 z-20 animate-slide-up" style="animation-delay: 0.4s;">
            <div class="w-full flex justify-center relative z-30">
                <button id="btn-start" onclick="startCamera()" class="w-full max-w-xs bg-blue-600 hover:bg-blue-700 text-white py-3 px-6 rounded-xl font-semibold shadow-md transition-all duration-200 transform hover:-translate-y-0.5 active:scale-95 flex justify-center items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                        <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" />
                        <path fill-rule="evenodd" d="M1.323 11.447C2.811 6.976 7.028 3.75 12.001 3.75c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113-1.487 4.471-5.705 7.697-10.677 7.697-4.97 0-9.186-3.223-10.675-7.69a1.762 1.762 0 010-1.113zM17.25 12a5.25 5.25 0 11-10.5 0 5.25 5.25 0 0110.5 0z" clip-rule="evenodd" />
                    </svg>
                    เปิดกล้องสแกน
                </button>
                <button id="btn-stop" onclick="stopCamera()" class="hidden w-full max-w-xs bg-white text-slate-700 border border-slate-200 py-3 px-6 rounded-xl font-semibold shadow-sm hover:bg-slate-50 transition-all duration-200 transform active:scale-95 flex justify-center items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-slate-500">
                        <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm13.36-1.814a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd" />
                    </svg>
                    ปิดกล้อง
                </button>
            </div>
        </footer>
    </main>

    <script>
        // =======================================================
        // ใส่ URL ของ Google Apps Script ที่ได้จากการ Deploy ที่นี่ 👇
        // =======================================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/ใส่_ID_ของคุณตรงนี้/exec";

        const video = document.getElementById("video");
        const canvasElement = document.getElementById("canvas");
        const canvas = canvasElement.getContext("2d", { willReadFrequently: true });
        const btnStart = document.getElementById("btn-start");
        const btnStop = document.getElementById("btn-stop");
        const scanLine = document.getElementById("scan-line");
        const placeholder = document.getElementById("camera-placeholder");
        const viewfinder = document.getElementById("viewfinder");
        const resultWrapper = document.getElementById("result-wrapper");
        const resultBox = document.getElementById("result-box");
        const resultIcon = document.getElementById("result-icon");
        const resultTitle = document.getElementById("result-title");
        const resultMessage = document.getElementById("result-message");

        let scanning = false;
        let stream = null;

        const icons = {
            success: `<svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" /></svg>`,
            duplicate: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-7 w-7 text-white"><path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" /></svg>`,
            error: `<svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>`,
            loading: `<svg class="animate-spin h-7 w-7 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`
        };

        async function startCamera() {
            hideResult();
            
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showResult("error", "เบราว์เซอร์ไม่รองรับ", "กรุณาเปิดผ่าน Chrome หรือ Safari");
                return;
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            } catch (err) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                } catch (fallbackErr) {
                    showResult("error", "เข้าถึงกล้องไม่ได้", "กรุณาอนุญาตการใช้งานกล้องในการตั้งค่าของเบราว์เซอร์");
                    return;
                }
            }
            
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            video.muted = true;

            video.onloadedmetadata = () => {
                 video.play().then(() => {
                     placeholder.style.display = "none";
                     scanLine.style.display = "block";
                     viewfinder.classList.remove("hidden");
                     btnStart.classList.add("hidden");
                     btnStop.classList.remove("hidden");
                     scanning = true;
                     requestAnimationFrame(tick);
                 });
            };
        }

        function stopCamera() {
            scanning = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            video.srcObject = null;
            scanLine.style.display = "none";
            viewfinder.classList.add("hidden");
            placeholder.style.display = "flex";
            btnStart.classList.remove("hidden");
            btnStop.classList.add("hidden");
        }

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && scanning) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                var imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                var code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code) {
                    processQRCode(code.data);
                } else {
                    requestAnimationFrame(tick);
                }
            } else if (scanning) {
                requestAnimationFrame(tick);
            }
        }

        function processQRCode(qrData) {
            scanning = false; 
            scanLine.style.display = "none";
            showResult("loading", "กำลังบันทึกข้อมูล...", "กรุณารอสักครู่");

            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8eTkS7dM96oQ-yqKKk1zRCDioQkw5w8N7UpoCBZ8AI0QVecuMItd3AaCIBX-lPwyX/exec/exec";
            if(GOOGLE_SCRIPT_URL.includes("ใส่_ID_ของคุณตรงนี้")) {
                showResult("error", "ตั้งค่าไม่สมบูรณ์", "กรุณาใส่ URL ของ API ในโค้ดบรรทัดที่ 279");
                resumeScanningAfterDelay();
                return;
            }

            // ส่งข้อมูลไปที่ Google Apps Script API ผ่าน fetch
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ qrData: qrData })
            })
            .then(response => response.json())
            .then(res => {
                showResult(res.status, res.message, res.name || "");
                resumeScanningAfterDelay();
            })
            .catch(error => {
                showResult("error", "ข้อผิดพลาดเครือข่าย", "ไม่สามารถเชื่อมต่อกับฐานข้อมูลได้");
                resumeScanningAfterDelay();
            });
        }

        function resumeScanningAfterDelay() {
            setTimeout(() => {
                if (stream && stream.active && !scanning) {
                    hideResult();
                    scanLine.style.display = "block";
                    scanning = true;
                    requestAnimationFrame(tick);
                }
            }, 3000);
        }

        function showResult(status, title, message) {
            resultIcon.className = "w-12 h-12 rounded-full flex items-center justify-center shadow-sm";
            resultBox.className = "glass-card p-4 rounded-2xl text-center shadow-xl flex flex-col items-center gap-2 border-0 transition-colors duration-300";

            if (status === "success") {
                resultBox.classList.add('bg-emerald-500', 'text-white');
                resultIcon.classList.add('bg-emerald-600/50');
                resultIcon.innerHTML = icons.success;
            } else if (status === "duplicate") {
                resultBox.classList.add('bg-amber-500', 'text-white');
                resultIcon.classList.add('bg-amber-600/50');
                resultIcon.innerHTML = icons.duplicate;
            } else if (status === "notfound" || status === "error") {
                resultBox.classList.add('bg-rose-500', 'text-white');
                resultIcon.classList.add('bg-rose-600/50');
                resultIcon.innerHTML = icons.error;
            } else if (status === "loading") {
                resultBox.classList.add('bg-blue-600', 'text-white');
                resultIcon.classList.add('bg-blue-700/50');
                resultIcon.innerHTML = icons.loading;
            }

            resultTitle.innerText = title;
            resultMessage.innerText = message;
            resultWrapper.classList.remove('scale-90', 'opacity-0', 'pointer-events-none');
            resultWrapper.classList.add('scale-100', 'opacity-100');
        }

        function hideResult() {
            resultWrapper.classList.remove('scale-100', 'opacity-100');
            resultWrapper.classList.add('scale-90', 'opacity-0', 'pointer-events-none');
        }
    </script>
</body>
</html>
