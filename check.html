<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Modern Scanner - เช็คอิน</title>
    
    <!-- Google Font: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#eff6ff', 100: '#dbeafe', 400: '#60a5fa',
                            500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a',
                        }
                    },
                    animation: {
                        'scan-laser': 'scan 2.5s cubic-bezier(0.53, 0.04, 0.36, 1.03) infinite',
                        'slide-down': 'slideDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pop-in': 'popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-glow': 'pulseGlow 2s infinite',
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                        'fade-out-up': 'fadeOutUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        scan: {
                            '0%': { top: '0%', opacity: '0' },
                            '15%': { opacity: '1' },
                            '85%': { opacity: '1' },
                            '100%': { top: '100%', opacity: '0' }
                        },
                        slideDown: {
                            '0%': { transform: 'translateY(-150%) scale(0.9)', opacity: '0' },
                            '100%': { transform: 'translateY(0) scale(1)', opacity: '1' }
                        },
                        popIn: {
                            '0%': { transform: 'scale(0.95)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' }
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 0 0 rgba(59, 130, 246, 0.4)' },
                            '50%': { boxShadow: '0 0 20px 0 rgba(59, 130, 246, 0.8)' }
                        },
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        },
                        fadeOutUp: {
                            '0%': { transform: 'translateY(0)', opacity: '1' },
                            '100%': { transform: 'translateY(-50px)', opacity: '0', visibility: 'hidden' }
                        }
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <style>
        body { 
            background-color: #f8fafc; 
            overscroll-behavior-y: none; 
            -webkit-tap-highlight-color: transparent; 
        }
        ::-webkit-scrollbar { display: none; }
        
        .modern-bg {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(219, 234, 254, 0.4), transparent 50%),
                        radial-gradient(circle at 85% 30%, rgba(224, 231, 255, 0.5), transparent 50%);
        }

        .laser-beam {
            position: absolute; left: 0; right: 0; height: 3px;
            background: #fff;
            box-shadow: 0 0 15px 4px #3b82f6, 0 0 30px 8px #60a5fa;
            z-index: 30; display: none;
        }

        /* Fix 100vh issue on mobile */
        .h-screen-dynamic { height: 100dvh; }
    </style>
</head>
<body class="text-slate-800 antialiased overflow-hidden">
    
    <div class="modern-bg"></div>

    <!-- ========================================== -->
    <!-- 1. หน้าจอ Login (แสดงเป็นหน้าแรก) -->
    <!-- ========================================== -->
    <div id="login-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 px-6 transition-all duration-500">
        <!-- เอฟเฟกต์แสงพื้นหลัง -->
        <div class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-brand-900/50 to-transparent"></div>
        <div class="absolute bottom-10 right-10 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl"></div>
        <div class="absolute top-1/4 left-0 w-48 h-48 bg-brand-500/10 rounded-full blur-3xl"></div>

        <!-- กล่อง Login -->
        <div id="login-box" class="relative z-10 w-full max-w-sm bg-white/10 backdrop-blur-xl border border-white/20 rounded-[2rem] p-8 shadow-2xl flex flex-col items-center text-center">
            
            <div class="w-16 h-16 bg-gradient-to-br from-emerald-400 to-cyan-500 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-emerald-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 text-white">

            <h2 class="text-2xl font-bold text-white mb-1 tracking-wide">เข้าสู่ระบบ</h2>
            <p class="text-slate-300 text-sm mb-8">Staff Only - โครงการปฐมนิเทศ 2569</p>

            <div class="w-full relative mb-6">
                <input type="password" id="pin-input" inputmode="numeric" placeholder="ใส่รหัสผ่าน (PIN)"

            <button onclick="checkLogin()" id="login-btn" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-white font-bold text-lg py-4 rounded-xl shadow-lg shadow-emerald-500/25 transition-all active:scale-95 flex justify-center items-center gap-2">

                    <div class="w-20 h-20 bg-slate-700/50 rounded-[1.5rem] flex items-center justify-center mb-4 border border-slate-600/50 relative overflow-hidden group">
                        <div class="absolute inset-0 bg-brand-500/20 translate-y-full transition-transform"></div>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>

        <!-- Footer / Dock Controls -->

            <div class="bg-white p-2 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.06)] border border-slate-100 flex flex-col gap-2">

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                        <path fill-rule="evenodd" d="M1.5 4.5a3 3 0 013-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 01-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 006.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 011.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 01-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5z" clip-rule="evenodd" />

                    </svg>
                    พักหน้าจอ

                    <div class="w-1.5 h-1.5 rounded-full bg-slate-300"></div>
                    พบปัญหาติดต่อทีมซัพพอร์ต <span class="font-bold text-slate-600">คุณเมธี</span>
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-300"></div>
                </div>
            </div>
        </footer>
    </main>

    <script>
        // =======================================================
        // ⚠️ ใส่ URL ของ Web App จาก Google Apps Script (ลงท้ายด้วย /exec)
        // =======================================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/ใส่_ID_ของคุณตรงนี้/exec";

        // โค้ดส่วนจัดการ Login
        document.addEventListener('DOMContentLoaded', () => {
            // เช็คว่าเคยล็อกอินหรือยัง
            if (sessionStorage.getItem('staff_logged_in') === 'true') {
                const staffName = sessionStorage.getItem('staff_name') || 'Staff';
                document.getElementById('staff-name-display').innerText = staffName;
                showApp();
            }
            
            document.getElementById('pin-input').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') checkLogin();
            });
        });

        // ฟังก์ชันล็อกอิน (Backend Verification)
        async function checkLogin() {
            const pin = document.getElementById('pin-input').value;
            const btn = document.getElementById('login-btn');
            const error = document.getElementById('login-error');
            const box = document.getElementById('login-box');

            if (!pin) return;

            error.classList.add('hidden');
            const originalBtnText = btn.innerHTML;
            
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังตรวจสอบ...`;

            try {
                if (GOOGLE_SCRIPT_URL.includes("ใส่_ID_ของคุณตรงนี้") || GOOGLE_SCRIPT_URL.trim() === "") {
                    throw new Error("MISSING_URL");
                }

                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "login", pin: pin }),
                    redirect: 'follow'
                });
                
                if (!response.ok) throw new Error("NETWORK_ERROR");
                
                const res = await response.json();

                if (res.status === "success") {
                    sessionStorage.setItem('staff_logged_in', 'true');
                    sessionStorage.setItem('staff_name', res.staffName); 
                    document.getElementById('staff-name-display').innerText = res.staffName; 
                    
                    document.getElementById('login-screen').classList.add('animate-fade-out-up');
                    setTimeout(() => { showApp(); }, 500);
                } else {
                    showLoginError(res.message || "รหัส PIN ไม่ถูกต้อง");
                    btn.innerHTML = originalBtnText;
                }
            } catch (err) {
                let errorMsg = "ระบบเครือข่ายขัดข้อง กรุณาลองใหม่";
                if (err.message === "MISSING_URL") {
                    errorMsg = "นักพัฒนา: ลืมใส่ URL Apps Script บรรทัด 207";
                }
                
                showLoginError(errorMsg);
                btn.innerHTML = originalBtnText;
            }
        }

        function showLoginError(msg) {
            const error = document.getElementById('login-error');
            const box = document.getElementById('login-box');
            error.innerText = msg;
            error.classList.remove('hidden');
            
            box.classList.remove('animate-shake');
            void box.offsetWidth; 
            box.classList.add('animate-shake');
            document.getElementById('pin-input').value = "";
        }

        function showApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('main-app').classList.add('animate-pop-in');
        }

        function logout() {
            if(confirm('ต้องการออกจากระบบใช่หรือไม่?')) {
                stopCamera();
                sessionStorage.removeItem('staff_logged_in');
                sessionStorage.removeItem('staff_name');
                location.reload(); 
            }
        }

        // =======================================================
        // โค้ดส่วนกล้องและสแกนเนอร์
        // =======================================================
        const video = document.getElementById("video");
        const canvasElement = document.getElementById("canvas");
        const canvas = canvasElement.getContext("2d", { willReadFrequently: true });
        const btnStart = document.getElementById("btn-start");
        const btnStop = document.getElementById("btn-stop");
        const laser = document.getElementById("laser");
        const placeholder = document.getElementById("camera-off-state");
        const viewfinder = document.getElementById("viewfinder");
        
        const toast = document.getElementById("toast-notification");
        const toastBox = document.getElementById("toast-box");
        const toastIcon = document.getElementById("toast-icon");
        const toastTitle = document.getElementById("toast-title");
        const toastMsg = document.getElementById("toast-msg");

        let scanning = false;
        let stream = null;
        let toastTimeout = null;

        const icons = {
            success: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 text-emerald-600"><path fill-rule="evenodd" d="M19.916 4.626a.75.75 0 01.208 1.04l-9 13.5a.75.75 0 01-1.154.114l-6-6a.75.75 0 011.06-1.06l5.353 5.353 8.493-12.739a.75.75 0 011.04-.208z" clip-rule="evenodd" /></svg>`,
            duplicate: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 text-amber-600"><path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm8.706-1.442c1.146-.573 2.437.463 2.126 1.706l-.709 2.836.042-.02a.75.75 0 01.67 1.34l-.04.022c-1.147.573-2.438-.463-2.127-1.706l.71-2.836-.042.02a.75.75 0 11-.671-1.34l.041-.022zM12 9a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" /></svg>`,
            error: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 text-rose-600"><path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm-1.72 6.97a.75.75 0 10-1.06 1.06L10.94 12l-1.72 1.72a.75.75 0 101.06 1.06L12 13.06l1.72 1.72a.75.75 0 101.06-1.06L13.06 12l1.72-1.72a.75.75 0 10-1.06-1.06L12 10.94l-1.72-1.72z" clip-rule="evenodd" /></svg>`,
            loading: `<svg class="animate-spin w-6 h-6 text-brand-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`
        };

        async function startCamera() {
            hideToast();

            const ua = navigator.userAgent || window.opera;
            if (ua.indexOf("Line") > -1 || ua.indexOf("FBAN") > -1 || ua.indexOf("FBAV") > -1) {
                showToast("error", "พบการเปิดผ่านแอปแชท", "กรุณากด 'เปิดในเบราว์เซอร์' (Chrome/Safari) เพื่อใช้งานกล้อง");
                return;
            }
            
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showToast("error", "ไม่รองรับการเปิดกล้อง", "โปรดใช้งานบน HTTPS และเบราว์เซอร์ที่รองรับ");
                return;
            }

            btnStart.innerHTML = icons.loading + " <span class='text-white ml-2'>กำลังเปิดกล้อง...</span>";
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            } catch (err) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                } catch (fallbackErr) {
                    showToast("error", "เข้าถึงกล้องไม่ได้", "โปรดอนุญาตสิทธิ์กล้อง หรือตรวจสอบอุปกรณ์");
                    resetStartBtn();
                    return;
                }
            }
            
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            video.muted = true;

            video.onloadedmetadata = () => {
                 video.play().then(() => {
                     placeholder.style.display = "none";
                     laser.style.display = "block";
                     viewfinder.classList.remove("hidden");
                     btnStart.classList.add("hidden");
                     btnStop.classList.remove("hidden");
                     resetStartBtn();
                     scanning = true;
                     requestAnimationFrame(tick);
                 }).catch(e => {
                      showToast("error", "วิดีโอถูกบล็อก", "ลองรีเฟรชหน้าเว็บอีกครั้ง");
                      resetStartBtn();
                 });
            };
        }

        function resetStartBtn() {
            btnStart.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path fill-rule="evenodd" d="M1.5 4.5a3 3 0 013-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 01-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 006.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 011.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 01-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5z" clip-rule="evenodd" /></svg> แตะเพื่อเริ่มสแกน`;
        }

        function stopCamera() {
            scanning = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            video.srcObject = null;
            laser.style.display = "none";
            viewfinder.classList.add("hidden");
            placeholder.style.display = "flex";
            btnStart.classList.remove("hidden");
            btnStop.classList.add("hidden");
            hideToast();
        }

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && scanning) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                var imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                var code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert", // Optimize for speed
                });

                if (code) {
                    processQRCode(code.data);
                } else {
                    requestAnimationFrame(tick);
                }
            } else if (scanning) {
                requestAnimationFrame(tick);
            }
        }

        function processQRCode(qrData) {
            scanning = false; 
            laser.style.display = "none";
            viewfinder.style.opacity = "0.5";
            
            showToast("loading", "กำลังซิงค์ข้อมูล...", "รอสักครู่");

            const staffName = sessionStorage.getItem('staff_name') || 'Unknown';

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ qrData: qrData, scannedBy: staffName }) 
            })
            .then(response => response.json())
            .then(res => {
                showToast(res.status, res.message, res.name || qrData);
                resumeScanningAfterDelay();
            })
            .catch(error => {
                showToast("error", "ออฟไลน์ / ระบบขัดข้อง", "ไม่สามารถส่งข้อมูลเข้า Sheet ได้");
                resumeScanningAfterDelay();
            });
        }

        function resumeScanningAfterDelay() {
            setTimeout(() => {
                if (stream && stream.active && !scanning) {
                    hideToast();
                    laser.style.display = "block";
                    viewfinder.style.opacity = "1";
                    scanning = true;
                    requestAnimationFrame(tick);
                }
            }, 2500); 
        }

        function showToast(status, title, message) {
            if(toastTimeout) clearTimeout(toastTimeout);

            toast.classList.remove('hidden');
            toast.classList.remove('animate-slide-down');
            void toast.offsetWidth; 
            toast.classList.add('animate-slide-down');
            
            toastTitle.innerText = title;
            toastMsg.innerText = message;
            
            toastIcon.className = "w-12 h-12 rounded-full flex items-center justify-center shrink-0 ";
            toastBox.className = "bg-white rounded-2xl p-4 shadow-2xl flex items-center gap-4 border border-slate-100 transform transition-transform duration-300";

            if (status === "success") {
                toastIcon.classList.add('bg-emerald-100');
                toastIcon.innerHTML = icons.success;
                toastTitle.className = 'text-base font-bold text-emerald-700 leading-tight';
            } else if (status === "duplicate") {
                toastIcon.classList.add('bg-amber-100');
                toastIcon.innerHTML = icons.duplicate;
                toastTitle.className = 'text-base font-bold text-amber-700 leading-tight';
            } else if (status === "notfound" || status === "error") {
                toastIcon.classList.add('bg-rose-100');
                toastIcon.innerHTML = icons.error;
                toastTitle.className = 'text-base font-bold text-rose-700 leading-tight';
            } else if (status === "loading") {
                toastIcon.classList.add('bg-brand-50');
                toastIcon.innerHTML = icons.loading;
                toastTitle.className = 'text-base font-bold text-brand-700 leading-tight';
            }
        }

        function hideToast() {
            toast.classList.add('animate-fade-out-up');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('animate-fade-out-up');
            }, 600);
        }
    </script>
</body>
</html>
