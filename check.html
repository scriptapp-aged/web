<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ระบบเช็คอิน - Scanner</title>
    
    <!-- นำเข้า Google Font: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- นำเข้า Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                        'fade-out-up': 'fadeOutUp 0.6s ease-in forwards',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-2px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(4px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-6px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(6px, 0, 0)' }
                        },
                        fadeOutUp: { '0%': { transform: 'translateY(0)', opacity: '1' }, '100%': { transform: 'translateY(-30px)', opacity: '0', visibility: 'hidden' } }
                    },
                    boxShadow: { 'glass': '0 4px 20px -2px rgba(31, 38, 135, 0.1)' }
                }
            }
        }
    </script>

    <!-- นำเข้า jsQR library -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <style>
        body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        .scan-line {
            position: absolute; width: 100%; height: 3px;
            background: linear-gradient(to right, transparent, #60a5fa, #3b82f6, #60a5fa, transparent);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.7);
            animation: scan 2.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            display: none; z-index: 20;
        }
        @keyframes scan {
            0% { top: 5%; opacity: 0; } 15% { opacity: 1; }
            85% { opacity: 1; } 100% { top: 95%; opacity: 0; }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .header-bg {
            position: absolute; top: -50px; right: -50px;
            width: 200px; height: 200px; background: linear-gradient(to bottom right, #93c5fd, #c7d2fe);
            filter: blur(60px); opacity: 0.5; z-index: -1; pointer-events: none;
        }
        .dark-card {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>

    <script>
        // =======================================================
        // ⚠️ ใส่ URL ของ Web App จาก Google Apps Script ตรงนี้!
        // =======================================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5t9-U10-PZ5L_mXk3a9w1sN3G2L_-vU3W5zH3B7_aA4L8wL9C_rV4X5P7X9Q4w/exec"; // เปลี่ยน URL นี้

        // --- ส่วนจัดการหน้า Login ---
        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('staff_logged_in') === 'true') {
                document.getElementById('staff-name-display').innerText = sessionStorage.getItem('staff_name') || 'Staff';
                showApp();
            }
            document.getElementById('pin-input').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') checkLogin();
            });
        });

        async function checkLogin() {
            const pin = document.getElementById('pin-input').value;
            const btn = document.getElementById('login-btn');
            const box = document.getElementById('login-box');

            if (!pin) return;
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white inline-block" xmlns="https://script.google.com/macros/s/AKfycbx8eTkS7dM96oQ-yqKKk1zRCDioQkw5w8N7UpoCBZ8AI0QVecuMItd3AaCIBX-lPwyX/exec" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> ตรวจสอบ...`;
            
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "login", pin: pin })
                });
                const res = await response.json();

                if (res.status === "success") {
                    sessionStorage.setItem('staff_logged_in', 'true');
                    sessionStorage.setItem('staff_name', res.staffName);
                    document.getElementById('staff-name-display').innerText = res.staffName;
                    
                    document.getElementById('login-screen').classList.add('animate-fade-out-up');
                    setTimeout(() => { showApp(); }, 500);
                } else {
                    triggerShake(box);
                    btn.innerHTML = originalBtnText;
                    document.getElementById('pin-input').value = '';
                    alert(res.message); // Fallback alert for login error
                }
            } catch (err) {
                triggerShake(box);
                btn.innerHTML = originalBtnText;
                alert("เครือข่ายขัดข้อง กรุณาลองใหม่");
            }
        }

        function triggerShake(el) {
            el.classList.remove('animate-shake');
            void el.offsetWidth;
            el.classList.add('animate-shake');
        }

        function showApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('main-app').classList.add('animate-fadeIn');
        }

        function logout() {
            // ออกจากระบบทันทีแบบปลอดภัยโดยไม่ต้องใช้ confirm()
            stopCamera();
            sessionStorage.removeItem('staff_logged_in');
            sessionStorage.removeItem('staff_name');
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('animate-fade-out-up');
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('pin-input').value = '';
        }

        // --- ส่วนการทำงานของกล้องและการสแกน ---
        const video = document.getElementById("video");
        const canvasElement = document.getElementById("canvas");
        const canvas = canvasElement.getContext("2d", { willReadFrequently: true });
        const btnStart = document.getElementById("btn-start");
        const btnStop = document.getElementById("btn-stop");
        const scanLine = document.getElementById("scan-line");
        const placeholder = document.getElementById("camera-placeholder");
        const viewfinder = document.getElementById("viewfinder");
        
        const toastWrapper = document.getElementById("toast-wrapper");
        const toastBox = document.getElementById("toast-box");
        const toastIcon = document.getElementById("toast-icon");
        const toastTitle = document.getElementById("toast-title");
        const toastMessage = document.getElementById("toast-message");

        let scanning = false;
        let stream = null;

        const icons = {
            success: `<svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" /></svg>`,
            duplicate: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-7 w-7 text-white"><path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" /></svg>`,
            error: `<svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>`,
            loading: `<svg class="animate-spin h-7 w-7 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`
        };

        async function startCamera() {
            hideToast();

            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (ua.indexOf("Line") > -1 || ua.indexOf("FBAN") > -1 || ua.indexOf("FBAV") > -1) {
                showToast("error", "ไม่สามารถเปิดกล้องได้", "กรุณาเปิดลิงก์ผ่าน Chrome หรือ Safari โดยตรง");
                return;
            }
            
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showToast("error", "เบราว์เซอร์ไม่รองรับ", "กรุณาเปิดผ่าน HTTPS");
                return;
            }

            showToast("loading", "กำลังเปิดกล้อง...", "กรุณากดยอมรับ (Allow)");

            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            } catch (err) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                } catch (fallbackErr) {
                    showToast("error", "เกิดข้อผิดพลาด", "ไม่สามารถเข้าถึงกล้องได้");
                    return;
                }
            }
            
            hideToast();
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            video.muted = true;

            video.onloadedmetadata = () => {
                 video.play().then(() => {
                     placeholder.style.display = "none";
                     scanLine.style.display = "block";
                     viewfinder.classList.remove("hidden");
                     btnStart.classList.add("hidden");
                     btnStop.classList.remove("hidden");
                     scanning = true;
                     requestAnimationFrame(tick);
                 }).catch(e => {
                      showToast("error", "วิดีโอไม่ทำงาน", "กรุณารีเฟรชหน้าเว็บ");
                 });
            };
        }

        function stopCamera() {
            scanning = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            video.srcObject = null;
            scanLine.style.display = "none";
            viewfinder.classList.add("hidden");
            placeholder.style.display = "flex";
            btnStart.classList.remove("hidden");
            btnStop.classList.add("hidden");
        }

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && scanning) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                var imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                var code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

                if (code) {
                    processQRCode(code.data);
                } else {
                    requestAnimationFrame(tick);
                }
            } else if (scanning) {
                requestAnimationFrame(tick);
            }
        }

        function processQRCode(qrData) {
            scanning = false;
            scanLine.style.display = "none";
            showToast("loading", "กำลังซิงค์ข้อมูล...", "รอสักครู่");

            const staffName = sessionStorage.getItem('staff_name') || 'Unknown';

            // ส่งข้อมูลผ่าน fetch ไปยัง Backend
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ qrData: qrData, scannedBy: staffName })
            })
            .then(response => response.json())
            .then(res => {
                showToast(res.status, res.message, res.name || "");
                resumeScanningAfterDelay();
            })
            .catch(error => {
                showToast("error", "เครือข่ายขัดข้อง", "ไม่สามารถเชื่อมต่อฐานข้อมูลได้");
                resumeScanningAfterDelay();
            });
        }

        function resumeScanningAfterDelay() {
            setTimeout(() => {
                if (stream && stream.active && !scanning) {
                    hideToast();
                    scanLine.style.display = "block";
                    scanning = true;
                    requestAnimationFrame(tick);
                }
            }, 3000);
        }

        function showToast(status, title, message) {
            toastIcon.className = "w-12 h-12 rounded-full flex items-center justify-center shadow-sm";
            toastBox.className = "glass-card max-w-sm mx-auto p-4 rounded-2xl text-center shadow-2xl flex flex-col items-center gap-2 border-0 transition-colors duration-300";

            if (status === "success") {
                toastBox.classList.add('bg-emerald-500', 'text-white');
                toastIcon.classList.add('bg-emerald-600/50');
                toastIcon.innerHTML = icons.success;
            } else if (status === "duplicate") {
                toastBox.classList.add('bg-amber-500', 'text-white');
                toastIcon.classList.add('bg-amber-600/50');
                toastIcon.innerHTML = icons.duplicate;
            } else if (status === "notfound" || status === "error") {
                toastBox.classList.add('bg-rose-500', 'text-white');
                toastIcon.classList.add('bg-rose-600/50');
                toastIcon.innerHTML = icons.error;
            } else if (status === "loading") {
                toastBox.classList.add('bg-blue-600', 'text-white');
                toastIcon.classList.add('bg-blue-700/50');
                toastIcon.innerHTML = icons.loading;
            }

            toastTitle.innerText = title;
            toastMessage.innerText = message;

            toastWrapper.classList.remove('-translate-y-full', 'opacity-0', 'pointer-events-none');
            toastWrapper.classList.add('translate-y-0', 'opacity-100');
        }

        function hideToast() {
            toastWrapper.classList.remove('translate-y-0', 'opacity-100');
            toastWrapper.classList.add('-translate-y-full', 'opacity-0', 'pointer-events-none');
        }
    </script>
</body>
</html>
