<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scanner App - ระบบเช็คอิน</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'slide-down': 'slideDown 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards',
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                        'blob': 'blob 10s infinite',
                    },
                    keyframes: {
                        slideDown: { '0%': { opacity: '0', transform: 'translateY(-30px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(40px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        shake: { '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' }, '20%, 80%': { transform: 'translate3d(2px, 0, 0)' }, '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' }, '40%, 60%': { transform: 'translate3d(4px, 0, 0)' } },
                        blob: { '0%': { transform: 'translate(0px, 0px) scale(1)' }, '33%': { transform: 'translate(30px, -50px) scale(1.1)' }, '66%': { transform: 'translate(-20px, 20px) scale(0.9)' }, '100%': { transform: 'translate(0px, 0px) scale(1)' } }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <style>
        body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        /* Ultra Modern Glassmorphism */
        .glass-ultra {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .dark-glass-ultra {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.3);
        }

        /* Sleek Laser Scanner */
        .scan-laser {
            position: absolute;
            width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, #3b82f6, #60a5fa, #3b82f6, transparent);
            box-shadow: 0 0 20px 4px rgba(59, 130, 246, 0.6);
            animation: scan 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            z-index: 20;
        }
        @keyframes scan { 0% { top: -5%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 105%; opacity: 0; } }

        /* Animated Mesh Background */
        .mesh-bg {
            position: fixed; inset: 0; z-index: -1;
            background-color: #f0f4f8;
            overflow: hidden;
        }
        .blob-1 { position: absolute; top: -10%; left: -10%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(147,197,253,0.8) 0%, rgba(147,197,253,0) 70%); border-radius: 50%; filter: blur(60px); animation: blob 12s infinite alternate; }
        .blob-2 { position: absolute; bottom: -20%; right: -10%; width: 600px; height: 600px; background: radial-gradient(circle, rgba(167,139,250,0.6) 0%, rgba(167,139,250,0) 70%); border-radius: 50%; filter: blur(60px); animation: blob 15s infinite alternate-reverse; }
        .blob-3 { position: absolute; top: 40%; left: 40%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(110,231,183,0.5) 0%, rgba(110,231,183,0) 70%); border-radius: 50%; filter: blur(60px); animation: blob 10s infinite; }

        /* Neumorphic/Soft Input */
        .pin-input {
            letter-spacing: 0.5em;
            text-security: disc;
            -webkit-text-security: disc;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col safe-area-inset relative">
    
    <!-- Background Elements -->
    <div class="mesh-bg">
        <div class="blob-1"></div>
        <div class="blob-2"></div>
        <div class="blob-3"></div>
    </div>

    <!-- ========================================== -->
    <!-- 1. LOGIN SCREEN -->
    <!-- ========================================== -->
    <div id="login-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center p-6 bg-slate-900/40 backdrop-blur-[30px] transition-all duration-700">
        <div class="w-full max-w-sm flex flex-col items-center animate-slide-down">
            <div class="w-24 h-24 dark-glass-ultra rounded-[2.5rem] flex items-center justify-center mb-8 border border-white/20 shadow-2xl relative overflow-hidden group">
                <div class="absolute inset-0 bg-gradient-to-br from-blue-500/20 to-purple-500/20 group-hover:scale-150 transition-transform duration-700"></div>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-12 h-12 text-white relative z-10">
                    <path fill-rule="evenodd" d="M7.5 3.75A1.5 1.5 0 006 5.25v13.5a1.5 1.5 0 001.5 1.5h9a1.5 1.5 0 001.5-1.5V5.25a1.5 1.5 0 00-1.5-1.5h-9zM15 5.25a.75.75 0 00-1.5 0v5.25a.75.75 0 001.5 0V5.25zm-6 0a.75.75 0 00-1.5 0v5.25a.75.75 0 001.5 0V5.25z" clip-rule="evenodd" />
                </svg>
            </div>
            <h1 class="text-4xl font-extrabold text-white mb-2 tracking-tight drop-shadow-md">Staff Access</h1>
            <p class="text-slate-200/80 mb-10 text-center font-medium">เข้าสู่ระบบเพื่อใช้งานกล้องสแกน</p>

            <div class="w-full relative" id="pin-container">
                <input type="password" id="pin-input" inputmode="numeric" pattern="[0-9]*" placeholder="••••" maxlength="6" 
                    class="pin-input w-full bg-white/10 backdrop-blur-md border border-white/30 text-white text-center text-4xl font-bold rounded-[2rem] py-5 focus:outline-none focus:border-blue-400 focus:bg-white/20 transition-all placeholder:text-white/30 placeholder:tracking-widest shadow-inner">
                
                <p id="login-error" class="absolute -bottom-8 left-0 w-full text-center text-rose-300 text-sm font-semibold opacity-0 transition-opacity drop-shadow-md"></p>
            </div>

            <button id="btn-login" onclick="checkLogin()" class="w-full mt-12 bg-white text-blue-600 hover:bg-slate-50 font-bold py-5 rounded-[2rem] shadow-[0_10px_30px_rgba(255,255,255,0.2)] transition-all active:scale-95 flex items-center justify-center gap-2 text-lg">
                <span id="btn-login-text">เข้าสู่ระบบ</span>
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. MAIN APP -->
    <!-- ========================================== -->
    <main id="main-app" class="flex-grow flex flex-col w-full max-w-md mx-auto relative h-screen hidden">
        
        <!-- Header Section -->
        <header class="pt-6 px-6 z-10 animate-slide-down">
            <div class="flex justify-between items-center mb-5">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white/80 backdrop-blur-md rounded-2xl flex items-center justify-center text-blue-600 shadow-sm border border-white">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" /><path fill-rule="evenodd" d="M1.323 11.447C2.811 6.976 7.028 3.75 12.001 3.75c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113-1.487 4.471-5.705 7.697-10.677 7.697-4.97 0-9.186-3.223-10.675-7.69a1.762 1.762 0 010-1.113zM17.25 12a5.25 5.25 0 11-10.5 0 5.25 5.25 0 0110.5 0z" clip-rule="evenodd" /></svg>
                    </div>
                    <h1 class="text-xl font-bold text-slate-800 tracking-tight">ระบบสแกน</h1>
                </div>
                
                <!-- User Badge -->
                <div class="glass-ultra pl-3 pr-1.5 py-1.5 rounded-full flex items-center gap-3 border border-white">
                    <div class="flex flex-col items-end">
                        <span class="text-[9px] text-slate-500 font-bold uppercase tracking-wider">Staff</span>
                        <span id="display-staff-name" class="text-sm font-bold text-blue-700 leading-none">Name</span>
                    </div>
                    <button onclick="logout()" class="w-8 h-8 bg-white hover:bg-slate-100 rounded-full flex items-center justify-center text-slate-400 hover:text-rose-500 shadow-sm transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4"><path fill-rule="evenodd" d="M3 4.25A2.25 2.25 0 015.25 2h5.5A2.25 2.25 0 0113 4.25v2a.75.75 0 01-1.5 0v-2a.75.75 0 00-.75-.75h-5.5a.75.75 0 00-.75.75v11.5c0 .414.336.75.75.75h5.5a.75.75 0 00.75-.75v-2a.75.75 0 011.5 0v2A2.25 2.25 0 0110.75 18h-5.5A2.25 2.25 0 013 15.75V4.25z" clip-rule="evenodd" /><path fill-rule="evenodd" d="M19 10a.75.75 0 00-.75-.75H8.704l1.048-.943a.75.75 0 10-1.004-1.114l-2.5 2.25a.75.75 0 000 1.114l2.5 2.25a.75.75 0 101.004-1.114l-1.048-.943h9.546A.75.75 0 0019 10z" clip-rule="evenodd" /></svg>
                    </button>
                </div>
            </div>

            <!-- Project Title Card -->
            <div class="dark-glass-ultra rounded-[2rem] p-6 relative overflow-hidden mb-5">
                <div class="absolute top-[-50%] right-[-20%] w-48 h-48 bg-gradient-to-b from-emerald-400/30 to-blue-500/10 rounded-full blur-3xl"></div>
                <h2 class="text-xs text-emerald-300 font-semibold tracking-widest uppercase mb-1 drop-shadow-sm">โครงการปฐมนิเทศ 2569</h2>
                <h3 class="text-2xl font-extrabold text-white mb-3 leading-tight tracking-tight drop-shadow-md">
                    เกษตรและสิ่งแวดล้อมศึกษา
                </h3>
                <div class="inline-flex items-center gap-2 bg-white/10 backdrop-blur-sm px-3 py-1.5 rounded-full border border-white/10">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5 text-blue-300"><path fill-rule="evenodd" d="M6.75 2.25A.75.75 0 017.5 3v1.5h9V3A.75.75 0 0117.25 3v1.5h1.375c.76 0 1.46.172 2.092.483l-.254-.096c-1.28-.487-2.71-.735-4.163-.735h-4.6c-1.453 0-2.883.248-4.163.735l-.254.096c.632-.311 1.333-.483 2.092-.483H6.75V3a.75.75 0 01.75-.75zM2.25 9.75v9a3 3 0 003 3h13.5a3 3 0 003-3v-9a3 3 0 00-3-3H5.25a3 3 0 00-3 3zm4.5-1.5a.75.75 0 00-.75.75v.75a.75.75 0 00.75.75h.75a.75.75 0 00.75-.75v-.75a.75.75 0 00-.75-.75h-.75z" clip-rule="evenodd" /></svg>
                    <span class="text-xs font-medium text-slate-200">14 มิถุนายน 2569</span>
                </div>
            </div>
        </header>

        <!-- Stats & History Pill -->
        <div class="mx-6 mb-5 px-5 py-3 glass-ultra rounded-full flex justify-between items-center z-10 animate-slide-down" style="animation-delay: 0.1s;">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm shadow-inner" id="scan-count">0</div>
                <span class="text-sm font-semibold text-slate-600 tracking-tight">สแกนสำเร็จวันนี้</span>
            </div>
            <button onclick="openHistory()" class="flex items-center gap-1.5 text-blue-600 hover:text-blue-700 font-bold text-sm transition-colors py-1 px-2">
                ดูประวัติ
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" /></svg>
            </button>
        </div>

        <!-- Notification Toast (Top - Dynamic Island style) -->
        <div id="toast-wrapper" class="absolute top-6 inset-x-0 z-50 flex justify-center transition-all duration-500 transform -translate-y-[150%] opacity-0 pointer-events-none">
            <div id="toast-box" class="glass-ultra pl-2 pr-4 py-2 rounded-full shadow-xl flex items-center gap-3 border border-white max-w-[90%]">
                <div id="toast-icon" class="w-8 h-8 rounded-full flex items-center justify-center shrink-0"></div>
                <div class="flex-grow pr-2">
                    <h4 id="toast-title" class="text-sm font-bold text-slate-800 leading-tight"></h4>
                    <p id="toast-msg" class="text-xs text-slate-500 font-medium leading-tight mt-0.5 truncate max-w-[200px]"></p>
                </div>
            </div>
        </div>

        <!-- Camera Section -->
        <section id="camera-section" class="flex-grow flex flex-col justify-center items-center px-6 relative z-0 animate-slide-up" style="animation-delay: 0.2s;">
            <div class="relative w-full aspect-[3/4] max-h-[55vh] rounded-[3rem] overflow-hidden shadow-[0_20px_50px_-12px_rgba(0,0,0,0.25)] bg-slate-900 ring-[6px] ring-white/80">
                <video id="video" playsinline autoplay muted class="w-full h-full object-cover"></video>
                <div id="scan-line" class="scan-laser hidden"></div>
                <canvas id="canvas" hidden></canvas>
                
                <!-- HUD Viewfinder -->
                <div id="viewfinder" class="absolute inset-0 pointer-events-none hidden flex items-center justify-center">
                    <!-- Outer Overlay -->
                    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[2px]" style="clip-path: polygon(0% 0%, 0% 100%, 100% 100%, 100% 0%, 0% 0%, calc(50% - 110px) calc(50% - 110px), calc(50% + 110px) calc(50% - 110px), calc(50% + 110px) calc(50% + 110px), calc(50% - 110px) calc(50% + 110px), calc(50% - 110px) calc(50% - 110px));"></div>
                    
                    <!-- Center Box -->
                    <div class="w-[220px] h-[220px] relative">
                        <div class="absolute -top-1 -left-1 w-10 h-10 border-t-4 border-l-4 border-white/90 rounded-tl-3xl drop-shadow-md"></div>
                        <div class="absolute -top-1 -right-1 w-10 h-10 border-t-4 border-r-4 border-white/90 rounded-tr-3xl drop-shadow-md"></div>
                        <div class="absolute -bottom-1 -left-1 w-10 h-10 border-b-4 border-l-4 border-white/90 rounded-bl-3xl drop-shadow-md"></div>
                        <div class="absolute -bottom-1 -right-1 w-10 h-10 border-b-4 border-r-4 border-white/90 rounded-br-3xl drop-shadow-md"></div>
                        <!-- Center dot for focus point -->
                        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-1.5 h-1.5 bg-white/50 rounded-full"></div>
                    </div>
                </div>
                
                <!-- Placeholder (Camera Off) -->
                <div id="camera-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/80 backdrop-blur-md z-10">
                    <div class="w-20 h-20 bg-white/10 rounded-full flex items-center justify-center mb-5 border border-white/20 animate-pulse-slow">
                        <svg class="h-10 w-10 text-white/70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                    </div>
                    <p class="font-medium text-white/80 tracking-wide text-lg">ระบบกล้องปิดอยู่</p>
                </div>
            </div>
        </section>

        <!-- Controls Section -->
        <footer class="mt-auto px-6 pb-8 pt-6 z-20 animate-slide-up" style="animation-delay: 0.3s;">
            <button id="btn-start" onclick="startCamera()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white py-4.5 px-6 rounded-[2rem] font-bold text-lg shadow-[0_10px_30px_rgba(59,130,246,0.4)] transition-all duration-300 active:scale-95 flex justify-center items-center gap-3">
                <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" /><path fill-rule="evenodd" d="M1.323 11.447C2.811 6.976 7.028 3.75 12.001 3.75c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113-1.487 4.471-5.705 7.697-10.677 7.697-4.97 0-9.186-3.223-10.675-7.69a1.762 1.762 0 010-1.113zM17.25 12a5.25 5.25 0 11-10.5 0 5.25 5.25 0 0110.5 0z" clip-rule="evenodd" /></svg>
                แตะเพื่อเปิดกล้อง
            </button>
            <button id="btn-stop" onclick="stopCamera()" class="hidden w-full glass-ultra text-slate-700 py-4.5 px-6 rounded-[2rem] font-bold text-lg shadow-sm hover:bg-white/60 transition-all duration-300 active:scale-95 flex justify-center items-center gap-3 border border-white">
                <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 text-slate-400"><path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm13.36-1.814a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd" /></svg>
                พักหน้าจอ
            </button>
            <div class="mt-5 text-center">
                <span class="text-[11px] text-slate-400 font-medium">พบปัญหาการใช้งาน ติดต่อ <span class="font-bold text-blue-500">เมธี</span></span>
            </div>
        </footer>

        <!-- ========================================== -->
        <!-- MODALS (Bottom Sheet Style) -->
        <!-- ========================================== -->
        
        <!-- Modal: History -->
        <div id="history-modal" class="fixed inset-0 z-[200] hidden flex-col justify-end bg-slate-900/30 backdrop-blur-sm transition-opacity opacity-0">
            <div id="history-box" class="bg-white/90 backdrop-blur-xl rounded-t-[2.5rem] p-7 w-full max-w-md mx-auto h-[75vh] flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.1)] transform translate-y-full transition-transform duration-400 ease-out border-t border-white">
                <!-- Pull indicator -->
                <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto mb-6"></div>
                
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-extrabold text-slate-800 tracking-tight">ประวัติการสแกน</h3>
                    <button onclick="closeHistory()" class="w-9 h-9 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center hover:bg-slate-200 transition-colors">
                        <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z" clip-rule="evenodd" /></svg>
                    </button>
                </div>
                <div class="flex-grow overflow-y-auto pr-2 pb-4 space-y-3" id="history-list">
                    <!-- Content injected via JS -->
                </div>
            </div>
        </div>

        <!-- Modal: Scan Result -->
        <div id="result-modal" class="fixed inset-0 z-[150] hidden flex-col justify-end bg-slate-900/40 backdrop-blur-md transition-opacity opacity-0">
            <div id="result-box" class="bg-white/95 backdrop-blur-xl rounded-t-[2.5rem] p-8 w-full max-w-md mx-auto shadow-[0_-20px_50px_rgba(0,0,0,0.2)] transform translate-y-full transition-transform duration-400 ease-out flex flex-col items-center text-center">
                
                <div id="rm-icon-bg" class="w-20 h-20 rounded-full flex items-center justify-center shadow-lg -mt-16 mb-4 border-4 border-white relative">
                    <div id="rm-icon"></div>
                </div>
                
                <h3 id="rm-title" class="text-2xl font-extrabold text-slate-800 tracking-tight mb-2"></h3>
                
                <div class="bg-slate-50/50 w-full py-5 px-4 rounded-2xl border border-slate-100 mb-6">
                    <p id="rm-name" class="text-xl font-bold text-blue-600 leading-tight"></p>
                    <p id="rm-desc" class="text-sm font-medium text-slate-500 mt-1.5 break-all"></p>
                </div>
                
                <p class="text-[11px] text-slate-400 mb-6 font-medium flex items-center gap-1">
                    <svg class="w-3 h-3 text-emerald-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                    ข้อมูลอัปเดตขึ้นแดชบอร์ดเรียลไทม์แล้ว
                </p>
                
                <button onclick="resumeScan()" id="btn-resume-scan" class="w-full text-white font-bold py-4.5 rounded-[2rem] shadow-lg active:scale-95 transition-all text-lg tracking-wide mb-2">
                    สแกนคิวต่อไป
                </button>
            </div>
        </div>

    </main>

    <script>
        // =======================================================
        // ⚠️ เปลี่ยนเป็น URL ของ Google Apps Script ของคุณ
        // =======================================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8eTkS7dM96oQ-yqKKk1zRCDioQkw5w8N7UpoCBZ8AI0QVecuMItd3AaCIBX-lPwyX/exec"; 

        // State Variables
        let scanning = false;
        let stream = null;
        let scanHistory = []; 

        const video = document.getElementById("video");
        const canvasElement = document.getElementById("canvas");
        const canvas = canvasElement.getContext("2d", { willReadFrequently: true });
        
        // Premium Icons
        const icons = {
            success: `<svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>`,
            duplicate: `<svg class="w-10 h-10 text-white" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm-1.72 6.97a.75.75 0 10-1.06 1.06L10.94 12l-1.72 1.72a.75.75 0 101.06 1.06L12 13.06l1.72 1.72a.75.75 0 101.06-1.06L13.06 12l1.72-1.72a.75.75 0 10-1.06-1.06L12 10.94l-1.72-1.72z" clip-rule="evenodd" /></svg>`,
            error: `<svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" /></svg>`,
            loading: `<svg class="animate-spin w-6 h-6 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`
        };

        // --- 1. ระบบ Login & Session ---
        document.addEventListener('DOMContentLoaded', () => {
            const savedStaff = sessionStorage.getItem('staff_logged_in');
            const savedName = sessionStorage.getItem('staff_name');
            if (savedStaff === 'true' && savedName) {
                document.getElementById('display-staff-name').innerText = savedName;
                showApp();
            }
        });

        async function checkLogin() {
            const pinInput = document.getElementById('pin-input');
            const pin = pinInput.value;
            const errorText = document.getElementById('login-error');
            const btnText = document.getElementById('btn-login-text');
            const container = document.getElementById('pin-container');

            if (pin.length < 4) {
                showLoginError("กรุณากรอกรหัสอย่างน้อย 4 หลัก");
                return;
            }

            // 🌟 เพิ่มระบบดักจับ: เช็คว่าลืมเปลี่ยน URL เป็นของตัวเองหรือไม่
            if (GOOGLE_SCRIPT_URL.includes("AKfycby5t9-U10-PZ5L_mXk3a9w1sN3G2L_")) {
                showLoginError("⚠️ คุณยังไม่ได้เอา URL ของตัวเองมาใส่ในโค้ด (บรรทัดที่ ~296)");
                return;
            }

            btnText.innerHTML = icons.loading + ' <span class="text-blue-600 font-bold ml-1">กำลังตรวจสอบ...</span>';
            errorText.classList.remove('opacity-100');
            
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    redirect: 'follow', // ป้องกันปัญหา CORS
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // ต้องเป็น text/plain
                    body: JSON.stringify({ action: "login", pin: pin })
                });

                if (!response.ok) throw new Error("PERMISSION_ERROR");
                const res = await response.json();

                if (res.status === "success") {
                    sessionStorage.setItem('staff_logged_in', 'true');
                    sessionStorage.setItem('staff_name', res.staffName);
                    document.getElementById('display-staff-name').innerText = res.staffName;
                    
                    btnText.innerHTML = '<span class="text-blue-600 font-bold">✅ เข้าสู่ระบบสำเร็จ</span>';
                    setTimeout(() => showApp(), 600);
                } else {
                    showLoginError(res.message);
                    btnText.innerHTML = 'เข้าสู่ระบบ';
                }
            } catch (error) {
                console.error("Login Error:", error);
                // 🌟 เพิ่มระบบดักจับ: เช็คว่าลืมตั้งค่าสิทธิ์ Anyone หรือไม่
                if (error.message.includes("Failed to fetch") || error.message.includes("PERMISSION_ERROR")) {
                    showLoginError("⚠️ เข้าถึง Sheet ไม่ได้! ต้องเลือกสิทธิ์ 'ทุกคน (Anyone)' ตอน Deploy");
                } else {
                    showLoginError("เครือข่ายขัดข้อง: " + error.message);
                }
                btnText.innerHTML = 'เข้าสู่ระบบ';
            }
        }

        function showLoginError(msg) {
            const errorText = document.getElementById('login-error');
            const container = document.getElementById('pin-container');
            errorText.innerText = msg;
            errorText.classList.add('opacity-100');
            document.getElementById('pin-input').value = '';
            
            container.classList.remove('animate-shake');
            void container.offsetWidth; 
            container.classList.add('animate-shake');
        }

        function showApp() {
            document.getElementById('login-screen').classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('main-app').classList.add('animate-fadeIn');
                
                // โหลดประวัติ
                scanHistory = JSON.parse(sessionStorage.getItem('scan_history') || '[]');
                updateStatsUI();
            }, 500);
        }

        function logout() {
            stopCamera();
            sessionStorage.removeItem('staff_logged_in');
            sessionStorage.removeItem('staff_name');
            sessionStorage.removeItem('scan_history');
            scanHistory = [];
            document.getElementById('pin-input').value = '';
            
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            document.getElementById('login-screen').classList.add('animate-fadeIn');
        }

        // --- 2. ระบบ UI (History & Toast & Result Modal) ---
        function updateStatsUI() {
            document.getElementById('scan-count').innerText = scanHistory.length;
            const listDiv = document.getElementById('history-list');
            
            if (scanHistory.length === 0) {
                listDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center py-10 opacity-60">
                    <svg class="w-12 h-12 text-slate-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                    <div class="text-center text-slate-500 font-medium">ยังไม่มีข้อมูลในรอบนี้</div>
                </div>`;
                return;
            }

            let html = '';
            scanHistory.forEach((item, index) => {
                html += `
                <div class="flex items-center justify-between bg-white border border-slate-100 p-4 rounded-2xl shadow-sm hover:shadow-md transition-shadow">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center font-bold text-sm">${scanHistory.length - index}</div>
                        <div class="flex flex-col">
                            <span class="font-bold text-slate-700 text-sm tracking-tight">${item.name}</span>
                            <span class="text-[11px] text-slate-400 font-medium flex items-center gap-1 mt-0.5"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> ${item.time}</span>
                        </div>
                    </div>
                </div>`;
            });
            listDiv.innerHTML = html;
        }

        function openHistory() {
            const modal = document.getElementById('history-modal');
            const box = document.getElementById('history-box');
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('translate-y-full');
            }, 10);
        }

        function closeHistory() {
            const modal = document.getElementById('history-modal');
            const box = document.getElementById('history-box');
            box.classList.add('translate-y-full');
            modal.classList.add('opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); modal.style.display = 'none'; }, 400);
        }

        function showToast(status, title, msg) {
            const wrapper = document.getElementById('toast-wrapper');
            const box = document.getElementById('toast-box');
            const icon = document.getElementById('toast-icon');
            
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-msg').innerText = msg;

            // Reset classes
            box.className = "glass-ultra pl-2 pr-4 py-2 rounded-full shadow-lg flex items-center gap-3 border max-w-[90%]";
            icon.className = "w-8 h-8 rounded-full flex items-center justify-center shrink-0 shadow-sm";

            if(status === 'loading') {
                box.classList.add('border-blue-200'); 
                icon.classList.add('bg-blue-50');
                icon.innerHTML = icons.loading;
            } else if(status === 'error') {
                box.classList.add('border-rose-200'); 
                icon.classList.add('bg-rose-50');
                icon.innerHTML = `<svg class="w-5 h-5 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
            }
            
            wrapper.classList.remove('-translate-y-[150%]', 'opacity-0', 'pointer-events-none');
            wrapper.classList.add('translate-y-0', 'opacity-100');
        }

        function hideToast() {
            const wrapper = document.getElementById('toast-wrapper');
            wrapper.classList.add('-translate-y-[150%]', 'opacity-0', 'pointer-events-none');
            wrapper.classList.remove('translate-y-0', 'opacity-100');
        }

        function showResultModal(status, title, name, desc) {
            const modal = document.getElementById('result-modal');
            const box = document.getElementById('result-box');
            const iconBg = document.getElementById('rm-icon-bg');
            const icon = document.getElementById('rm-icon');
            const btn = document.getElementById('btn-resume-scan');
            
            document.getElementById('rm-title').innerText = title;
            document.getElementById('rm-name').innerText = name;
            document.getElementById('rm-desc').innerText = desc;

            // Reset button classes
            btn.className = "w-full text-white font-bold py-4.5 rounded-[2rem] shadow-lg active:scale-95 transition-all text-lg tracking-wide mb-2";

            if (status === "success") {
                iconBg.className = "w-20 h-20 rounded-full flex items-center justify-center shadow-lg -mt-16 mb-4 border-4 border-white relative bg-gradient-to-br from-emerald-400 to-emerald-600";
                icon.innerHTML = icons.success;
                btn.classList.add('bg-emerald-600', 'hover:bg-emerald-500', 'shadow-emerald-500/40');
                btn.innerText = "ตกลง (สแกนคิวต่อไป)";
            } else if (status === "duplicate") {
                iconBg.className = "w-20 h-20 rounded-full flex items-center justify-center shadow-lg -mt-16 mb-4 border-4 border-white relative bg-gradient-to-br from-amber-400 to-orange-500";
                icon.innerHTML = icons.duplicate;
                btn.classList.add('bg-amber-500', 'hover:bg-amber-400', 'shadow-amber-500/40');
                btn.innerText = "รับทราบ (สแกนคิวต่อไป)";
            } else {
                iconBg.className = "w-20 h-20 rounded-full flex items-center justify-center shadow-lg -mt-16 mb-4 border-4 border-white relative bg-gradient-to-br from-rose-400 to-rose-600";
                icon.innerHTML = icons.error;
                btn.classList.add('bg-rose-600', 'hover:bg-rose-500', 'shadow-rose-500/40');
                btn.innerText = "ลองใหม่อีกครั้ง";
            }

            modal.classList.remove('hidden');
            modal.style.display = 'flex';
            // Slight delay for display flex to apply before animating
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0'); 
                box.classList.remove('translate-y-full');
            });
        }

        function resumeScan() {
            const modal = document.getElementById('result-modal');
            const box = document.getElementById('result-box');
            box.classList.add('translate-y-full');
            modal.classList.add('opacity-0');
            
            setTimeout(() => { 
                modal.classList.add('hidden'); 
                modal.style.display = 'none'; 
                
                if (stream && stream.active) {
                    document.getElementById("scan-line").style.display = "block";
                    scanning = true;
                    requestAnimationFrame(tick);
                }
            }, 400);
        }

        // --- 3. ระบบกล้องและการประมวลผล ---
        async function startCamera() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (ua.indexOf("Line") > -1 || ua.indexOf("FBAN") > -1 || ua.indexOf("FBAV") > -1) {
                alert("กรุณากดเมนูมุมขวาบน เลือก 'เปิดในเบราว์เซอร์' (Open in Browser)"); return;
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("เบราว์เซอร์ไม่รองรับ กรุณาใช้ Chrome/Safari"); return;
            }

            try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }); } 
            catch (err) {
                try { stream = await navigator.mediaDevices.getUserMedia({ video: true }); } 
                catch (e) { alert("เปิดกล้องไม่ได้: " + e.message); return; }
            }
            
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            
            video.onloadedmetadata = () => {
                video.play().then(() => {
                    document.getElementById("camera-placeholder").style.display = "none";
                    document.getElementById("scan-line").style.display = "block";
                    document.getElementById("viewfinder").classList.remove("hidden");
                    document.getElementById("btn-start").classList.add("hidden");
                    document.getElementById("btn-stop").classList.remove("hidden");
                    scanning = true;
                    requestAnimationFrame(tick);
                });
            };
        }

        function stopCamera() {
            scanning = false;
            if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
            video.srcObject = null;
            document.getElementById("scan-line").style.display = "none";
            document.getElementById("viewfinder").classList.add("hidden");
            document.getElementById("camera-placeholder").style.display = "flex";
            document.getElementById("btn-start").classList.remove("hidden");
            document.getElementById("btn-stop").classList.add("hidden");
        }

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && scanning) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                var imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                var code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

                if (code) { processQRCode(code.data); } 
                else { requestAnimationFrame(tick); }
            } else if (scanning) {
                requestAnimationFrame(tick);
            }
        }

        function processQRCode(qrData) {
            scanning = false; // หยุดสแกนชั่วคราว
            document.getElementById("scan-line").style.display = "none";
            
            showToast("loading", "กำลังประมวลผล...", "กรุณารอสักครู่");
            
            const staffName = sessionStorage.getItem('staff_name') || 'Unknown';

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                redirect: 'follow',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ qrData: qrData, scannedBy: staffName })
            })
            .then(response => response.json())
            .then(res => {
                hideToast();
                
                if (res.status === "success") {
                    const timeNow = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
                    scanHistory.unshift({ name: res.name || qrData, time: timeNow });
                    sessionStorage.setItem('scan_history', JSON.stringify(scanHistory));
                    updateStatsUI();
                    
                    showResultModal("success", "เช็คอินสำเร็จ!", res.name, `รหัสอ้างอิง: ${qrData}`);
                } 
                else if (res.status === "duplicate") {
                    showResultModal("duplicate", "เช็คอินซ้ำ", res.name, res.message);
                }
                else {
                    showResultModal("error", "เกิดข้อผิดพลาด", qrData, res.message);
                }
            })
            .catch(error => {
                hideToast();
                showResultModal("error", "เครือข่ายขัดข้อง", "ไม่สามารถติดต่อฐานข้อมูลได้", error.message);
            });
        }
    </script>
</body>
