<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KU86 | นิสิตใหม่</title>

<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@200;300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

:root{
  --ku-green:#006633;
  --primary:#00ff88;
  --dark:#0f172a;
  --gray:#64748b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Mitr',sans-serif;
  border-radius:0 !important;
}

body{
  /* ตั้งค่าภาพพื้นหลัง และดรอปสีให้จางลง (Fade) ด้วย linear-gradient */
  background-image: 
    linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), 
    url('image_5.png'); /* เปลี่ยนเป็นชื่อไฟล์ภาพพื้นหลังจางที่คุณต้องการที่นี่ */
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  color: var(--dark);
  overflow-x: hidden;
}

/* ===== Background Glow (ปรับให้เข้ากับพื้นหลังใหม่) ===== */

.bg-blob{
  position:fixed;
  width:650px;
  height:650px;
  background:
    radial-gradient(
      circle,
      rgba(0,255,136,.15) 0%,
      transparent 70%
    );
  filter:blur(100px);
  z-index:-1;
  top:-150px;
  right:-120px;
  animation:blobMove 14s ease-in-out infinite alternate;
}

@keyframes blobMove{
  from{ transform:translateY(0) scale(1); }
  to{ transform:translateY(140px) scale(1.2); }
}

/* ===== HERO ===== */

.hero{
  min-height:60vh;
  padding:120px 20px 40px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero-content{
  max-width:1100px;
  position: relative; /* จำเป็นสำหรับการจัดตำแหน่ง absolute ด้านใน */
}

.tag{
  display:inline-block;
  padding:12px 30px;
  background:rgba(255,255,255,.7);
  border:1px solid #e2e8f0;
  backdrop-filter:blur(10px);
  color:var(--ku-green);
  letter-spacing:2px;
  font-size:.9rem;
  margin-bottom:25px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}

/* --- สไตล์สำหรับคำต้อนรับ (แทรกระหว่าง Tag และ Title) --- */
.hero-welcome {
  color: var(--ku-green);
  font-size: clamp(1.8rem, 5vw, 3rem); /* ปรับขนาดตามหน้าจอ */
  font-weight: 500;
  letter-spacing: 5px; /* เพิ่มช่องว่างระหว่างตัวอักษร */
  margin-bottom: 10px; /* ระยะห่างเล็กน้อยจากหัวข้อหลัก h1 */
  opacity: 0.9;
}

.hero h1{
  font-size:clamp(4rem,11vw,8rem);
  line-height:.9;
  background:
    linear-gradient(
      90deg,
      #0f172a,
      #006633,
      #00ff88,
      #0f172a
    );
  background-size:300%;
  -webkit-background-clip:text;
  color:transparent;
  animation:textFlow 10s linear infinite;
  /* เราไม่ได้กำหนด Margin เพิ่มเติมเพื่อคงตำแหน่งเดิม */
}

@keyframes textFlow{
  to{ background-position:300%; }
}

.hero-subtitle{
  margin-top:25px;
  color:var(--ku-green);
  font-size:1.05rem;
  letter-spacing:4px;
  font-weight:700;
  opacity:.9;
  text-shadow: 0 2px 4px rgba(255,255,255,0.8);
}

/* ===== QUICK MENU ===== */

.quick-menu{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:0 20px 70px;
  flex-wrap:wrap;
}

.menu-btn{
  border:none;
  background:linear-gradient(135deg,#006633,#00ff88);
  color:white;
  padding:18px 38px;
  font-size:1rem;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:12px;
  transition:.4s ease;
  box-shadow:0 20px 40px rgba(0,102,51,.18);
}

.menu-btn:hover{
  transform:translateY(-6px) scale(1.03);
  box-shadow:0 30px 60px rgba(0,102,51,.25);
}

/* ===== NEW MODERN POPUP ===== */

.info-popup{
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.78);
  backdrop-filter:blur(12px);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:10000;
  padding:25px;
}

.info-popup.active{
  display:flex;
}

.info-box{
  position:relative;
  width:min(95%,700px);
  overflow:hidden;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.98),
      rgba(248,250,252,.96)
    );
  border:1px solid rgba(255,255,255,.45);
  box-shadow:
    0 40px 120px rgba(0,0,0,.28);
  animation:popupShow .45s cubic-bezier(.2,1,.2,1);
}

.info-box::before{
  content:"";
  position:absolute;
  top:-180px;
  right:-120px;
  width:420px;
  height:420px;
  background:
    radial-gradient(
      circle,
      rgba(0,255,136,.22),
      transparent 70%
    );
  filter:blur(70px);
}

.popup-inner{
  position:relative;
  z-index:2;
  padding:55px;
}

.popup-badge{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 18px;
  background:rgba(0,102,51,.08);
  color:#006633;
  font-size:.9rem;
  margin-bottom:22px;
}

.popup-title{
  font-size:clamp(2rem,4vw,3rem);
  line-height:1;
  color:#0f172a;
  margin-bottom:18px;
}

.popup-desc{
  color:#475569;
  line-height:1.9;
  margin-bottom:35px;
}

.popup-date-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  margin-bottom:35px;
}

.popup-date-card{
  padding:22px;
  background:white;
  border:1px solid rgba(15,23,42,.08);
  box-shadow:0 10px 30px rgba(15,23,42,.06);
}

.popup-date-card h4{
  color:#006633;
  margin-bottom:12px;
}

.popup-date-card p{
  line-height:1.7;
}

.popup-actions{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
}

.popup-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:15px 26px;
  text-decoration:none;
  color:white;
  background:
    linear-gradient(
      135deg,
      #006633,
      #00cc77
    );
  transition:.35s ease;
}

.popup-btn:hover{
  transform:translateY(-4px);
}

.close-info{
  position:absolute;
  top:22px;
  right:24px;
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(15,23,42,.06);
  color:#0f172a;
  font-size:1.2rem;
  cursor:pointer;
  z-index:5;
}

@keyframes popupShow{
  from{
    opacity:0;
    transform:translateY(40px) scale(.92);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* ===== MOBILE ===== */

@media(max-width:768px){

  .hero{
    padding:80px 20px 20px;
  }

  .menu-btn{
    width:100%;
    justify-content:center;
  }

  .popup-inner{
    padding:38px 26px;
  }

  .popup-actions{
    flex-direction:column;
  }

  .popup-btn{
    width:100%;
  }

}

</style>
</head>

<body>

<div class="bg-blob"></div>

<section class="hero">
  <div class="hero-content">

    <div class="tag">
      KASETSART UNIVERSITY KAMPHAENG SAEN
    </div>

    <div class="hero-welcome">ยินดีต้อนรับ</div>

    <h1>นิสิตใหม่ KU86</h1>

    <div class="hero-subtitle">
      KU86 • EDS26 • AG-ED57
    </div>

  </div>
</section>
