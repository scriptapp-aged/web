<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KU86 | นิสิตใหม่</title>

<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@200;300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

:root{
  --ku-green:#006633;
  --primary:#00ff88;
  --dark:#0f172a;
  --gray:#64748b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Mitr',sans-serif;
  border-radius:0 !important;
}

body{
  /* ตั้งค่าภาพพื้นหลัง และดรอปสีให้จางลงด้วย linear-gradient (สีขาวโปร่งแสง 80%) */
  background-image: 
    linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), 
    url('สำเนาของ_วิพากษ์หลักสูตร.jpg'); /* <--- เปลี่ยนชื่อไฟล์รูปภาพของคุณที่นี่ */
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  color: var(--dark);
  overflow-x: hidden;
}

/* ===== Background Glow (ปรับให้เข้ากับพื้นหลังใหม่) ===== */

.bg-blob{
  position:fixed;
  width:650px;
  height:650px;
  background:
    radial-gradient(
      circle,
      rgba(0,255,136,.15) 0%,
      transparent 70%
    );
  filter:blur(100px);
  z-index:-1;
  top:-150px;
  right:-120px;
  animation:blobMove 14s ease-in-out infinite alternate;
}

@keyframes blobMove{
  from{ transform:translateY(0) scale(1); }
  to{ transform:translateY(140px) scale(1.2); }
}

/* ===== HERO ===== */

.hero{
  min-height:100vh; /* ปรับเป็น 100vh เพื่อให้อยู่กึ่งกลางหน้าจอพอดี */
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero-content{
  max-width:1100px;
}

.tag{
  display:inline-block;
  padding:12px 30px;
  background:rgba(255,255,255,.7);
  border:1px solid #e2e8f0;
  backdrop-filter:blur(10px);
  color:var(--ku-green);
  letter-spacing:2px;
  font-size:.9rem;
  margin-bottom:25px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}

.hero h1{
  font-size:clamp(4rem,11vw,8rem);
  line-height:.9;
  background:
    linear-gradient(
      90deg,
      #0f172a,
      #006633,
      #00ff88,
      #0f172a
    );
  background-size:300%;
  -webkit-background-clip:text;
  color:transparent;
  animation:textFlow 10s linear infinite;
}

@keyframes textFlow{
  to{ background-position:300%; }
}

.hero-subtitle{
  margin-top:25px;
  color:var(--ku-green);
  font-size:1.05rem;
  letter-spacing:4px;
  font-weight:700;
  opacity:.9;
  text-shadow: 0 2px 4px rgba(255,255,255,0.8);
}

/* ===== MOBILE ===== */

@media(max-width:768px){
  .hero{
    padding:80px 20px 20px;
  }
}

</style>
</head>

<body>

<div class="bg-blob"></div>

<section class="hero">
  <div class="hero-content">

    <div class="tag">
      KASETSART UNIVERSITY KAMPHAENG SAEN
    </div>

    <h1>นิสิตใหม่ KU86</h1>

    <div class="hero-subtitle">
      KU86 • EDS26 • AG-ED57
    </div>

  </div>
</section>

</body>
</html>
