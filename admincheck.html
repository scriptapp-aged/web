<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Dashboard - ระบบเช็คอิน</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: { black: '#111111' },
                    animation: { 
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'shake': 'shake 0.4s ease-in-out both'
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        shake: { '0%, 100%': { transform: 'translateX(0)' }, '25%': { transform: 'translateX(-5px)' }, '75%': { transform: 'translateX(5px)' } }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #ffffff;
            color: #111111;
            margin: 0; overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }

        .highlight-row { animation: highlightFade 3s ease-out forwards; }
        @keyframes highlightFade {
            0% { background-color: #f9fafb; }
            100% { background-color: transparent; }
        }
        .pin-input { letter-spacing: 0.7em; text-security: disc; -webkit-text-security: disc; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans relative selection:bg-gray-200">

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center p-6 bg-white transition-opacity duration-300">
        <div class="w-full max-w-sm flex flex-col items-center bg-white p-8 animate-fade-in">
            <div class="mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-10 h-10 text-black mx-auto">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
            </div>
            
            <div class="text-center mb-8">
                <h1 class="text-lg font-semibold tracking-widest text-black mb-2">DASHBOARD ACCESS</h1>
                <p class="text-gray-400 text-xs font-light mb-5">เฉพาะผู้ดูแลระบบ (Admin) เท่านั้น</p>
            </div>

            <div class="w-full relative mb-8" id="pin-container">
                <input type="password" id="pin-input" inputmode="numeric" pattern="[0-9]*" placeholder="ADMIN PIN" maxlength="6" 
                    class="pin-input w-full bg-transparent border-b border-gray-300 text-black text-center text-3xl font-light py-4 focus:outline-none focus:border-black transition-colors placeholder:text-gray-200 placeholder:tracking-widest">
                
                <p id="login-error" class="absolute -bottom-6 left-0 w-full text-center text-black text-xs opacity-0 transition-opacity font-medium"></p>
            </div>

            <button id="btn-login" onclick="checkAdminLogin()" class="w-full bg-black hover:bg-gray-800 text-white font-medium tracking-wide py-4 transition-colors active:scale-95 flex items-center justify-center gap-2">
                <span id="btn-login-text">LOGIN</span>
            </button>
        </div>
    </div>

    <!-- 2. MAIN DASHBOARD -->
    <div id="dashboard-app" class="hidden flex-col min-h-screen">
        <!-- Header -->
        <header class="pt-8 px-6 md:px-12 xl:px-24 z-10 animate-fade-in border-b border-gray-100 pb-6 bg-white sticky top-0">
            <div class="max-w-7xl mx-auto w-full">
                <div class="flex justify-between items-start md:items-end mb-6">
                    <div>
                        <h1 class="text-sm font-semibold tracking-widest text-black uppercase mb-1">Live Dashboard</h1>
                        <div class="flex items-center gap-2">
                            <div id="status-indicator" class="w-2 h-2 rounded-full bg-black animate-pulse"></div>
                            <span id="update-status" class="text-[10px] text-gray-400 font-medium tracking-widest uppercase">REAL-TIME SYNC</span>
                        </div>
                    </div>
                    
                    <!-- Logout & Admin Info -->
                    <div class="flex flex-col items-end gap-2 md:flex-row md:items-center md:gap-4">
                        <span id="admin-name-display" class="text-[10px] text-gray-500 tracking-widest uppercase font-medium"></span>
                        <button onclick="logout()" class="text-[10px] text-black font-semibold tracking-widest uppercase hover:bg-gray-100 border border-gray-200 px-4 py-1.5 rounded-full transition-colors">
                            LOGOUT
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <p class="text-[10px] text-gray-400 font-medium tracking-widest uppercase mb-1">โครงการปฐมนิเทศ 2569</p>
                    <h2 class="text-2xl md:text-3xl font-semibold text-black leading-tight mb-2">เกษตรและสิ่งแวดล้อมศึกษา</h2>
                    <p class="text-xs text-gray-400 font-light tracking-wide">14 มิถุนายน 2569</p>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow px-6 md:px-12 xl:px-24 py-8 max-w-7xl mx-auto w-full flex flex-col gap-8 z-10">
            
            <!-- Stats Overview -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 animate-fade-in" style="animation-delay: 0.1s;">
                <!-- Box 1: Total Registered -->
                <div class="border border-gray-200 p-6 flex flex-col justify-between min-h-[140px]">
                    <span class="text-[10px] text-gray-400 font-medium tracking-widest uppercase mb-4">Total Registered</span>
                    <div class="flex items-baseline gap-2">
                        <span id="total-count" class="text-5xl font-light tabular-nums text-black tracking-tight">0</span>
                        <span class="text-sm text-gray-400 font-light">คน</span>
                    </div>
                </div>

                <!-- Box 2: Checked In -->
                <div class="border border-black bg-black p-6 flex flex-col justify-between min-h-[140px] shadow-lg">
                    <span class="text-[10px] text-gray-300 font-medium tracking-widest uppercase mb-4">Checked In</span>
                    <div class="flex items-baseline gap-2">
                        <span id="checked-in-count" class="text-5xl font-semibold tabular-nums text-white tracking-tight">0</span>
                        <span class="text-sm text-gray-400 font-light">คน</span>
                    </div>
                </div>

                <!-- Box 3: Pending -->
                <div class="border border-gray-200 p-6 flex flex-col justify-between min-h-[140px]">
                    <span class="text-[10px] text-gray-400 font-medium tracking-widest uppercase mb-4">Pending (ยังไม่มา)</span>
                    <div class="flex items-baseline gap-2">
                        <span id="pending-count" class="text-5xl font-light tabular-nums text-gray-400 tracking-tight">0</span>
                        <span class="text-sm text-gray-300 font-light">คน</span>
                    </div>
                </div>
            </div>

            <!-- Check-in List -->
            <div class="flex-grow flex flex-col animate-fade-in mt-4" style="animation-delay: 0.2s;">
                <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-2">
                    <h3 class="text-xs font-semibold tracking-widest text-black uppercase">Recent Check-ins</h3>
                    <span class="text-[10px] text-gray-400 tracking-widest uppercase">50 ล่าสุด</span>
                </div>
                
                <div class="relative flex-grow min-h-[300px]">
                    <!-- Loading State -->
                    <div id="loading-state" class="absolute inset-0 flex flex-col items-center justify-center bg-white z-20">
                        <svg class="animate-spin w-6 h-6 text-gray-300 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        <p class="text-xs text-gray-400 font-light tracking-widest uppercase">Syncing Data...</p>
                    </div>
                    
                    <!-- List Content -->
                    <div id="list-content" class="space-y-0 h-full overflow-y-auto pr-2 pb-10"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // =======================================================
        // ⚠️ นำ URL ของ Web App จาก Google Apps Script มาใส่ตรงนี้
        // =======================================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5t9-U10-PZ5L_mXk3a9w1sN3G2L_-vU3W5zH3B7_aA4L8wL9C_rV4X5P7X9Q4w/exec";
        
        let currentTotal = 0;
        let currentCheckedIn = 0;
        let currentPending = 0;
        let renderedRecords = new Set();
        let isFirstLoad = true;
        let pollingInterval = null;

        const listContent = document.getElementById('list-content');
        const loadingState = document.getElementById('loading-state');
        const totalCountEl = document.getElementById('total-count');
        const checkedInCountEl = document.getElementById('checked-in-count');
        const pendingCountEl = document.getElementById('pending-count');
        const statusIndicator = document.getElementById('status-indicator');
        const updateStatusEl = document.getElementById('update-status');

        // --- ระบบ Authentication ---
        window.onload = () => {
            if (sessionStorage.getItem('dashboard_admin_logged_in') === 'true') {
                const adminName = sessionStorage.getItem('dashboard_admin_name');
                if(document.getElementById('admin-name-display')) {
                    document.getElementById('admin-name-display').innerText = adminName;
                }
                showDashboard();
            }
        };

        async function checkAdminLogin() {
            const pin = document.getElementById('pin-input').value;
            const btnText = document.getElementById('btn-login-text');
            const errorEl = document.getElementById('login-error');
            const container = document.getElementById('pin-container');
            
            if (!pin || pin.length < 4) {
                showLoginError("PIN 4 digits minimum");
                return;
            }

            btnText.innerHTML = '<svg class="animate-spin w-5 h-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span class="ml-2">AUTHENTICATING...</span>';
            errorEl.classList.remove('opacity-100');

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "adminLogin", pin: pin }),
                    redirect: 'follow'
                });
                
                const res = await response.json();
                if (res.status === "success") {
                    sessionStorage.setItem('dashboard_admin_logged_in', 'true');
                    sessionStorage.setItem('dashboard_admin_name', res.staffName);
                    
                    if(document.getElementById('admin-name-display')) {
                        document.getElementById('admin-name-display').innerText = "Admin: " + res.staffName;
                    }
                    
                    btnText.innerHTML = "SUCCESS";
                    setTimeout(() => showDashboard(), 400);
                } else {
                    btnText.innerHTML = "LOGIN";
                    showLoginError(res.message);
                }
            } catch (err) {
                btnText.innerHTML = "LOGIN";
                showLoginError("CONNECTION FAILED");
            }
        }

        function showLoginError(msg) {
            const errorEl = document.getElementById('login-error');
            const container = document.getElementById('pin-container');
            errorEl.innerText = msg;
            errorEl.classList.add('opacity-100');
            document.getElementById('pin-input').value = '';
            container.classList.remove('animate-shake');
            void container.offsetWidth; 
            container.classList.add('animate-shake');
        }

        function showDashboard() {
            document.getElementById('login-screen').classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-app').classList.remove('hidden');
                document.getElementById('dashboard-app').classList.add('flex');
                
                // เริ่มดึงข้อมูลเมื่อล็อกอินสำเร็จเท่านั้น
                fetchAttendanceData();
                pollingInterval = setInterval(fetchAttendanceData, 4000);
            }, 300);
        }

        function logout() {
            sessionStorage.removeItem('dashboard_admin_logged_in');
            sessionStorage.removeItem('dashboard_admin_name');
            clearInterval(pollingInterval);
            location.reload();
        }

        // --- ระบบ Dashboard Real-time ---
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeOutExpo = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
                let current = Math.floor(start + (end - start) * easeOutExpo);
                
                if (current < start && start === 0) current = 0;
                obj.innerHTML = current;
                
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end;
                }
            };
            window.requestAnimationFrame(step);
        }

        function parseCustomDate(timeStr) {
            try {
                const parts = timeStr.split(' ');
                const dateParts = parts[0].split('/');
                const timeParts = parts[1].split(':');
                return new Date(dateParts[2] - 543, dateParts[1] - 1, dateParts[0], timeParts[0], timeParts[1], timeParts[2]).getTime();
            } catch(e) {
                return 0;
            }
        }

        function createRecordItem(person, indexNumber, isNew) {
            const div = document.createElement('div');
            const newClass = (isNew && !isFirstLoad) ? 'highlight-row' : '';
            div.className = `flex items-start justify-between py-4 border-b border-gray-100 last:border-0 ${newClass}`;
            
            const displayId = person.studentId ? person.studentId : (person.name || '-');
            const displayName = person.studentId ? person.name : '';
            const timeOnly = person.timeStr.split(' ')[1] || person.timeStr;

            div.innerHTML = `
                <div class="flex items-start gap-4">
                    <span class="text-gray-300 font-light text-sm w-8 pt-0.5">${indexNumber}.</span>
                    <div class="flex flex-col">
                        <span class="font-medium text-black text-sm tracking-wide uppercase">${displayId}</span>
                        ${displayName && displayName !== 'ไม่พบชื่อในระบบ' ? `<span class="text-xs text-gray-500 font-light mt-0.5">${displayName}</span>` : ''}
                        ${displayName === 'ไม่พบชื่อในระบบ' ? `<span class="text-[10px] text-gray-400 font-light mt-0.5 italic">ไม่พบชื่อในฐานข้อมูล</span>` : ''}
                    </div>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-[10px] text-gray-400 font-light tracking-widest pt-0.5 tabular-nums">${timeOnly}</span>
                    ${isNew && !isFirstLoad ? '<span class="text-[8px] bg-black text-white px-2 py-0.5 mt-1.5 tracking-widest rounded-sm">NEW</span>' : ''}
                </div>
            `;
            return div;
        }

        async function fetchAttendanceData() {
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL + "?action=getAttendance");
                const result = await response.json();

                if (result.status === "success") {
                    updateDashboard(result);
                    
                    updateStatusEl.innerText = "REAL-TIME SYNC";
                    updateStatusEl.classList.remove('text-red-400');
                    statusIndicator.className = "w-2 h-2 rounded-full bg-black animate-pulse";
                }
            } catch (error) {
                updateStatusEl.innerText = "CONNECTION LOST";
                updateStatusEl.classList.add('text-red-400');
                statusIndicator.className = "w-2 h-2 rounded-full bg-red-500";
            }
        }

        function updateDashboard(data) {
            if (loadingState) loadingState.style.display = 'none';

            if (data.total !== currentTotal) {
                animateValue(totalCountEl, currentTotal, data.total, 800);
                currentTotal = data.total;
            }
            if (data.checkedIn !== currentCheckedIn) {
                animateValue(checkedInCountEl, currentCheckedIn, data.checkedIn, 800);
                currentCheckedIn = data.checkedIn;
            }
            
            const pendingCalc = Math.max(0, data.total - data.checkedIn);
            if (pendingCalc !== currentPending) {
                animateValue(pendingCountEl, currentPending, pendingCalc, 800);
                currentPending = pendingCalc;
            }

            let checkInList = data.data;
            checkInList.sort((a, b) => parseCustomDate(b.timeStr) - parseCustomDate(a.timeStr));

            if (checkInList.length === 0) {
                listContent.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-[200px] text-center">
                        <p class="text-xs text-gray-400 tracking-widest uppercase font-light">ยังไม่มีผู้ลงทะเบียนเช็คอิน</p>
                    </div>`;
                return;
            }

            let indexCounter = currentCheckedIn;

            if (isFirstLoad) {
                listContent.innerHTML = '';
                let firstLoadIndex = currentCheckedIn;
                checkInList.forEach(person => {
                    const uid = person.studentId + person.timeStr;
                    renderedRecords.add(uid);
                    const itemElement = createRecordItem(person, firstLoadIndex, false);
                    listContent.appendChild(itemElement);
                    firstLoadIndex--;
                });
            } else {
                for (let i = checkInList.length - 1; i >= 0; i--) {
                    const person = checkInList[i];
                    const uid = person.studentId + person.timeStr;
                    if (!renderedRecords.has(uid)) {
                        renderedRecords.add(uid);
                        const itemElement = createRecordItem(person, currentCheckedIn, true);
                        listContent.prepend(itemElement);
                    }
                }
            }
            isFirstLoad = false;
        }
    </script>
</body>
</html>
