<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance</title>
    <!-- ใช้ฟอนต์ Prompt ซึ่งเป็นฟอนต์ยอดนิยมสำหรับงานดีไซน์โมเดิร์น[span_4](start_span)[span_4](end_span) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Prompt', sans-serif;
            background: radial-gradient(circle at 50% 50%, #1a1c23 0%, #050608 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 24px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .status-pill {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            padding: 0.4rem 1.2rem;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            display: inline-block;
        }
        h1 { font-size: 2rem; margin-bottom: 1rem; }
        p { color: #a0aab8; line-height: 1.7; margin-bottom: 2rem; }
        .progress-bar { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: #00d4ff; width: 60%; animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .footer-text { margin-top: 2rem; font-size: 0.85rem; color: #777; }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="status-pill">System Maintenance</div>
        <h1>กำลังอัปเกรดระบบ</h1>
        <p>เพื่อประสิทธิภาพที่ยอดเยี่ยมยิ่งขึ้น เรากำลังพัฒนาและปรับปรุงระบบในขณะนี้ คาดว่าจะกลับมาให้บริการได้ในไม่ช้า</p>
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <div class="footer-text">
            ขอบคุณที่เข้าใจและร่วมเป็นส่วนหนึ่งในการพัฒนาของเรา<br>
            <strong>คณะกรรมการชุมนุมฟาร์มนิสิต ปีการศึกษา 2569</strong>
        </div>
    </div>
</body>
</html>
