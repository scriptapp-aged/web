<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@200;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00f2ff; --bg: #050505; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Prompt', sans-serif;
            background: var(--bg);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* กราฟิกพื้นหลังแบบเคลื่อนไหว */
        .blob {
            position: absolute; width: 500px; height: 500px;
            background: linear-gradient(135deg, var(--accent), #7000ff);
            filter: blur(150px); border-radius: 50%;
            animation: float 10s infinite ease-in-out;
            z-index: 0;
        }

        @keyframes float { 
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(100px, 100px); }
        }

        .container {
            position: relative; z-index: 1;
            text-align: left;
            max-width: 900px;
            padding: 2rem;
        }

        h1 { font-size: 5rem; font-weight: 700; line-height: 1; margin-bottom: 2rem; }
        
        .status-tag {
            border: 1px solid var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            color: var(--accent);
            display: inline-block;
            margin-bottom: 1rem;
        }

        .footer-text {
            margin-top: 3rem;
            border-top: 1px solid #333;
            padding-top: 1rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="blob"></div>
    <div class="container">
        <div class="status-tag">● ระบบกำลังพัฒนาประสิทธิภาพ</div>
        <h1>UPGRADING<br>THE SYSTEM</h1>
        <p>เรากำลังปรับปรุงโครงสร้างพื้นฐานใหม่ทั้งหมด เพื่อประสบการณ์ที่รวดเร็วและปลอดภัยยิ่งกว่าเดิม</p>
        <div class="footer-text">
            คณะกรรมการชุมนุมฟาร์มนิสิต ปีการศึกษา 2569
        </div>
    </div>
</body>
</html>
