<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@200;400;800&display=swap" rel="stylesheet">
    <style>
        :root { --glow: #00f2ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Prompt', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        .hero-text {
            position: absolute;
            font-size: 15vw;
            font-weight: 800;
            color: rgba(255,255,255,0.03);
            z-index: 0;
            pointer-events: none;
            user-select: none;
        }

        .glass-card {
            position: relative;
            z-index: 1;
            padding: 4rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            text-align: center;
            max-width: 700px;
        }

        h1 { font-size: 3rem; margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .accent { color: var(--glow); }

        .loader-line {
            width: 100%; height: 2px; background: #333; margin: 2rem 0;
            position: relative; overflow: hidden;
        }
        .loader-line::after {
            content: ''; position: absolute; left: -100%; width: 50%; height: 100%;
            background: var(--glow); animation: move 2s infinite linear;
        }
        @keyframes move { to { left: 100%; } }

        .footer { margin-top: 2rem; font-weight: 200; letter-spacing: 3px; color: #888; }
    </style>
</head>
<body>
    <div class="hero-text">SYSTEM</div>
    <div class="glass-card">
        <h1>UNDER <span class="accent">MAINTENANCE</span></h1>
        <div class="loader-line"></div>
        <p>กำลังอัปเกรดประสิทธิภาพระบบ เพื่อประสบการณ์ที่ดีที่สุดของนิสิตเกษตร</p>
        <div class="footer">คณะกรรมการชุมนุมฟาร์มนิสิต ปีการศึกษา 2569</div>
    </div>
</body>
</html>
