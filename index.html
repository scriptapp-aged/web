<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance | Farm Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-dim: #6b7280;
            --accent: #3b82f6;
            --accent-light: #bfdbfe;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            /* ปรับให้เต็มความสูงหน้าจอ */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            width: 100vw;
        }

        .main-card {
            background: var(--card-bg);
            padding: 5rem 4rem;
            border-radius: 40px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
            text-align: center;
            /* ปรับความกว้างให้รองรับหน้าจอขนาดใหญ่ */
            max-width: 900px;
            width: 100%;
            border: 1px solid #f3f4f6;
            transition: all 0.3s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .main-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.1);
        }

        .content-container { position: relative; z-index: 1; }

        .icon-loader {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: var(--accent);
        }
        .icon-loader span { animation: rotate 10s linear infinite; }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        h1 {
            font-size: 3.5rem; /* ปรับขนาดตัวอักษรให้ใหญ่ขึ้น */
            margin-bottom: 2rem;
            background: linear-gradient(90deg, var(--accent), #8b5cf6, var(--accent));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlow 5s linear infinite;
        }
        @keyframes textGlow { to { background-position: 200% center; } }

        p {
            font-size: 1.5rem; /* ปรับขนาดคำอธิบาย */
            color: var(--text-dim);
            line-height: 1.8;
            margin-bottom: 4rem;
            max-width: 700px; /* ขยายความกว้างส่วนข้อความ */
            margin-left: auto;
            margin-right: auto;
        }

        .footer-org {
            display: inline-block;
            padding: 1rem 3rem;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 50px;
            color: #4b5563;
            font-weight: 400;
            font-size: 1.25rem; /* ปรับขนาดฟอนต์ footer */
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="content-container">
            <div class="icon-loader">
                <span>⚙️</span>
            </div>
            <h1>กำลังปรับปรุงระบบ</h1>
            <p>ทีมงานกำลังอัปเกรดโครงสร้างพื้นฐานระบบให้ทรงประสิทธิภาพ เพื่อรองรับทุกกิจกรรมของนิสิตเกษตรได้อย่างราบรื่นและปลอดภัย</p>
            <div class="footer-org">
                คณะกรรมการชุมนุมฟาร์มนิสิต ปีการศึกษา 2569
            </div>
        </div>
    </div>
</body>
</html>
