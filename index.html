<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>System Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@200;400;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Prompt', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* แสงตามเมาส์[span_7](start_span)[span_7](end_span) */
        #cursor-glow { position: fixed; width: 400px; height: 400px; background: radial-gradient(circle, rgba(0,242,255,0.15) 0%, transparent 70%); border-radius: 50%; pointer-events: none; z-index: 0; transform: translate(-50%, -50%); }

        .card { 
            position: relative; z-index: 1; padding: 5rem; border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(255,255,255,0.03); backdrop-filter: blur(40px); border-radius: 80px; text-align: center;
        }

        h1 { font-size: 5rem; text-transform: uppercase; margin-bottom: 2rem; letter-spacing: -5px; }
        .accent { color: #00f2ff; text-shadow: 0 0 30px #00f2ff; }
        
        .pulse-btn { 
            padding: 1rem 3rem; border: 2px solid #00f2ff; border-radius: 50px; 
            color: #00f2ff; font-weight: 800; display: inline-block; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0,242,255,0.4); } 70% { box-shadow: 0 0 0 20px rgba(0,242,255,0); } }

        .footer { margin-top: 4rem; color: #555; letter-spacing: 5px; font-weight: 200; }
    </style>
</head>
<body>
    <div id="cursor-glow"></div>
    <div class="card">
        <h1>SYSTEM <span class="accent">ACTIVE</span></h1>
        <div class="pulse-btn">OPTIMIZING...</div>
        <p style="margin-top: 2rem; color: #888;">เรากำลังปรับแต่งทุกส่วนประกอบของระบบให้สมบูรณ์แบบที่สุด</p>
        <div class="footer">คณะกรรมการชุมนุมฟาร์มนิสิต ปีการศึกษา 2569</div>
    </div>

    <script>
        document.addEventListener('mousemove', e => {
            const glow = document.getElementById('cursor-glow');
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
