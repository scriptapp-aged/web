<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสั่งซื้อเสื้อ</title>

    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@200;300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Mitr', sans-serif;
            border-radius: 0 !important; /* คงคอนเซปต์ไร้ความโค้งมน */
        }

        body {
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .wrapper {
            max-width: 900px;
            width: 100%;
            padding: 0 20px;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1rem;
            color: #888888;
            font-weight: 300;
            margin-bottom: 60px;
            letter-spacing: 0.5px;
        }

        .countdown-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 120px;
        }

        .countdown-num {
            font-size: 6rem;
            font-weight: 200;
            line-height: 1;
            color: #111111;
            margin-bottom: 15px;
            font-variant-numeric: tabular-nums; /* ให้ตัวเลขขยับไม่กระตุก */
        }

        .countdown-unit {
            font-size: 0.85rem;
            font-weight: 400;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .separator {
            font-size: 4rem;
            font-weight: 200;
            color: #e5e5e5;
            margin-top: -30px;
        }

        #redirect-message {
            display: none;
            margin-top: 50px;
            font-size: 1.1rem;
            color: #111111;
            font-weight: 300;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @media (max-width: 768px) {
            .countdown-row {
                gap: 10px;
            }
            .countdown-num {
                font-size: 3.5rem;
            }
            .separator {
                font-size: 2.5rem;
                margin-top: -20px;
            }
            .countdown-item {
                min-width: 70px;
            }
            .title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1 class="title">ระบบสั่งซื้อเสื้อปฏิบัติการฟาร์ม</h1>
        <p class="subtitle" id="date-text">ระบบเปิดวันอาทิตย์ที่ 14 มิถุนายน 2569 เวลา 10:00 น.</p>

        <div class="countdown-row" id="timer-grid">
            <div class="countdown-item">
                <span class="countdown-num" id="days">00</span>
                <span class="countdown-unit">วัน</span>
            </div>
            
            <div class="separator">:</div>

            <div class="countdown-item">
                <span class="countdown-num" id="hours">00</span>
                <span class="countdown-unit">ชั่วโมง</span>
            </div>

            <div class="separator">:</div>

            <div class="countdown-item">
                <span class="countdown-num" id="mins">00</span>
                <span class="countdown-unit">นาที</span>
            </div>

            <div class="separator">:</div>

            <div class="countdown-item">
                <span class="countdown-num" id="secs">00</span>
                <span class="countdown-unit">วินาที</span>
            </div>
        </div>

        <div id="redirect-message">กำลังเข้าสู่ระบบสั่งซื้อ...</div>
    </div>

    <script>
        const countDownDate = new Date("June 14, 2026 10:00:00").getTime();
        const redirectUrl = "https://scriptapp-aged.github.io/web/lorder-shirt.html";

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;
            
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("mins").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("secs").innerText = seconds.toString().padStart(2, '0');
            
            if (distance <= 0) {
                clearInterval(timer);
                
                // ตั้งค่าตัวเลขเป็น 00 ทั้งหมด
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("mins").innerText = "00";
                document.getElementById("secs").innerText = "00";
                
                // ซ่อนวันที่ และแสดงข้อความพาเข้าสู่ระบบ
                document.getElementById("date-text").style.opacity = "0";
                document.getElementById("redirect-message").style.display = "block";
                
                // ทำการ Redirect
                window.location.href = redirectUrl;
            }
        }, 1000);
    </script>

</body>
</html>
