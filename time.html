<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เตรียมเปิดระบบสั่งซื้อเสื้อ</title>

    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Mitr', sans-serif;
            border-radius: 0 !important; /* เน้นความมินิมอลด้วยขอบเหลี่ยมคมชัด */
        }

        body {
            background-color: #fcfcfc;
            color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .countdown-container {
            background: #ffffff;
            padding: 60px 50px;
            text-align: center;
            max-width: 650px;
            width: 90%;
            border: 1px solid #e5e5e5;
            box-shadow: 10px 10px 0px #111111;
        }

        .title {
            font-size: 1.75rem;
            font-weight: 600;
            color: #111111;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1rem;
            color: #737373;
            margin-bottom: 45px;
            font-weight: 300;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 40px;
        }

        .countdown-box {
            background: #ffffff;
            border: 1px solid #111111;
            padding: 25px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.3s ease;
        }

        .countdown-box:hover {
            background: #111111;
            color: #ffffff;
        }

        .countdown-num {
            display: block;
            font-size: 3rem;
            font-weight: 500;
            line-height: 1;
            margin-bottom: 10px;
            color: inherit;
        }

        .countdown-unit {
            display: block;
            font-size: 0.8rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: inherit;
        }

        .countdown-box:hover .countdown-unit {
            color: #cccccc;
        }

        .status-message {
            font-size: 1.1rem;
            font-weight: 400;
            color: #555555;
            height: 30px;
            border-top: 1px dashed #e5e5e5;
            padding-top: 30px;
        }

        @media (max-width: 600px) {
            .countdown-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .countdown-container {
                padding: 40px 30px;
            }
            .title {
                font-size: 1.5rem;
            }
            .countdown-num {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="countdown-container">
        <h1 class="title">เตรียมพบกับระบบสั่งซื้อเสื้อปฏิบัติการฟาร์ม</h1>
        <p class="subtitle">ระบบจะเปิดอัตโนมัติในวันที่ 14 มิถุนายน 2569 เวลา 10:00 น.</p>

        <div class="countdown-grid" id="timer-grid">
            <div class="countdown-box">
                <span class="countdown-num" id="days">00</span>
                <span class="countdown-unit">วัน</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-num" id="hours">00</span>
                <span class="countdown-unit">ชั่วโมง</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-num" id="mins">00</span>
                <span class="countdown-unit">นาที</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-num" id="secs">00</span>
                <span class="countdown-unit">วินาที</span>
            </div>
        </div>

        <div class="status-message" id="status-text">กำลังนับถอยหลัง...</div>
    </div>

    <script>
        const countDownDate = new Date("June 14, 2026 10:00:00").getTime();
        
        const redirectUrl = "https://scriptapp-aged.github.io/web/lorder-shirt.html";

        const x = setInterval(function() {

            const now = new Date().getTime();
            const distance = countDownDate - now;
            
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("mins").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("secs").innerText = seconds.toString().padStart(2, '0');
            
            if (distance <= 0) {
                clearInterval(x);
                
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("mins").innerText = "00";
                document.getElementById("secs").innerText = "00";
                
                document.getElementById("status-text").innerHTML = "เปิดระบบแล้ว! กำลังพาท่านไปยังหน้าสั่งซื้อ...";
                document.getElementById("status-text").style.color = "#111111";
                document.getElementById("status-text").style.fontWeight = "500";
                
                window.location.href = redirectUrl;
            }
        }, 1000);
    </script>

</body>
</html>
