<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KU86 | นิสิตใหม่</title>

<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@200;300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

:root{
  --ku-green:#006633;
  --primary:#00ff88;
  --dark:#0f172a;
  --gray:#64748b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Mitr',sans-serif;
  border-radius:0 !important;
}

body{
  background:#ffffff;
  color:var(--dark);
  overflow-x:hidden;
  background-image:
    radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
  background-size:40px 40px;
}

/* ===== MOURNING RIBBON ===== */
.mourning-ribbon {
  position: fixed;
  top: 25px;
  left: 25px;
  width: 70px;
  height: auto;
  z-index: 9999;
  opacity: 0.9;
  pointer-events: none; /* เพื่อไม่ให้รูปบังการคลิกองค์ประกอบอื่นๆ */
}

/* ===== Background Glow ===== */

.bg-blob{
  position:fixed;
  width:650px;
  height:650px;
  background:
    radial-gradient(
      circle,
      rgba(0,255,136,.14) 0%,
      transparent 70%
    );
  filter:blur(100px);
  z-index:-1;
  top:-150px;
  right:-120px;
  animation:blobMove 14s ease-in-out infinite alternate;
}

@keyframes blobMove{
  from{ transform:translateY(0) scale(1); }
  to{ transform:translateY(140px) scale(1.2); }
}

/* ===== HERO ===== */

.hero{
  min-height:60vh;
  padding:120px 20px 40px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero-content{
  max-width:1100px;
}

.tag{
  display:inline-block;
  padding:12px 30px;
  background:rgba(255,255,255,.6);
  border:1px solid #e2e8f0;
  backdrop-filter:blur(10px);
  color:var(--ku-green);
  letter-spacing:2px;
  font-size:.9rem;
  margin-bottom:25px;
}

.hero h1{
  font-size:clamp(4rem,11vw,8rem);
  line-height:.9;
  background:
    linear-gradient(
      90deg,
      #0f172a,
      #006633,
      #00ff88,
      #0f172a
    );
  background-size:300%;
  -webkit-background-clip:text;
  color:transparent;
  animation:textFlow 10s linear infinite;
}

@keyframes textFlow{
  to{ background-position:300%; }
}

.hero-subtitle{
  margin-top:25px;
  color:var(--ku-green);
  font-size:1.05rem;
  letter-spacing:4px;
  font-weight:500;
  opacity:.9;
}

/* ===== IMAGE POPUP ===== */

.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
  padding:30px;
}

.popup.active{
  display:flex;
}

.popup img{
  max-width:95%;
  max-height:90vh;
  object-fit:contain;
}

/* ===== NEW MODERN POPUP ===== */

.info-popup{
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.78);
  backdrop-filter:blur(12px);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:10000;
  padding:25px;
}

.info-popup.active{
  display:flex;
}

.info-box{
  position:relative;
  width:min(95%,700px);
  overflow:hidden;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.98),
      rgba(248,250,252,.96)
    );
  border:1px solid rgba(255,255,255,.45);
  box-shadow:
    0 40px 120px rgba(0,0,0,.28);
  animation:popupShow .45s cubic-bezier(.2,1,.2,1);
}

.info-box::before{
  content:"";
  position:absolute;
  top:-180px;
  right:-120px;
  width:420px;
  height:420px;
  background:
    radial-gradient(
      circle,
      rgba(0,255,136,.22),
      transparent 70%
    );
  filter:blur(70px);
}

.popup-inner{
  position:relative;
  z-index:2;
  padding:55px;
}

.popup-badge{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 18px;
  background:rgba(0,102,51,.08);
  color:#006633;
  font-size:.9rem;
  margin-bottom:22px;
}

.popup-title{
  font-size:clamp(2rem,4vw,3rem);
  line-height:1;
  color:#0f172a;
  margin-bottom:18px;
}

.popup-desc{
  color:#475569;
  line-height:1.9;
  margin-bottom:35px;
}

.popup-date-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  margin-bottom:35px;
}

.popup-date-card{
  padding:22px;
  background:white;
  border:1px solid rgba(15,23,42,.08);
  box-shadow:0 10px 30px rgba(15,23,42,.06);
}

.popup-date-card h4{
  color:#006633;
  margin-bottom:12px;
}

.popup-date-card p{
  line-height:1.7;
}

.popup-actions{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
}

.popup-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:15px 26px;
  text-decoration:none;
  color:white;
  background:
    linear-gradient(
      135deg,
      #006633,
      #00cc77
    );
  transition:.35s ease;
}

.popup-btn:hover{
  transform:translateY(-4px);
}

.close-info,
.close-popup{
  position:absolute;
  top:22px;
  right:24px;
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(15,23,42,.06);
  color:#0f172a;
  font-size:1.2rem;
  cursor:pointer;
  z-index:5;
}

@keyframes popupShow{
  from{
    opacity:0;
    transform:translateY(40px) scale(.92);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* ===== MOBILE ===== */

@media(max-width:768px){

  .mourning-ribbon {
    width: 50px;
    top: 15px;
    left: 15px;
  }

  .hero{
    min-height:45vh;
    padding:100px 20px 20px;
  }

  .popup-inner{
    padding:38px 26px;
  }

  .popup-actions{
    flex-direction:column;
  }

  .popup-btn{
    width:100%;
  }

}

</style>
</head>

<body>

<img src="โบว์.png" alt="Black Ribbon" class="mourning-ribbon">

<div class="bg-blob"></div>

<section class="hero">
  <div class="hero-content">

    <div class="tag">
      Department of Human and Community Resource Development
    </div>

    <h1>นิสิตใหม่ AG-ED57</h1>

    <div class="hero-subtitle">
      ยินดีต้อนรับ KU86 • EDS26 • AG-ED57
    </div>

  </div>
</section>

<div class="popup" id="popup">

  <span class="close-popup" onclick="closePopup()">
    <i class="fa-solid fa-xmark"></i>
  </span>

  <img id="popup-img" src="">

</div>

<div class="info-popup" id="infoPopup">

  <div class="info-box">

    <span class="close-info" onclick="closeInfoPopup()">
      <i class="fa-solid fa-xmark"></i>
    </span>

    <div id="popupContent"></div>

  </div>

</div>

<script>

/* ===== IMAGE POPUP ===== */

function openPopup(imageSrc){
  document.getElementById("popup").classList.add("active");
  document.getElementById("popup-img").src = imageSrc;
}

function closePopup(){
  document.getElementById("popup").classList.remove("active");
}

document.getElementById("popup").addEventListener("click", function(e){
  if(e.target.id === "popup"){
    closePopup();
  }
});

/* ===== CLOSE INFO POPUP ===== */

function closeInfoPopup(){
  document.getElementById("infoPopup").classList.remove("active");
}

document.getElementById("infoPopup").addEventListener("click", function(e){
  if(e.target.id === "infoPopup"){
    closeInfoPopup();
  }
});

</script>

</body>
</html>
