<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KU86 | นิสิตใหม่</title>

<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@200;300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

:root{
  --ku-green:#006633;
  --primary:#00ff88;
  --dark:#0f172a;
  --gray:#64748b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Mitr',sans-serif;
  border-radius:0 !important;
}

body{
  background:#ffffff;
  color:var(--dark);
  overflow-x:hidden;

  background-image:
    radial-gradient(#e2e8f0 1.5px, transparent 1.5px);

  background-size:40px 40px;
}

/* ===== Background Glow ===== */

.bg-blob{
  position:fixed;
  width:650px;
  height:650px;
  background:
    radial-gradient(
      circle,
      rgba(0,255,136,.14) 0%,
      transparent 70%
    );
  filter:blur(100px);
  z-index:-1;
  top:-150px;
  right:-120px;
  animation:blobMove 14s ease-in-out infinite alternate;
}

@keyframes blobMove{
  from{ transform:translateY(0) scale(1); }
  to{ transform:translateY(140px) scale(1.2); }
}

/* ===== HERO ===== */

.hero{
  min-height:60vh;
  padding:120px 20px 40px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero-content{
  max-width:1100px;
}

.tag{
  display:inline-block;
  padding:12px 30px;
  background:rgba(255,255,255,.6);
  border:1px solid #e2e8f0;
  backdrop-filter:blur(10px);
  color:var(--ku-green);
  letter-spacing:2px;
  font-size:.9rem;
  margin-bottom:25px;
}

.hero h1{
  font-size:clamp(4rem,11vw,8rem);
  line-height:.9;
  background:
    linear-gradient(
      90deg,
      #0f172a,
      #006633,
      #00ff88,
      #0f172a
    );
  background-size:300%;
  -webkit-background-clip:text;
  color:transparent;
  animation:textFlow 10s linear infinite;
}

@keyframes textFlow{
  to{ background-position:300%; }
}

.hero-subtitle{
  margin-top:25px;
  color:var(--ku-green);
  font-size:1.05rem;
  letter-spacing:4px;
  font-weight:500;
  opacity:.9;
}

/* ===== Banner Section ===== */

.banner-section{
  max-width:1380px;
  margin:auto;
  padding:0 20px 90px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:30px;
}

.banner-container{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  background:#0f172a;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:
    0 50px 120px rgba(0,0,0,.20),
    0 0 0 1px rgba(255,255,255,.03) inset;
  transition:1s cubic-bezier(.2,1,.2,1);
  cursor:pointer;
}

.banner-container:hover{
  transform: translateY(-12px) scale(1.01);
}

.banner-glow{
  position:absolute;
  inset:-150px;
  background:
    radial-gradient(
      circle at center,
      rgba(0,255,136,.25),
      transparent 60%
    );
  filter:blur(100px);
  z-index:1;
  animation:glowMove 6s ease-in-out infinite;
}

@keyframes glowMove{
  0%,100%{ transform:scale(1); opacity:.65; }
  50%{ transform:scale(1.2); opacity:1; }
}

.banner-container img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  filter: brightness(.72) contrast(1.08) saturate(1.12);
  transition:1.2s ease;
}

.banner-container:hover img{
  transform:scale(1.08);
}

.banner-overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to top,
      rgba(15,23,42,.94),
      rgba(15,23,42,.40),
      rgba(15,23,42,.08)
    );
  display:flex;
  align-items:flex-end;
  padding:45px;
  z-index:2;
}

.banner-content{
  max-width:700px;
}

.banner-overlay h2{
  color:white;
  font-size:clamp(1.5rem,3vw,3rem);
  line-height:1.1;
  margin-bottom:12px;
  text-shadow: 0 15px 35px rgba(0,0,0,.35);
}

.banner-overlay p{
  color:rgba(255,255,255,.78);
  font-size:.9rem;
  letter-spacing:1px;
  font-weight:300;
}

/* ===== Popup ===== */

.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
  padding:30px;
}

.popup.active{
  display:flex;
}

.popup img{
  max-width:95%;
  max-height:90vh;
  object-fit:contain;
  box-shadow: 0 30px 80px rgba(0,0,0,.5);
  animation:popupShow .4s ease;
}

@keyframes popupShow{
  from{ opacity:0; transform:scale(.8); }
  to{ opacity:1; transform:scale(1); }
}

.close-popup{
  position:absolute;
  top:30px;
  right:40px;
  color:white;
  font-size:2rem;
  cursor:pointer;
  z-index:10000;
}

/* ===== Responsive ===== */

@media(max-width:900px){
  .banner-section{ grid-template-columns:1fr; }
}

@media(max-width:768px){
  .hero{ min-height:45vh; padding:100px 20px 20px; }
  .hero-subtitle{ font-size:.9rem; letter-spacing:2px; line-height:1.8; }
  .banner-overlay{ padding:24px; }
  .banner-overlay h2{ font-size:1.4rem; line-height:1.1; }
  .banner-overlay p{ font-size:.8rem; }
  .close-popup{ top:15px; right:20px; }
}

</style>
</head>

<body>

<div class="bg-blob"></div>

<!-- ===== HERO ===== -->
<section class="hero">
  <div class="hero-content">
    <div class="tag">
      KASETSART UNIVERSITY KAMPHAENG SAEN
    </div>
    <h1>นิสิตใหม่ KU86</h1>
    <div class="hero-subtitle">
      KU86 • EDS26 • AG-ED57
    </div>
  </div>
</section>

<!-- ===== BANNERS ===== -->
<section class="banner-section">
  <div class="banner-container" onclick="openPopup('120.png')">
    <div class="banner-glow"></div>
    <img src="120.png" alt="Banner 1">
    <div class="banner-overlay">
      <div class="banner-content">
        <h2>WELCOME TO AG-ED</h2>
        <p>Faculty of Education and Development Sciences</p>
      </div>
    </div>
  </div>

  <div class="banner-container" onclick="openPopup('123.png')">
    <div class="banner-glow"></div>
    <img src="123.png" alt="Banner 2">
    <div class="banner-overlay">
      <div class="banner-content">
        <h2>ACTIVITY 2026</h2>
        <p>Agricultural and Environmental Education</p>
      </div>
    </div>
  </div>
</section>

<!-- ===== POPUP ===== -->
<div class="popup" id="popup">
  <span class="close-popup" onclick="closePopup()">
    <i class="fa-solid fa-xmark"></i>
  </span>
  <img id="popup-img" src="">
</div>

<script>
function openPopup(imageSrc){
  document.getElementById("popup").classList.add("active");
  document.getElementById("popup-img").src = imageSrc;
}

function closePopup(){
  document.getElementById("popup").classList.remove("active");
}

document.getElementById("popup").addEventListener("click", function(e){
  if(e.target.id === "popup"){
    closePopup();
  }
});
</script>

</body>
</html>
